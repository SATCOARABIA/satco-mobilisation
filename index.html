            </Field>
            <Field label="ICV Score">
              <input value={draft.icv_score||''} onChange={e=>setDraft(d=>({...d,icv_score:e.target.value}))} placeholder="e.g. 72.5" style={S.input}/>
            </Field>
          </Grid>

          <div style={{fontWeight:700,fontSize:'12px',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'12px',paddingBottom:'8px',borderBottom:'1px solid #e2e8f0',marginTop:'4px'}}>License & VAT</div>
          <Grid cols={3}>
            <Field label="License #">
              <input value={draft.license_number||''} onChange={e=>setDraft(d=>({...d,license_number:e.target.value}))} placeholder="CN-XXXXXXX" style={S.input}/>
            </Field>
            <Field label="License Expiry">
              <input type="date" value={draft.license_expiry||''} onChange={e=>setDraft(d=>({...d,license_expiry:e.target.value}))} style={S.input}/>
            </Field>
            <Field label="VAT Registration #">
              <input value={draft.vat_number||''} onChange={e=>setDraft(d=>({...d,vat_number:e.target.value}))} placeholder="1004XXXXXXXXXXX (15 digits)" style={S.input}/>
            </Field>
          </Grid>

          <div style={{fontWeight:700,fontSize:'12px',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'12px',paddingBottom:'8px',borderBottom:'1px solid #e2e8f0',marginTop:'4px'}}>Contact Details</div>
          <Grid cols={3}>
            <Field label="Contact Person">
              <input value={draft.contact_name||''} onChange={e=>setDraft(d=>({...d,contact_name:e.target.value}))} style={S.input}/>
            </Field>
            <Field label="Email">
              <input type="email" value={draft.contact_email||''} onChange={e=>setDraft(d=>({...d,contact_email:e.target.value}))} style={S.input}/>
            </Field>
            <Field label="Mobile # 1">
              <input value={draft.contact_phone||''} onChange={e=>setDraft(d=>({...d,contact_phone:e.target.value}))} placeholder="050 XXX XXXX" style={S.input}/>
            </Field>
            <Field label="Mobile # 2">
              <input value={draft.contact_phone2||''} onChange={e=>setDraft(d=>({...d,contact_phone2:e.target.value}))} placeholder="050 XXX XXXX" style={S.input}/>
            </Field>
            <Field label="Remarks" span={2}>
              <input value={draft.remarks||''} onChange={e=>setDraft(d=>({...d,remarks:e.target.value}))} style={S.input}/>
            </Field>
          </Grid>

          {/* ── WCI Section ── */}
          <div style={{fontWeight:700,fontSize:'12px',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'12px',paddingBottom:'8px',borderBottom:'1px solid #e2e8f0',marginTop:'4px'}}>
            🛡️ Workmen Compensation Insurance
          </div>
          <Grid cols={4}>
            <Field label="Policy Number">
              <input value={draft.wci_policy_no||''} onChange={e=>setDraft(d=>({...d,wci_policy_no:e.target.value}))} placeholder="e.g. WCI/2025/00123" style={S.input}/>
            </Field>
            <Field label="Insurer / Insurance Co.">
              <input value={draft.wci_insurer||''} onChange={e=>setDraft(d=>({...d,wci_insurer:e.target.value}))} placeholder="e.g. ADNIC, AXA, Daman…" style={S.input}/>
            </Field>
            <Field label="Policy Start Date">
              <input type="date" value={draft.wci_start||''} onChange={e=>setDraft(d=>({...d,wci_start:e.target.value}))} style={S.input}/>
            </Field>
            <Field label="Policy Expiry Date">
              <input type="date" value={draft.wci_expiry||''} onChange={e=>setDraft(d=>({...d,wci_expiry:e.target.value}))}
                style={{...S.input, ...(draft.wci_expiry ? (()=>{const diff=(new Date(draft.wci_expiry)-new Date())/86400000; return diff<0?{borderColor:'#dc2626',background:'#fef2f2'}:diff<90?{borderColor:'#f59e0b',background:'#fffbeb'}:{};})() : {})}}/>
              {draft.wci_expiry && (()=>{
                const diff = Math.ceil((new Date(draft.wci_expiry)-new Date())/86400000);
                if (diff < 0)   return <div style={{fontSize:'10px',color:'#dc2626',fontWeight:700,marginTop:'2px'}}>⚠ EXPIRED {Math.abs(diff)}d ago</div>;
                if (diff < 90)  return <div style={{fontSize:'10px',color:'#b45309',fontWeight:700,marginTop:'2px'}}>⚠ Expiring in {diff} days</div>;
                return <div style={{fontSize:'10px',color:'#166534',marginTop:'2px'}}>✓ Valid ({diff} days)</div>;
              })()}
            </Field>
          </Grid>

          {/* ── Other Documents ── */}
          <div style={{fontWeight:700,fontSize:'12px',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'10px',paddingBottom:'8px',borderBottom:'1px solid #e2e8f0',marginTop:'4px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span>📁 Other Documents</span>
            <button style={{...S.btnSm,fontSize:'11px',display:'flex',alignItems:'center',gap:'4px'}} onClick={addOtherDoc}>
              + Add Document
            </button>
          </div>
          {(draft.other_docs||[]).length === 0 && (
            <div style={{fontSize:'12px',color:'#94a3b8',marginBottom:'12px',padding:'10px 14px',background:'#f8fafc',borderRadius:'8px',border:'1px dashed #e2e8f0'}}>
              No other documents added. Click <strong>+ Add Document</strong> to attach additional certificates, agreements or any other files.
            </div>
          )}
          {(draft.other_docs||[]).map((doc, idx) => (
            <div key={idx} style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr auto',gap:'10px',alignItems:'end',marginBottom:'10px',padding:'12px 14px',background:'#f8fafc',borderRadius:'8px',border:'1px solid #e2e8f0'}}>
              <Field label="Document Name *">
                <input value={doc.doc_name||''} placeholder="e.g. ISO Certificate, Bank Guarantee…"
                  onChange={e=>{const o=[...(draft.other_docs||[])];o[idx]={...o[idx],doc_name:e.target.value};setDraft(d=>({...d,other_docs:o}));}}
                  style={S.input}/>
              </Field>
              <Field label="Expiry Date (if applicable)">
                <input type="date" value={doc.expiry||''}
                  onChange={e=>{const o=[...(draft.other_docs||[])];o[idx]={...o[idx],expiry:e.target.value};setDraft(d=>({...d,other_docs:o}));}}
                  style={S.input}/>
                {doc.expiry && (()=>{
                  const diff = Math.ceil((new Date(doc.expiry)-new Date())/86400000);
                  if (diff < 0)  return <div style={{fontSize:'10px',color:'#dc2626',fontWeight:700,marginTop:'2px'}}>⚠ EXPIRED</div>;
                  if (diff < 90) return <div style={{fontSize:'10px',color:'#b45309',fontWeight:700,marginTop:'2px'}}>⚠ {diff}d remaining</div>;
                  return null;
                })()}
              </Field>
              <Field label="Upload File">
                <label style={{
                  display:'flex', alignItems:'center', gap:'8px',
                  border: `1px dashed ${doc.file_name?'#b8972a':'#cbd5e1'}`,
                  background: doc.file_name ? 'rgba(184,151,42,0.05)' : '#fff',
                  borderRadius:'6px', padding:'7px 10px', cursor:'pointer', fontSize:'12px',
                  color: doc.file_name ? '#b8972a' : '#64748b',
                }}>
                  <input type="file" accept="image/*,application/pdf" style={{display:'none'}}
                    onChange={e=>handleOtherDocUpload(e, idx)}/>
                  {doc.file_name
                    ? <><span style={{fontSize:'14px'}}>📎</span><span style={{fontWeight:600}}>{doc.file_name.slice(0,24)}{doc.file_name.length>24?'…':''}</span></>
                    : <><span>📂</span><span>Choose file (PDF · JPG · PNG)</span></>
                  }
                </label>
              </Field>
              <div style={{paddingBottom:'2px'}}>
                <button style={{...S.btnSm,color:'#dc2626',padding:'7px 10px'}} onClick={()=>removeOtherDoc(idx)} title="Remove this document">✕</button>
              </div>
            </div>
          ))}

          <div style={{display:'flex',gap:'10px',marginTop:'16px',paddingTop:'14px',borderTop:'1px solid #e2e8f0'}}>
            <button style={S.btnPri} onClick={save} disabled={saving}>{saving?'Saving…':'💾 Save Supplier'}</button>
            <button style={S.btnSec} onClick={()=>{ try{localStorage.removeItem('satco_mob_draft_supplier');}catch{} setDraft(null);setShowBanner(false);setAiStatus('');setAiMsg('');window.scrollTo({top:0,behavior:'smooth'}); }}>Cancel</button>
          </div>
        </div>
      </div>
    );
  }

  // ── LIST VIEW ─────────────────────────────────────────────────────────────
  return (
    <div>
      {/* Draft restore banner — shown when component remounts with unsaved data */}
      {showBanner && draft && (
        <DraftBanner draft={draft}
          onRestore={()=>{ setShowBanner(false); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); }}
          onDiscard={()=>{ setDraft(null); setShowBanner(false); }}
        />
      )}

      {/* Stats row */}
      <div style={{display:'flex',gap:'12px',marginBottom:'16px',flexWrap:'wrap'}}>
        {[
          {label:'Total Suppliers', value:stats.total,    bg:'#eff6ff', c:'#1e40af'},
          {label:'Active Licenses', value:stats.active,   bg:'#f0fdf4', c:'#166534'},
          {label:'Expiring ≤90d',   value:stats.expiring, bg:'#fef3c7', c:'#92400e'},
          {label:'Expired',         value:stats.expired,  bg:'#fee2e2', c:'#991b1b'},
        ].map(({label,value,bg,c})=>(
          <div key={label} style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:'10px',padding:'12px 18px',display:'flex',gap:'14px',alignItems:'center',minWidth:'160px',flex:1}}>
            <div>
              <div style={{fontSize:'11px',color:'#64748b'}}>{label}</div>
              <div style={{fontSize:'24px',fontWeight:800,color:'#0f172a'}}>{value}</div>
            </div>
            <div style={{width:36,height:36,borderRadius:'8px',background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px',marginLeft:'auto',flexShrink:0,color:c,fontWeight:800}}>
              {value}
            </div>
          </div>
        ))}
      </div>

      {/* Toolbar */}
      <div ref={toolbarRef} className="sticky-toolbar" style={{padding:'10px 14px',display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap'}}>
        <input placeholder="Search supplier name, code, license…" value={search} onChange={e=>setSearch(e.target.value)}
          style={{...S.input,width:'280px'}}/>
        <MultiSelect options={serviceOpts} selected={serviceF} onChange={setServiceF} placeholder="All services" width="180px"/>
        <MultiSelect options={stateOpts}   selected={stateF}   onChange={setStateF}   placeholder="All states"   width="160px"/>
        <span style={{fontSize:'12px',color:'#64748b',marginLeft:'auto'}}>{filtered.length} supplier{filtered.length!==1?'s':''}</span>
        <button style={S.btnSec} onClick={exportCSV2}>⬇ Export Excel</button>
        <button style={S.btnPri} onClick={()=>{setAiStatus('');setAiMsg('');setShowBanner(false);setDraft({name:'',supplier_code:'',supplier_services:'',address_state:'',license_number:'',license_expiry:'',vat_number:'',icv_score:'',contact_name:'',contact_email:'',contact_phone:'',contact_phone2:'',remarks:'',wci_policy_no:'',wci_insurer:'',wci_expiry:'',wci_start:'',other_docs:[],attachments:{}});}}>+ Add Supplier</button>
      </div>

      {/* Table */}
      <div style={{...S.card,marginTop:0,borderRadius:'0 0 10px 10px'}}>
        <div className="tbl-box" style={{maxHeight:'calc(100vh - var(--stk-2) - 220px)'}}>
          <table style={{borderCollapse:'collapse',tableLayout:'fixed',width:'max-content',minWidth:'100%'}}>
            <colgroup>
              <col style={{width:36}}/>{/* SR */}
              <col style={{width:90}}/>{/* Supplier Code */}
              <col style={{width:280}}/>{/* Vendor Name */}
              <col style={{width:140}}/>{/* Supplier Services */}
              <col style={{width:110}}/>{/* Address State */}
              <col style={{width:110}}/>{/* License # */}
              <col style={{width:120}}/>{/* License Expiry */}
              <col style={{width:155}}/>{/* VAT # */}
              <col style={{width:60}}/>{/* ICV */}
              <col style={{width:120}}/>{/* WCI Expiry */}
              <col style={{width:130}}/>{/* Docs */}
              <col style={{width:200}}/>{/* Email */}
              <col style={{width:200}}/>{/* Contact Person */}
              <col style={{width:130}}/>{/* Mob # */}
              <col style={{width:130}}/>{/* Mob # 2 */}
              <col style={{width:160}}/>{/* Remarks */}
              <col style={{width:90}}/>{/* Actions */}
            </colgroup>
            <thead>
              <tr>
                {['SR','Supplier Code','Vendor Name','Supplier Services','Address State','License #','License Expiry','VAT #','ICV','WCI Expiry','Docs','Email','Contact Person','Mob #','Mob # 2','Remarks',''].map(h=>(
                  <th key={h} style={{...S.th,whiteSpace:'nowrap',position:'sticky',top:0,zIndex:12,background:'#f8fafc'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length===0&&(
                <tr><td colSpan={17} style={{padding:'40px',textAlign:'center',color:'#94a3b8'}}>
                  {suppliers.length===0 ? 'No suppliers yet — click + Add Supplier to get started.' : 'No suppliers match the filters.'}
                </td></tr>
              )}
              {filtered.map((s,i)=>{
                const es = expiryStyle(s.license_expiry);
                return (
                  <tr key={s.id} className="hr-row" style={{height:'36px'}}>
                    <td style={{...S.td,color:'#94a3b8',fontSize:'11px',textAlign:'center',whiteSpace:'nowrap'}}>{i+1}</td>
                    <td style={{...S.td,fontFamily:'monospace',fontSize:'11px',whiteSpace:'nowrap'}}>
                      <span style={{background:'#f1f5f9',padding:'2px 7px',borderRadius:5,fontWeight:700,color:'#0f172a'}}>{s.supplier_code||'—'}</span>
                    </td>
                    <td style={{...S.td,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.name}</td>
                    <td style={{...S.td,fontSize:'12px',whiteSpace:'nowrap'}}>{s.supplier_services||'—'}</td>
                    <td style={{...S.td,fontSize:'12px',whiteSpace:'nowrap'}}>{s.address_state||'—'}</td>
                    <td style={{...S.td,fontFamily:'monospace',fontSize:'11px',whiteSpace:'nowrap'}}>{s.license_number||'—'}</td>
                    <td style={{...S.td,whiteSpace:'nowrap'}}>
                      {s.license_expiry
                        ? <span style={{...es,padding:'2px 8px',borderRadius:6,fontSize:'11px'}}>{fmtDate(s.license_expiry)}</span>
                        : <span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                    <td style={{...S.td,fontFamily:'monospace',fontSize:'11px',whiteSpace:'nowrap'}}>{s.vat_number||'—'}</td>
                    <td style={{...S.td,textAlign:'center',fontSize:'12px',whiteSpace:'nowrap'}}>{s.icv_score||'—'}</td>
                    <td style={{...S.td,whiteSpace:'nowrap'}}>
                      {s.wci_expiry ? (()=>{
                        const es2 = expiryStyle(s.wci_expiry);
                        return <span style={{...es2,padding:'2px 8px',borderRadius:6,fontSize:'11px'}} title={`Policy: ${s.wci_policy_no||'—'} · ${s.wci_insurer||'—'}`}>🛡 {fmtDate(s.wci_expiry)}</span>;

                    </td>
                    <td style={{...S.td,whiteSpace:'nowrap',fontSize:'11px'}}>
                      {(()=>{
                        const atts = s.attachments || {};
                        const otherCount = (s.other_docs||[]).length;
                        const labels = [];

                        if (atts.commercial) labels.push('CL');
                        if (atts.vat)        labels.push('VAT');
                        if (atts.wci)        labels.push('WCI');

                        return labels.length ? <span style={{color:'#b8972a',fontWeight:700}}>📎 {labels.join(' · ')}</span> : <span style={{color:'#94a3b8'}}>—</span>;

function LoginScreen({onLogin}) {
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setErr('');setLoading(true);
    const{error}=await db.auth.signInWithPassword({email,password:pass});
    if(error)setErr(error.message);else onLogin();
    setLoading(false);
  };
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)'}}>
      <div style={{background:'#fff',borderRadius:'12px',padding:'40px',width:'360px',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{textAlign:'center',marginBottom:'28px'}}>
          <div style={{fontSize:'11px',fontWeight:800,color:'#b8972a',letterSpacing:'3px',textTransform:'uppercase',marginBottom:'4px'}}>SATCO Arabia</div>
          <div style={{fontSize:'22px',fontWeight:800,color:'#0f172a'}}>Mobilisation Portal</div>
          <div style={{fontSize:'12px',color:'#64748b',marginTop:'4px'}}>CICPA · Work Permit · Personnel Deployment</div>
        </div>
        <div style={{marginBottom:'14px'}}><label style={S.label}>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} type="email" style={S.input} autoFocus/></div>
        <div style={{marginBottom:'20px'}}><label style={S.label}>Password</label><input value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} type="password" style={S.input}/></div>
        {err&&<div style={{background:'#fee2e2',color:'#991b1b',padding:'8px 10px',borderRadius:'6px',fontSize:'12px',marginBottom:'14px'}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{...S.btnPri,width:'100%',padding:'10px'}}>{loading?'Signing in…':'Sign In'}</button>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  useDragScroll(); // global drag-to-scroll for all .drag-scroll and .tbl-box elements
  const [session,      setSession]      = useState(null);
  const [authReady,    setAuthReady]    = useState(false);
  const [tab,          setTab]          = useState('dashboard');
  const [tableReady,   setTableReady]   = useState(null);
  const [loading,      setLoading]      = useState(true);
  const [filterStatus, setFilterStatus] = useState('');
  const [bulkMobFilter, setBulkMobFilter] = useState(null);
  const [globalSearch, setGlobalSearch] = useState('');
  const [tabSearch,    setTabSearch]    = useState('');

  const [data, setData] = useState({candidates:[],suppliers:[],requirements:[],loaList:[],mobList:[],locConfigs:[],thresholds:[]});
  const [hrMobActive, setHrMobActive] = useState(new Set()); // SATCO employee IDs currently on site per HR portal
  const [hrMobLocs,   setHrMobLocs]   = useState({});        // employee_id → current site location

  // Load HR portal mob_demob active records at app level
  // mob_demob.employee_id is the HR employee_number (e.g. "SA1015") stored as supplier_emp_no in mob_candidates
  useEffect(()=>{
    db.from('mob_demob').select('employee_id,full_name,location,mobilization_date,demobilization_date').is('demobilization_date',null).is('deleted_at',null)
      .then(({data:rows})=>{
        const ids = new Set();
        const locs = {};
        (rows||[]).forEach(r=>{
          if(r.employee_id){ ids.add(String(r.employee_id)); locs[String(r.employee_id)]=r.location||''; }
        });
        setHrMobActive(ids);
        setHrMobLocs(locs);
      });
  },[]);

  // Warn browser tab close if unsaved draft with real data exists
  // Only fires if draft has full_name filled — avoids false trigger during scan
  useEffect(()=>{
    const handler = e => {
      const candRaw = localStorage.getItem('satco_mob_draft_candidate');
      const mobRaw  = localStorage.getItem('satco_mob_draft_mobilisation');
      let hasDraft = false;
      try { if (candRaw) { const d=JSON.parse(candRaw); if(d.full_name) hasDraft=true; } } catch{}
      try { if (mobRaw)  { const d=JSON.parse(mobRaw);  if(d.full_name) hasDraft=true; } } catch{}
      if (hasDraft) {
        e.preventDefault(); e.returnValue = 'You have an unsaved form. Are you sure you want to leave?';
      }
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, []);

  useEffect(()=>{
    db.auth.getSession().then(({data})=>{setSession(data.session);setAuthReady(true);});
    const{data:l}=db.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>l.subscription.unsubscribe();
  },[]);

  const loadAll = useCallback(async()=>{
    setLoading(true);
    try {
      const[supp,cand,req,loa,mob,loc,thr]=await Promise.all([
        db.from('mob_suppliers').select('*').order('name'),
        db.from('mob_candidates').select('*').order('full_name'),
        db.from('mob_requirements').select('*').order('created_at',{ascending:false}),
        db.from('mob_loa').select('*').order('loa_date',{ascending:false}),
        db.from('mob_register').select('*').order('created_at',{ascending:false}),
        db.from('mob_location_config').select('*').order('location'),
        db.from('mob_alert_thresholds').select('*').eq('active',true),
      ]);
      if(cand.error?.code==='42P01'){setTableReady(false);setLoading(false);return;}
      setTableReady(true);
      setData({suppliers:supp.data||[],candidates:cand.data||[],requirements:req.data||[],loaList:loa.data||[],mobList:mob.data||[],locConfigs:loc.data||[],thresholds:thr.data||[]});
    } catch(e){console.error(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{if(session)loadAll();},[session,loadAll]);

  const loaUsed = useMemo(()=>{
    const m={};
    data.mobList.forEach(r=>{if(r.loa_id&&r.status!=='demobilised')m[r.loa_id]=(m[r.loa_id]||0)+1;});
    return m;
  },[data.mobList]);

  // Global search results — search both candidates and mob records
  const searchResults = useMemo(()=>{
    if(!globalSearch.trim())return[];
    const q=globalSearch.trim().toLowerCase();
    const cands=data.candidates.filter(c=>matchSearch(c,q)).slice(0,8).map(c=>({...c,_type:'candidate'}));
    const mobs=data.mobList.filter(m=>matchSearch(m,q)).slice(0,8).map(m=>({...m,_type:'mob'}));
    return [...cands,...mobs].slice(0,12);
  },[globalSearch,data.candidates,data.mobList]);

  const onSearchSelect = result => {
    setGlobalSearch('');
    if(result._type==='candidate'){setTabSearch(result.full_name);setTab('candidates');}
    else{setTabSearch(result.full_name);setTab('mobilisation');}
  };

  const onSave = async(type,draft,onDone)=>{
    const tableMap={candidates:'mob_candidates',suppliers:'mob_suppliers',requirements:'mob_requirements',loa:'mob_loa',mob:'mob_register',locconfig:'mob_location_config'};
    const table=tableMap[type];
    const hasUpdatedAt = ['mob_candidates','mob_register','mob_location_config'].includes(table);
    const clean={...draft};
    if(hasUpdatedAt) clean.updated_at=new Date().toISOString();
    // Strip internal UI state fields (anything starting with _)
    Object.keys(clean).forEach(k=>{ if(k.startsWith('_')) delete clean[k]; });
    // Convert empty strings to null — Postgres rejects "" for date/uuid/numeric columns
    Object.keys(clean).forEach(k=>{ if(clean[k]==='') clean[k]=null; });
    const{error}=draft.id
      ?await db.from(table).update(clean).eq('id',draft.id)
      :await db.from(table).insert(clean);
    if(error){alert(error.message);return;}
    await loadAll();
    onDone?.();
  };

  // Delete handler — only affects mob_candidates in this portal, never touches HR or Finance
  const onDelete = async(type, record) => {
    if (type === 'candidates') {
      // Only block if they have an active (mobilised) record in THIS portal's mob_register
      const hasActiveMob = data.mobList.some(m => m.candidate_id === record.id && m.status === 'mobilised');
      if (hasActiveMob) {
        alert(`Cannot delete "${record.full_name}" — they are currently mobilised on site. Demobilise them first.`);
        return;
      }
      if (!window.confirm(`Delete "${record.full_name}" (${record.supplier_emp_no||'no EMP no'}) from the Mobilisation candidates pool?\n\nThis only removes them from this portal — HR records are not affected.`)) return;
      const { error } = await db.from('mob_candidates').delete().eq('id', record.id);
      if (error) { alert(error.message); return; }
      await loadAll();
    }
  };

  // Demob handler — updates status + demob fields
  const onDemob = async(id, form) => {
    const{error}=await db.from('mob_register').update({
      status:'demobilised',
      demobilisation_date: form.demobilisation_date,
      demob_reason: form.demob_reason,
      demob_remarks: form.demob_remarks,
      wp_action_on_demob: form.wp_action_on_demob,
      cicpa_returned: form.cicpa_returned,
      updated_at: new Date().toISOString(),
    }).eq('id',id);
    if(error){alert(error.message);return;}
    await loadAll();
  };

  // planContext is optional — passed from Planning tab to pre-fill customer/location/LOA
  const handleMobilise = (candidate, planContext={}) => {
    // Check if a mob record already exists for this candidate at this customer+location
    // If so, open that record for editing instead of creating a duplicate
    const existing = planContext.customer_name && planContext.location
      ? data.mobList.find(m =>
          (m.candidate_id===candidate.id || m.full_name===candidate.full_name) &&
          m.customer_name===planContext.customer_name &&
          m.location===planContext.location &&
          m.status!=='demobilised'
        )
      : null;

    if (existing) {
      // Jump to Mobilisation tab with this record highlighted / open for edit
      sessionStorage.setItem('satco_mob_edit', existing.id);
      setTab('mobilisation');
      setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),150);
      return;
    }

    sessionStorage.setItem('satco_mob_prefill', JSON.stringify({
      candidate_id:   candidate.id,
      full_name:      candidate.full_name,
      designation:    planContext.designation || candidate.designation,
      source:         candidate.source||'supplier',
      supplier_name:  candidate.supplier_name,
      supplier_emp_no:candidate.supplier_emp_no,
      nationality:    candidate.nationality,
      date_of_birth:  candidate.date_of_birth,
      passport_no:    candidate.passport_no,    passport_expiry: candidate.passport_expiry||'',
      emirates_id:    candidate.emirates_id,    eid_expiry:      candidate.eid_expiry||'',
      visa_no:        candidate.visa_no,        visa_type:       candidate.visa_type||'',
      visa_location:  candidate.visa_location,  visa_expiry:     candidate.visa_expiry||'',
      phone:          candidate.phone||'',
      // Pre-fill from plan — user sees these already filled
      customer_name:  planContext.customer_name || '',
      location:       planContext.location       || '',
      loa_id:         planContext.loa_id         || '',
      medical_done:false, hse_passport_done:false, h2s_done:false, extra_trainings:[], status:'pending', notes:'',
    }));
    setTab('mobilisation');
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),150);
  };

  if(!authReady)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#64748b'}}>Loading…</div>;
  if(!session)return<LoginScreen onLogin={()=>db.auth.getSession().then(({data})=>setSession(data.session))}/>;
  if(tableReady===false)return<><TopNav tab={tab} setTab={setTab} onSignOut={()=>db.auth.signOut()} globalSearch={globalSearch} setGlobalSearch={setGlobalSearch} searchResults={[]} onSearchSelect={()=>{}}/><SetupScreen onRetry={loadAll}/></>;

  return (
    <div style={S.page}>
      <TopNav tab={tab} setTab={t=>{setTab(t);setTabSearch('');}} onSignOut={()=>db.auth.signOut()} globalSearch={globalSearch} setGlobalSearch={setGlobalSearch} searchResults={searchResults} onSearchSelect={onSearchSelect}/>
      <div style={S.wrap}>
        <div style={{paddingTop:'20px'}}>
          <LoaBanner loaList={data.loaList} usedMap={loaUsed} onManage={()=>setTab('loa')}/>
          {loading&&tableReady===null&&<div style={{padding:'40px',textAlign:'center',color:'#94a3b8'}}>Loading…</div>}
          {!loading&&tableReady&&<>
            {tab==='dashboard'    &&<Dashboard data={data} loaUsed={loaUsed} setTab={t=>{setTab(t);}} setFilterStatus={setFilterStatus} hrMobActive={hrMobActive}/>}
            {tab==='planning'     &&<PlanningTab candidates={data.candidates} mobList={data.mobList} requirements={data.requirements} loaList={data.loaList} onMobilise={(c,ctx)=>{handleMobilise(c,ctx||{});}} setTab={t=>{setTab(t);}} onRefreshAndFilter={async(cust,loc)=>{await loadAll();setBulkMobFilter({customer:cust,location:loc});setTab('mobilisation');setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),300);}} onBulkMobFilter={(cust,loc)=>{setBulkMobFilter({customer:cust,location:loc});setTab('mobilisation');}}/>}
            {tab==='candidates'   &&<CandidatesTab candidates={data.candidates} mobList={data.mobList} suppliers={data.suppliers} onSave={onSave} onDelete={onDelete} onMobilise={handleMobilise} onRefresh={loadAll} tabSearch={tabSearch} hrMobActive={hrMobActive} hrMobLocs={hrMobLocs} thresholds={data.thresholds}/>}
            {tab==='requirements' &&<RequirementsTab requirements={data.requirements} onSave={onSave}/>}
            {tab==='loa'          &&<LoaTab loaList={data.loaList} usedMap={loaUsed} onSave={onSave}/>}
            {tab==='mobilisation' &&<MobilisationTab mobList={data.mobList} candidates={data.candidates} loaList={data.loaList} requirements={data.requirements} usedMap={loaUsed} locConfigs={data.locConfigs} onSave={onSave} onDemob={onDemob} onRefresh={loadAll} initialStatus={filterStatus} tabSearch={tabSearch} bulkMobFilter={bulkMobFilter} onClearBulkFilter={()=>setBulkMobFilter(null)}/>}
            {tab==='suppliers'    &&<SuppliersTab suppliers={data.suppliers} onRefresh={loadAll}/>}
            {tab==='letters'      &&<LettersTab mobList={data.mobList}/>}
            {tab==='config'       &&<ConfigTab locConfigs={data.locConfigs} suppliers={data.suppliers} onSave={onSave}/>}
          </>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
