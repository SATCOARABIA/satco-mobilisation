// ── Planning Tab ──────────────────────────────────────────────────────────────
function PlanningTab({candidates, mobList, onMobilise, requirements=[], loaList=[], setTab=()=>{}, onRefreshAndFilter=async()=>{}, onBulkMobFilter=()=>{}}) {
  const [plans, setPlans]           = useState([]);
  const [activePlan, setActivePlan] = useState(null);
  const [planDraft, setPlanDraft]   = useState(null);
  const [selected, setSelected]     = useState(new Set());
  const [assignments, setAssignments] = useState({});

  const loadPlans = async() => {
    const {data} = await db.from('mob_deployment_plan').select('*').eq('active',true).order('created_at',{ascending:false});
    setPlans(data||[]);
  };
  const loadAssignments = async() => {
    const {data} = await db.from('mob_plan_assignments').select('candidate_id, plan_id, mob_deployment_plan(name,location)');
    const map = {};
    (data||[]).forEach(a=>{ map[a.candidate_id]={planId:a.plan_id, planName:a.mob_deployment_plan?.name, location:a.mob_deployment_plan?.location}; });
    setAssignments(map);
  };
  useEffect(()=>{ loadPlans(); loadAssignments(); },[]);

  const savePlan = async(p) => {
    const {error,data} = p.id
      ? await db.from('mob_deployment_plan').update({...p,updated_at:new Date().toISOString()}).eq('id',p.id).select().single()
      : await db.from('mob_deployment_plan').insert(p).select().single();
    if(error){alert(error.message);return;}
    await loadPlans();
    setPlanDraft(null);
    if(!p.id && data) setActivePlan(data.id);
  };
  const deletePlan = async(id) => {
    if(!window.confirm('Remove this plan?')) return;
    await db.from('mob_deployment_plan').update({active:false}).eq('id',id);
    await db.from('mob_plan_assignments').delete().eq('plan_id',id);
    await loadPlans(); await loadAssignments();
    if(activePlan===id) setActivePlan(null);
  };

  const meetsPlan = useCallback((c, plan) => {
    if(!plan) return null;
    const mob = mobList.filter(m=>m.candidate_id===c.id||m.full_name===c.full_name)
      .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
    const checks = [];
    // Docs — EID implies visa, just check EID+passport
    checks.push({label:'Passport',    done:!!c.passport_no&&!!c.passport_expiry, action:'Edit candidate → add passport'});
    checks.push({label:'Emirates ID', done:!!c.emirates_id&&!!c.eid_expiry,      action:'Edit candidate → add EID'});
    if(plan.designation) checks.push({label:`Trade: ${plan.designation}`, done:(c.designation||'').toLowerCase().includes((plan.designation||'').toLowerCase()), action:`Designation must include "${plan.designation}"`});
    if(plan.cicpa_required)         checks.push({label:'CICPA', done:c.cicpa_status==='active'&&!!c.security_pass_no, action:'Apply CICPA via LOA', warning:c.cicpa_status==='confiscated'?'⚠ Confiscated':''});
    if(plan.adnoc_medical_required) checks.push({label:'ADNOC Med', done:!!c.adnoc_medical_status&&c.adnoc_medical_status!=='Unfit', action:'Edit candidate → ADNOC medical'});
    if(plan.medical_required)       checks.push({label:'Site Medical', done:!!mob?.medical_done&&mob?.medical_result!=='Unfit', action:'Mobilisation → medical'});
    if(plan.wp_required) {
      // Check candidate's own WP (from WP card) OR mob register WP
      const candWpDone = !!c.wp_no && !!c.wp_expiry && new Date(c.wp_expiry) > new Date();
      const mobWpDone  = !!mob?.wp_approved_date;
      const wpDone = candWpDone || mobWpDone;
      const isSatcoWP = (c.wp_employer||'').toUpperCase().includes('SATCO');
      const wpLabel = candWpDone
        ? (isSatcoWP ? 'WP-SATCO' : `WP-${(c.wp_employer||'').split(' ').slice(0,2).join(' ')}`)
        : 'Work Permit';
      checks.push({label:wpLabel, done:wpDone, action:'Upload work permit via Documents panel', warning: candWpDone&&!isSatcoWP?`⚠ Not SATCO (${(c.wp_employer||'').split(' ').slice(0,2).join(' ')})`:''});
    }
    if(plan.hse_required)           checks.push({label:'HSE', done:!!mob?.hse_passport_done, action:'Mobilisation → HSE'});
    if(plan.h2s_required)           checks.push({label:'H2S', done:!!mob?.h2s_done, action:'Mobilisation → H2S'});
    (plan.extra_trainings||[]).forEach(t=>{
      const found=(mob?.extra_trainings||[]).find(et=>(et.name||'').toLowerCase()===t.toLowerCase()&&et.done);
      checks.push({label:t, done:!!found, action:`Complete ${t}`});
    });
    const allMet = checks.every(x=>x.done);
    return {checks, allMet, missing:checks.filter(x=>!x.done)};
  },[mobList]);

  const plan = plans.find(p=>p.id===activePlan);

  const sorted = useMemo(()=>{
    if(!plan) return {green:[],yellow:[]};
    const green=[], yellow=[];
    candidates.forEach(c=>{
      const r = meetsPlan(c,plan);
      const obj = {...c,_pr:r};
      if(r?.allMet) green.push(obj); else yellow.push(obj);
    });
    return {green, yellow};
  },[candidates,plan,meetsPlan]);

  // Keep a window cache of mobList for bulk insert duplicate check
  useEffect(()=>{ window._mobListCache = mobList; },[mobList]);
  const planCandSiteMap = useMemo(()=>{ const m={}; mobList.filter(r=>r.status==='mobilised'&&r.candidate_id).forEach(r=>{ m[r.candidate_id]=r.location||'On Site'; }); return m; },[mobList]);

  // Toggle select
  const toggleSelect = (id) => setSelected(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const selectAll  = (arr) => setSelected(s=>{ const n=new Set(s); arr.forEach(c=>n.add(c.id)); return n; });
  const deselectAll= ()    => setSelected(new Set());

  // Assign selected to this plan → check for conflicts
  const assignSelected = async() => {
    if(!activePlan || selected.size===0) return;
    const conflicts = [];
    for(const cid of selected){
      const ex = assignments[cid];
      if(ex && ex.planId !== activePlan) conflicts.push({cid, planName:ex.planName, location:ex.location});
    }
    if(conflicts.length>0){
      const names = conflicts.map(c=>{
        const cand = candidates.find(x=>x.id===c.cid);
        return `• ${cand?.full_name} — currently planned for "${c.planName}" (${c.location||'unknown site'})`;
      }).join('\n');
      const proceed = window.confirm(`⚠ Conflict — already planned for another site:\n\n${names}\n\nProceed? They will be removed from the other plan and assigned here.`);
      if(!proceed) return;
      for(const c of conflicts){
        await db.from('mob_plan_assignments').delete().eq('candidate_id',c.cid).eq('plan_id',c.planId);
      }
    }
    const rows = [...selected].map(cid=>({plan_id:activePlan, candidate_id:cid}));
    await db.from('mob_plan_assignments').upsert(rows,{onConflict:'candidate_id,plan_id'});
    await loadAssignments();
    alert(`✓ ${selected.size} candidate${selected.size>1?'s':''} assigned to this plan.`);
  };

  // Unassign selected from this plan
  const unassignSelected = async() => {
    if(!activePlan || selected.size===0) return;
    const toUnassign = [...selected].filter(cid => assignments[cid]?.planId === activePlan);
    if(toUnassign.length===0){ alert('None of the selected candidates are assigned to this plan.'); return; }
    const names = toUnassign.map(cid=>candidates.find(c=>c.id===cid)?.full_name).filter(Boolean).join(', ');
    if(!window.confirm(`Remove assignment for:\n${names}\n\nThey will remain in the candidate pool — this only removes their plan assignment.`)) return;
    for(const cid of toUnassign){
      await db.from('mob_plan_assignments').delete().eq('candidate_id',cid).eq('plan_id',activePlan);
    }
    await loadAssignments();
    setSelected(new Set());
    alert(`✓ ${toUnassign.length} candidate${toUnassign.length>1?'s':''} unassigned.`);
  };

  // Move selected directly to mobilisation — pre-fills customer/location/LOA from plan
  const mobiliseSelected = async() => {
    const toMob = candidates.filter(c=>selected.has(c.id));
    if(toMob.length===0){alert('Select at least one candidate.');return;}
    const loaRef = plan?.notes || '';
    const matchedLoa = loaList.find(l=>l.loa_reference===loaRef);
    const planContext = {
      customer_name: plan?.customer_name || '',
      location:      plan?.location      || '',
      loa_id:        matchedLoa?.id      || '',
      designation:   plan?.designation   || '',
    };
    if(toMob.length===1){
      // Single: open form pre-filled as before
      onMobilise(toMob[0], planContext);
      return;
    }
    // Bulk: build rows, skip any already in mob_register for same candidate+customer+location (non-demob)
    const existingKeys = new Set(
      (window._mobListCache||[])
        .filter(m=>m.status!=='demobilised')
        .map(m=>`${m.candidate_id||''}__${m.customer_name||''}__${m.location||''}`)
    );
    const rows = toMob
      .filter(c=>{
        const key=`${c.id}__${planContext.customer_name}__${planContext.location}`;
        return !existingKeys.has(key);
      })
      .map(c=>({
        candidate_id:    c.id,
        full_name:       c.full_name,
        designation:     planContext.designation||c.designation,
        source:          c.source||'supplier',
        supplier_name:   c.supplier_name||null,
        supplier_emp_no: c.supplier_emp_no||null,
        nationality:     c.nationality||null,
        date_of_birth:   c.date_of_birth||null,
        passport_no:     c.passport_no||null,
        passport_expiry: c.passport_expiry||null,
        emirates_id:     c.emirates_id||null,
        eid_expiry:      c.eid_expiry||null,
        visa_no:         c.visa_no||null,
        visa_type:       c.visa_type||null,
        visa_location:   c.visa_location||null,
        visa_expiry:     c.visa_expiry||null,
        phone:           c.phone||null,
        customer_name:   planContext.customer_name||null,
        location:        planContext.location||null,
        loa_id:          planContext.loa_id||null,
        medical_done:false, hse_passport_done:false, h2s_done:false,
        extra_trainings:[], status:'pending', notes:'',
      }));
    const skipped = toMob.length - rows.length;
    if(rows.length===0){
      alert(`All ${toMob.length} selected candidates are already in Mobilisation for this site.`);
      setTab('mobilisation');
      onBulkMobFilter(planContext.customer_name, planContext.location);
      return;
    }
    // Insert all at once
    const{error}=await db.from('mob_register').insert(rows);
    if(error){alert('Error: '+error.message);return;}
    // Refresh data then navigate
    await onRefreshAndFilter(planContext.customer_name, planContext.location);
    const msg = skipped>0
      ? `✓ ${rows.length} candidates added to Mobilisation.\n(${skipped} already existed — skipped)`
      : `✓ ${rows.length} candidates added to Mobilisation.`;
    alert(msg);
    setSelected(new Set());
  };

  // Export selected (or all) to Excel
  const exportPlan = () => {
    const toExport = candidates.filter(c=>selected.size>0?selected.has(c.id):true).map((c,i)=>{
      const r = meetsPlan(c,plan||plans[0]);
      const status = r?.allMet?'Ready':'Needs Action';
      const missing = (r?.missing||[]).map(x=>x.label).join(', ');
      return {
        'S.No':i+1, 'Name':c.full_name, 'Designation':c.designation||'',
        'EMP No':c.supplier_emp_no||'', 'Nationality':c.nationality||'',
        'Passport No':c.passport_no||'', 'Passport Expiry':c.passport_expiry||'',
        'Emirates ID':c.emirates_id||'', 'EID Expiry':c.eid_expiry||'',
        'ADNOC Medical':c.adnoc_medical_status||'', 'CICPA Status':c.cicpa_status||'',
        'CICPA Location':canonicalCicpa(c.cicpa_location)||'', 'Plan Status':status, 'Missing':missing,
      };
    });
    const ws = XLSX.utils.json_to_sheet(toExport);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Candidates');
    XLSX.writeFile(wb, `${plan?.name||'Plan'}_Candidates.xlsx`);
  };

  const blankPlan = {name:'',customer_name:'',location:'',designation:'',headcount:1,
    cicpa_required:false,medical_required:false,adnoc_medical_required:false,
    wp_required:false,hse_required:false,h2s_required:false,extra_trainings:[],notes:'',
    po_status:'pending',loa_status:'pending'};

  const [candSearch, setCandSearch] = useState('');

  const ReqBadge = ({chk}) => (
    <span title={!chk.done?('Action: '+chk.action):''}
      style={{fontSize:'10px',fontWeight:700,padding:'2px 6px',borderRadius:4,flexShrink:0,
        background:chk.done?'#dcfce7':'#fee2e2',color:chk.done?'#166534':'#dc2626',whiteSpace:'nowrap'}}>
      {chk.done?'✓':'✗'} {chk.label}{chk.warning?` (${chk.warning})`:''}
    </span>
  );

  const CandRow = ({c, showCheck=true}) => {
    const isSel = selected.has(c.id);
    const assigned = assignments[c.id];
    const isAssigned = assigned?.planId === activePlan;
    const conflicted = assigned && assigned.planId !== activePlan;
    return (
      <div style={{
        background:isSel?'#eff6ff':'#fff',
        border:`1.5px solid ${isSel?'#2563eb':conflicted?'#fde68a':'#e2e8f0'}`,
        borderRadius:'6px',padding:'6px 10px',
        display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',
        minHeight:'34px',overflow:'hidden',
      }}
        onClick={()=>toggleSelect(c.id)}>
        {showCheck&&<input type="checkbox" checked={isSel} readOnly style={{width:14,height:14,flexShrink:0,accentColor:'#2563eb'}}/>}
        {/* Name + subtitle — fixed width */}
        <div style={{width:'200px',flexShrink:0,overflow:'hidden'}}>
          <div style={{fontWeight:700,fontSize:'11px',color:'#0f172a',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',textTransform:'uppercase'}}>{c.full_name}</div>
          <div style={{fontSize:'9px',color:'#64748b',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
            {c.designation||'—'} · {c.supplier_emp_no||'—'}
            {conflicted&&<span style={{color:'#b45309',fontWeight:700}}> · ⚠ {assigned.planName}</span>}
            {isAssigned&&<span style={{color:'#166534',fontWeight:700}}> · ✓ This plan</span>}
            {planCandSiteMap[c.id]&&<span style={{color:'#166534',fontWeight:700}}> · 🏗 {(planCandSiteMap[c.id]||'').split(/[-–]/)[0].trim().substring(0,15)}</span>}
          </div>
        </div>
        {/* Check badges — scrollable row, no wrap */}
        <div style={{display:'flex',gap:'3px',alignItems:'center',flex:1,overflowX:'auto',flexWrap:'nowrap'}}>
          {(c._pr?.checks||[]).map((chk,i)=><ReqBadge key={i} chk={chk}/>)}
        </div>
        {/* First missing action hint */}
        {c._pr?.missing?.length>0&&(
          <div style={{fontSize:'10px',color:'#b45309',flexShrink:0,whiteSpace:'nowrap',maxWidth:'180px',overflow:'hidden',textOverflow:'ellipsis'}}>→ {c._pr.missing[0]?.action}</div>
        )}
      </div>
    );
  };

  return (
    <div style={{maxWidth:'1400px',margin:'0 auto',padding:'16px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'16px',flexWrap:'wrap',gap:'8px'}}>
        <div>
          <div style={{fontWeight:800,fontSize:'18px',color:'#0f172a'}}>🎯 Planning — Shortlist &amp; Assign</div>
          <div style={{fontSize:'12px',color:'#64748b',marginTop:'2px'}}>
            <strong>Planning</strong> = define what you need (headcount, trade, site), shortlist candidates, assign them to a project slot.<br/>
            <strong>Mobilisation</strong> = the official record — work permit, medical, CICPA, LOA. Click <em>🚀 Mobilise → Fill MOB</em> to create it instantly from Plan, no re-entry needed.
          </div>
        </div>
        <button style={S.btnPri} onClick={()=>setPlanDraft({...blankPlan})}>+ New Plan</button>
      </div>

      {/* Plan cards */}
      {plans.length>0&&(
        <div style={{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'16px'}}>
          {plans.map(p=>{
            const isActive = activePlan===p.id;
            const green = candidates.filter(c=>meetsPlan(c,p)?.allMet).length;
            return (
              <div key={p.id} onClick={()=>{setActivePlan(isActive?null:p.id);setSelected(new Set());}}
                style={{background:isActive?'#0f172a':'#fff',border:`2px solid ${isActive?'#0f172a':'#e2e8f0'}`,
                  borderRadius:'10px',padding:'12px 16px',cursor:'pointer',minWidth:'200px'}}>
                <div style={{fontWeight:800,fontSize:'14px',color:isActive?'#f8fafc':'#0f172a'}}>{p.name}</div>
                {p.customer_name&&<div style={{fontSize:'11px',color:isActive?'#94a3b8':'#64748b'}}>{p.customer_name}</div>}
                {p.location&&<div style={{fontSize:'11px',color:isActive?'#94a3b8':'#64748b'}}>{p.location}</div>}
                <div style={{display:'flex',gap:'4px',marginTop:'6px',flexWrap:'wrap'}}>
                  <span style={{background:p.po_status==='issued'?'#dcfce7':'#fee2e2',color:p.po_status==='issued'?'#166534':'#dc2626',fontSize:'9px',fontWeight:700,padding:'1px 6px',borderRadius:8}}>{p.po_status==='issued'?'✓ PO':'⚠ No PO'}</span>
                  <span style={{background:p.loa_status==='issued'?'#dcfce7':'#fee2e2',color:p.loa_status==='issued'?'#166534':'#dc2626',fontSize:'9px',fontWeight:700,padding:'1px 6px',borderRadius:8}}>{p.loa_status==='issued'?'✓ LOA':'⚠ No LOA'}</span>
                </div>
                <div style={{display:'flex',gap:'6px',marginTop:'8px',flexWrap:'wrap'}}>
                  {p.designation&&<span style={{background:isActive?'#1e293b':'#f1f5f9',color:isActive?'#cbd5e1':'#475569',fontSize:'10px',fontWeight:700,padding:'2px 7px',borderRadius:10}}>{p.designation}</span>}
                  {p.headcount>0&&<span style={{background:isActive?'#1e293b':'#f1f5f9',color:isActive?'#cbd5e1':'#475569',fontSize:'10px',fontWeight:700,padding:'2px 7px',borderRadius:10}}>{p.headcount} pax</span>}
                  <span style={{background:'#dcfce7',color:'#166534',fontSize:'10px',fontWeight:700,padding:'2px 7px',borderRadius:10}}>{green} ready</span>
                  <span style={{background:'#fef3c7',color:'#b45309',fontSize:'10px',fontWeight:700,padding:'2px 7px',borderRadius:10}}>{candidates.length-green} pending</span>
                </div>
                <div style={{display:'flex',gap:'6px',marginTop:'8px'}}>
                  <button style={{...S.btnSm,padding:'2px 8px',fontSize:'10px',color:isActive?'#fff':undefined,background:isActive?'#1e293b':'transparent',borderColor:isActive?'#475569':undefined}}
                    onClick={e=>{e.stopPropagation();setPlanDraft({...p,extra_trainings:p.extra_trainings||[]});}}>Edit</button>
                  <button style={{...S.btnSm,padding:'2px 8px',fontSize:'10px',color:'#dc2626',borderColor:isActive?'#475569':undefined,background:isActive?'#1e293b':'transparent'}}
                    onClick={e=>{e.stopPropagation();deletePlan(p.id);}}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Plan editor */}
      {planDraft&&(
        <div style={{...S.card,marginBottom:'16px',padding:'16px'}}>
          <div style={{fontWeight:800,fontSize:'14px',marginBottom:'12px'}}>{planDraft.id?'Edit Plan':'New Deployment Plan'}</div>

          {/* PO / LOA status toggles */}
          <div style={{display:'flex',gap:'16px',marginBottom:'10px',flexWrap:'wrap',alignItems:'center'}}>
            {[{key:'po_status',label:'PO'},{key:'loa_status',label:'LOA'}].map(({key,label})=>(
              <div key={key} style={{display:'flex',gap:'6px',alignItems:'center'}}>
                <span style={{fontSize:'12px',fontWeight:700,color:'#64748b'}}>{label}:</span>
                {['issued','pending'].map(v=>(
                  <label key={v} style={{display:'flex',gap:'5px',alignItems:'center',cursor:'pointer',
                    background:(planDraft[key]||'pending')===v?(v==='issued'?'#dcfce7':'#fee2e2'):'#f8fafc',
                    padding:'4px 10px',borderRadius:6,border:`1.5px solid ${(planDraft[key]||'pending')===v?(v==='issued'?'#86efac':'#fca5a5'):'#e2e8f0'}`}}>
                    <input type="radio" checked={(planDraft[key]||'pending')===v} onChange={()=>setPlanDraft(d=>({...d,[key]:v}))} style={{accentColor:v==='issued'?'#166534':'#dc2626'}}/>
                    <span style={{fontSize:'12px',fontWeight:600,color:(planDraft[key]||'pending')===v?(v==='issued'?'#166534':'#dc2626'):'#374151'}}>{v==='issued'?`✓ ${label} Issued`:`⚠ ${label} Pending`}</span>
                  </label>
                ))}
              </div>
            ))}
          </div>
          {((planDraft.po_status||'pending')!=='issued'||(planDraft.loa_status||'pending')!=='issued')&&(
            <div style={{background:'#fef3c7',border:'1px solid #fde68a',borderRadius:'6px',padding:'8px 12px',marginBottom:'12px',fontSize:'12px',color:'#92400e',fontWeight:600}}>
              ⚠ {[(planDraft.po_status||'pending')!=='issued'&&'PO not yet issued',(planDraft.loa_status||'pending')!=='issued'&&'LOA not yet issued'].filter(Boolean).join(' · ')} — planning can continue but mobilisation requires both before deployment.
            </div>
          )}

          <Grid cols={3}>
            <Field label="Plan Name *">
              <input value={planDraft.name||''} onChange={e=>setPlanDraft(d=>({...d,name:e.target.value}))} placeholder="e.g. VOLTA TAZIZ Aug 2026" style={S.input}/>
            </Field>
            <Field label="Customer">
              <select value={planDraft.customer_name||''} onChange={e=>{
                const cust=e.target.value;
                const req=requirements.find(r=>r.customer_name===cust);
                setPlanDraft(d=>({...d,customer_name:cust,location:req?.location||d.location}));
              }} style={S.input}>
                <option value="">— Select customer —</option>
                {[...new Set(requirements.map(r=>r.customer_name).filter(Boolean))].map(c=><option key={c} value={c}>{c}</option>)}
                <option value="__other">Other…</option>
              </select>
              {(planDraft.customer_name==='__other'||!requirements.find(r=>r.customer_name===planDraft.customer_name))&&planDraft.customer_name&&(
                <input value={planDraft.customer_name==='__other'?'':planDraft.customer_name} onChange={e=>setPlanDraft(d=>({...d,customer_name:e.target.value}))} placeholder="Type customer name…" style={{...S.input,marginTop:'4px'}}/>
              )}
            </Field>
            <Field label="Location / Site">
              <select value={planDraft.location||''} onChange={e=>setPlanDraft(d=>({...d,location:e.target.value}))} style={S.input}>
                <option value="">— Select location —</option>
                {[...new Set(requirements.filter(r=>!planDraft.customer_name||r.customer_name===planDraft.customer_name).map(r=>r.location).filter(Boolean))].map(l=><option key={l} value={l}>{l}</option>)}
                <option value="__other">Other…</option>
              </select>
              {(planDraft.location==='__other'||!requirements.find(r=>r.location===planDraft.location))&&planDraft.location&&(
                <input value={planDraft.location==='__other'?'':planDraft.location} onChange={e=>setPlanDraft(d=>({...d,location:e.target.value}))} placeholder="Type location…" style={{...S.input,marginTop:'4px'}}/>
              )}
            </Field>
          </Grid>

          <Grid cols={3}>
            <Field label="Designation / Trade">
              {(()=>{
                const opts=[...new Set(requirements.filter(r=>!planDraft.customer_name||r.customer_name===planDraft.customer_name).flatMap(r=>(r.positions||[]).map(p=>p.designation)).filter(Boolean))];
                return (<>
                  {opts.length>0&&<select value={planDraft.designation||''} onChange={e=>setPlanDraft(d=>({...d,designation:e.target.value}))} style={S.input}>
                    <option value="">— Select trade —</option>
                    {opts.map(p=><option key={p} value={p}>{p}</option>)}
                    <option value="__other">Other…</option>
                  </select>}
                  {(planDraft.designation==='__other'||!opts.includes(planDraft.designation)||opts.length===0)&&(
                    <input value={planDraft.designation==='__other'?'':planDraft.designation||''} onChange={e=>setPlanDraft(d=>({...d,designation:e.target.value}))} placeholder="Type trade/designation…" style={{...S.input,marginTop:opts.length>0?'4px':'0'}}/>
                  )}
                </>);
              })()}
            </Field>
            <Field label="Headcount Required">
              <input type="number" min={1} value={planDraft.headcount||1} onChange={e=>setPlanDraft(d=>({...d,headcount:+e.target.value}))} style={S.input}/>
              {(()=>{const req=requirements.find(r=>r.customer_name===planDraft.customer_name&&r.location===planDraft.location);const pos=req&&(req.positions||[]).find(p=>p.designation===planDraft.designation);return pos?<div style={{fontSize:'10px',color:'#0369a1',marginTop:'2px'}}>PO quantity: {pos.qty} pax</div>:null;})()}
            </Field>
            <Field label="LOA / PO Reference">
              <select value={planDraft.notes||''} onChange={e=>{
                const val=e.target.value;
                const loa=loaList.find(l=>l.loa_reference===val);
                setPlanDraft(d=>({...d,notes:val,loa_status:loa?'issued':d.loa_status}));
              }} style={S.input}>
                <option value="">— Select LOA —</option>
                {loaList.filter(l=>!planDraft.customer_name||l.customer_name===planDraft.customer_name).map(l=>(
                  <option key={l.id} value={l.loa_reference||l.id}>{l.loa_reference||'LOA'} · {l.total_count} pax · {l.customer_name}</option>
                ))}
                <option value="__other">Type manually…</option>
              </select>
              {(planDraft.notes==='__other'||!loaList.find(l=>l.loa_reference===planDraft.notes))&&(
                <input value={planDraft.notes==='__other'?'':planDraft.notes||''} onChange={e=>setPlanDraft(d=>({...d,notes:e.target.value}))} placeholder="PO ref / LOA ref…" style={{...S.input,marginTop:'4px'}}/>
              )}
              {loaList.find(l=>l.loa_reference===planDraft.notes)&&(()=>{
                const loa=loaList.find(l=>l.loa_reference===planDraft.notes);
                return <div style={{fontSize:'10px',color:'#166534',marginTop:'2px'}}>✓ {loa.total_count} pax available · {loa.notes||''}</div>;
              })()}
            </Field>
          </Grid>

          <div style={{fontSize:'11px',fontWeight:800,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',margin:'10px 0 8px'}}>Requirements — tick all that apply</div>
          <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'10px'}}>
            {[
              {key:'cicpa_required',          label:'CICPA Gate Pass',  icon:'🔒'},
              {key:'adnoc_medical_required',  label:'ADNOC Medical',    icon:'🏥'},
              {key:'medical_required',        label:'Site Medical',     icon:'💊'},
              {key:'wp_required',             label:'Work Permit',      icon:'📄'},
              {key:'hse_required',            label:'HSE Passport',     icon:'🦺'},
              {key:'h2s_required',            label:'H2S Training',     icon:'⚗️'},
            ].map(({key,label,icon})=>(
              <label key={key} style={{display:'flex',gap:'6px',alignItems:'center',cursor:'pointer',
                background:planDraft[key]?'#eff6ff':'#f8fafc',padding:'6px 12px',borderRadius:6,
                border:`1.5px solid ${planDraft[key]?'#2563eb':'#e2e8f0'}`}}>
                <input type="checkbox" checked={!!planDraft[key]} onChange={e=>setPlanDraft(d=>({...d,[key]:e.target.checked}))} style={{width:14,height:14,accentColor:'#2563eb'}}/>
                <span style={{fontSize:'12px',fontWeight:planDraft[key]?700:400,color:planDraft[key]?'#1e40af':'#374151'}}>{icon} {label}</span>
              </label>
            ))}
          </div>
          <Field label="Additional Trainings (comma-separated)">
            {planDraft.cicpa_required&&(
              <Field label="CICPA Site Name (exact match for this deployment)">
                <input value={planDraft.cicpa_site_name||''}
                  onChange={e=>setPlanDraft(d=>({...d,cicpa_site_name:e.target.value}))}
                  placeholder="e.g. TAZIZ, Mabroug Al Ruwais Industrial, Ruwais Al-Sinaiya…"
                  style={S.input}/>
                <div style={{fontSize:'10px',color:'#64748b',marginTop:'3px'}}>Enter the exact CICPA site name. Candidates whose CICPA is for a <em>different</em> location will show ⚠ amber — not ✅ green.</div>
              </Field>
            )}
            <input value={(planDraft.extra_trainings||[]).join(', ')} onChange={e=>setPlanDraft(d=>({...d,extra_trainings:e.target.value.split(',').map(x=>x.trim()).filter(Boolean)}))}
              placeholder="First Aid, BOSIET, Fire Warden..." style={S.input}/>
          </Field>
          <div style={{display:'flex',gap:'8px',marginTop:'12px'}}>
            <button style={S.btnPri} onClick={()=>savePlan(planDraft)} disabled={!planDraft.name}>Save Plan</button>
            <button style={S.btnSec} onClick={()=>setPlanDraft(null)}>Cancel</button>
          </div>
        </div>
      )}

      {plans.length===0&&!planDraft&&(
        <div style={{...S.card,padding:'40px',textAlign:'center'}}>
          <div style={{fontSize:'40px',marginBottom:'12px'}}>🎯</div>
          <div style={{fontWeight:700,fontSize:'16px',marginBottom:'8px'}}>No deployment plans yet</div>
          <div style={{color:'#64748b',fontSize:'13px',marginBottom:'16px'}}>Create a plan to define requirements.<br/>Candidates auto-sort into Ready and Needs Action.</div>
          <button style={S.btnPri} onClick={()=>setPlanDraft({...blankPlan})}>+ Create First Plan</button>
        </div>
      )}

      {/* Active plan results */}
      {plan&&(
        <div>
          {/* Header + actions */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'8px'}}>
            <div>
              <span style={{fontWeight:800,fontSize:'15px',color:'#0f172a'}}>{plan.name}</span>
              {plan.notes&&<span style={{fontWeight:400,fontSize:'12px',color:'#64748b',marginLeft:'10px'}}>Ref: {plan.notes}</span>}
              {plan.headcount>0&&<span style={{marginLeft:'10px',fontSize:'12px',color:sorted.green.length>=plan.headcount?'#166534':'#b45309',fontWeight:700}}>{sorted.green.length}/{plan.headcount} ready</span>}
              {(plan.po_status!=='issued'||plan.loa_status!=='issued')&&(
                <span style={{marginLeft:'10px',background:'#fef3c7',color:'#92400e',fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:6}}>
                  ⚠ {[plan.po_status!=='issued'&&'PO pending',plan.loa_status!=='issued'&&'LOA pending'].filter(Boolean).join(' · ')}
                </span>
              )}
            </div>
            <div style={{display:'flex',gap:'5px',flexWrap:'wrap',alignItems:'center'}}>
              {/* Selection count badge */}
              <span style={{background:selected.size>0?'#1d4ed8':'#e2e8f0',color:selected.size>0?'#fff':'#64748b',
                fontSize:'11px',fontWeight:700,padding:'3px 9px',borderRadius:12,minWidth:'28px',textAlign:'center'}}>
                {selected.size} sel
              </span>
              {/* Selection controls */}
              <button style={S.btnSm} onClick={()=>setSelected(new Set([...sorted.green,...sorted.yellow].map(c=>c.id)))}>
                Select All
              </button>
              <button style={S.btnSm} onClick={()=>setSelected(new Set(sorted.green.map(c=>c.id)))}>
                Select Ready
              </button>
              <button style={{...S.btnSm,color:'#dc2626'}} onClick={()=>setSelected(new Set())}
                disabled={selected.size===0}>
                Unselect All
              </button>
              {/* Divider */}
              <span style={{width:'1px',height:'22px',background:'#e2e8f0',margin:'0 2px'}}/>
              {/* Action buttons */}
              <button style={{...S.btnSm,background:selected.size>0?'#166534':'#d1fae5',
                color:selected.size>0?'#fff':'#6ee7b7',border:'none',fontWeight:700,
                opacity:selected.size>0?1:0.5,cursor:selected.size>0?'pointer':'not-allowed'}}
                onClick={()=>assignSelected()} disabled={selected.size===0}>
                ✓ Assign
              </button>
              <button style={{...S.btnSm,background:selected.size>0?'#dc2626':'#fee2e2',
                color:selected.size>0?'#fff':'#fca5a5',border:'none',fontWeight:700,
                opacity:selected.size>0?1:0.5,cursor:selected.size>0?'pointer':'not-allowed'}}
                onClick={()=>unassignSelected()} disabled={selected.size===0}>
                ✕ Unassign
              </button>
              <button style={{...S.btnSm,background:selected.size>0?'#7c3aed':'#ede9fe',
                color:selected.size>0?'#fff':'#c4b5fd',border:'none',fontWeight:700,
                opacity:selected.size>0?1:0.5,cursor:selected.size>0?'pointer':'not-allowed'}}
                onClick={mobiliseSelected} disabled={selected.size===0}>
                🚀 Mobilise → Fill MOB
              </button>
              <button style={{...S.btnSm,background:'#b8972a',color:'#fff',border:'none'}}
                onClick={exportPlan}>
                ⬇ Export Excel
              </button>
            </div>
          </div>

          {/* Requirements bar */}
          <div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'12px',padding:'8px 12px',background:'#f8fafc',borderRadius:'8px',border:'1px solid #e2e8f0',alignItems:'center'}}>
            <span style={{fontSize:'11px',fontWeight:700,color:'#64748b',marginRight:'4px'}}>REQUIRED:</span>
            {[
              {show:true,label:'Passport + EID'},
              {show:!!plan.designation,label:`Trade: ${plan.designation}`},
              {show:plan.cicpa_required,label:'CICPA'},
              {show:plan.adnoc_medical_required,label:'ADNOC Medical'},
              {show:plan.medical_required,label:'Site Medical'},
              {show:plan.wp_required,label:'Work Permit'},
              {show:plan.hse_required,label:'HSE'},
              {show:plan.h2s_required,label:'H2S'},
              ...(plan.extra_trainings||[]).map(t=>({show:true,label:t})),
            ].filter(x=>x.show).map((x,i)=>(
              <span key={i} style={{background:'#e2e8f0',color:'#374151',fontSize:'11px',fontWeight:600,padding:'2px 8px',borderRadius:10}}>{x.label}</span>
            ))}
          </div>

          {/* CICPA site name display bar */}
          {plan.cicpa_required&&(
            <div style={{marginBottom:'10px',padding:'8px 14px',background:'#eff6ff',borderRadius:'8px',border:'1px solid #bfdbfe',display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
              <span style={{fontSize:'11px',fontWeight:700,color:'#1e40af',whiteSpace:'nowrap'}}>🔒 CICPA Site:</span>
              <span style={{fontSize:'12px',fontWeight:700,color:'#1d4ed8',background:'#dbeafe',padding:'2px 10px',borderRadius:6,border:'1px solid #93c5fd'}}>
                {plan.cicpa_site_name||<span style={{color:'#94a3b8',fontStyle:'italic'}}>Not specified — edit plan to add</span>}
              </span>
              <span style={{fontSize:'10px',color:'#64748b'}}>CICPA for this site = ✅ &nbsp;|&nbsp; CICPA for another site = ⚠ amber</span>
            </div>
          )}
          {/* Scrollable candidate list */}
          <div style={{...S.card,overflow:'hidden'}}>

            {/* ── Search bar ── */}
            <div style={{padding:'8px 12px',borderBottom:'1px solid #e2e8f0',background:'#fff',display:'flex',gap:'8px',alignItems:'center'}}>
              <span style={{fontSize:'14px'}}>🔍</span>
              <input
                placeholder="Search by name, designation, emp no, nationality…"
                value={candSearch}
                onChange={e=>setCandSearch(e.target.value)}
                style={{...S.input,flex:1,fontSize:'12px',padding:'5px 10px'}}
              />
              {candSearch&&<button onClick={()=>setCandSearch('')} style={{background:'none',border:'none',cursor:'pointer',color:'#94a3b8',fontSize:'16px',lineHeight:1,flexShrink:0}}>×</button>}
              <span style={{fontSize:'11px',color:'#94a3b8',whiteSpace:'nowrap'}}>
                {candSearch ? `${[...sorted.green,...sorted.yellow].filter(c=>(c.full_name+c.designation+c.supplier_emp_no+c.nationality).toLowerCase().includes(candSearch.toLowerCase())).length} matches` : `${sorted.green.length+sorted.yellow.length} total`}
              </span>
            </div>

            {/* ── Assigned Candidates for this plan ── */}
            {(()=>{
              const assignedList = [...sorted.green,...sorted.yellow].filter(c=>assignments[c.id]?.planId===activePlan);
              if (!assignedList.length) return null;
              return (
                <div>
                  <div style={{background:'#f0f4ff',borderBottom:'2px solid #6366f1',padding:'8px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontWeight:800,fontSize:'13px',color:'#3730a3'}}>📋 {assignedList.length} Assigned to "{plan.name}"</span>
                    <div style={{display:'flex',gap:'6px'}}>
                      <button style={{...S.btnSm,fontSize:'11px'}} onClick={()=>setSelected(new Set(assignedList.map(c=>c.id)))}>Select all assigned</button>
                      <button style={{...S.btnSm,background:'#7c3aed',color:'#fff',border:'none',fontWeight:700,fontSize:'11px',padding:'4px 10px'}}
                        onClick={()=>{setSelected(new Set(assignedList.map(c=>c.id)));setTimeout(()=>mobiliseSelected(),50);}}>
                        🚀 Mobilise All Assigned
                      </button>
                    </div>
                  </div>
                  <div style={{padding:'6px 8px',display:'flex',flexDirection:'column',gap:'4px',background:'#f5f3ff',borderBottom:'2px solid #e2e8f0'}}>
                    {assignedList.map(c=><CandRow key={c.id} c={c}/>)}
                  </div>
                </div>
              );
            })()}

            {/* ── GREEN — Ready ── */}
            {(()=>{
              const q = candSearch.toLowerCase();
              const list = sorted.green.filter(c=>!q||((c.full_name+c.designation+c.supplier_emp_no+(c.nationality||'')).toLowerCase().includes(q)));
              return (
                <div>
                  <div style={{background:'#f0fdf4',borderBottom:'2px solid #86efac',padding:'8px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontWeight:800,fontSize:'13px',color:'#166534'}}>✅ {list.length} Ready to Mobilise</span>
                    <button style={{...S.btnSm,fontSize:'11px'}} onClick={()=>setSelected(new Set(list.map(c=>c.id)))}>Select all ready</button>
                  </div>
                  <div style={{maxHeight:'280px',overflowY:'auto',padding:'6px 8px',display:'flex',flexDirection:'column',gap:'4px',background:'#f8fff8'}}>
                    {list.length===0&&<div style={{padding:'12px',textAlign:'center',color:'#64748b',fontSize:'12px'}}>{candSearch?'No matches in ready list.':'No candidates meet all requirements yet.'}</div>}
                    {list.map(c=><CandRow key={c.id} c={c}/>)}
                  </div>
                </div>
              );
            })()}

            {/* ── YELLOW — Need Action ── */}
            {(()=>{
              const q = candSearch.toLowerCase();
              const list = sorted.yellow.filter(c=>!q||((c.full_name+c.designation+c.supplier_emp_no+(c.nationality||'')).toLowerCase().includes(q)));
              return (
                <div>
                  <div style={{background:'#fffbeb',borderTop:'2px solid #fde68a',borderBottom:'2px solid #fde68a',padding:'8px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontWeight:800,fontSize:'13px',color:'#92400e'}}>⚠ {list.length} Need Action (can still be selected)</span>
                    <button style={{...S.btnSm,fontSize:'11px'}} onClick={()=>setSelected(new Set(list.map(c=>c.id)))}>Select all pending</button>
                  </div>
                  <div style={{maxHeight:'400px',overflowY:'auto',padding:'6px 8px',display:'flex',flexDirection:'column',gap:'4px',background:'#fffef5'}}>
                    {list.length===0&&<div style={{padding:'12px',textAlign:'center',color:'#64748b',fontSize:'12px'}}>{candSearch?'No matches in pending list.':'All candidates are ready!'}</div>}
                    {list.map(c=><CandRow key={c.id} c={c}/>)}
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}


function CandidatesTab({candidates, mobList, suppliers=[], onSave, onDelete, onMobilise, onRefresh, tabSearch, hrMobActive=new Set(), hrMobLocs={}, thresholds=[]}) {
  const [draft,setDraft]   = usePersistentDraft('candidate');
  const [savedDraft, setSavedDraft] = useState(() => { try { const v=localStorage.getItem('satco_mob_draft_candidate'); return v?JSON.parse(v):null; } catch{return null;} });
  const [search,setSearch] = useState(tabSearch||'');
  const [suppF,setSuppF]   = useState(new Set());
  const [readyF,setReadyF] = useState(new Set());
  const [desigF,setDesigF] = useState(new Set());
  const [cicpaLocF,setCicpaLocF] = useState(new Set());
  const [histPerson, setHistPerson] = useState(null);
  const [docPanel,  setDocPanel]   = useState(null);
  const [satcoEmps, setSatcoEmps]  = useState([]);
  const clickTimer  = useRef(null);


  // Mandatory fields for a candidate to be mobilisation-ready
  // CICPA and Work Permit are NOT checked here — those are done at mobilisation time
  const candidateReadiness = useCallback((c) => {
    const checks = [
      { key:'passport_no',   label:'Passport',    done:!!c.passport_no,    critical:true  },
      { key:'passport_exp',  label:'PP Expiry',   done:!!c.passport_expiry, critical:false },
      { key:'emirates_id',   label:'Emirates ID', done:!!c.emirates_id,    critical:true  },
      { key:'eid_expiry',    label:'EID Expiry',  done:!!c.eid_expiry,     critical:false },
      { key:'visa_no',       label:'Visa No',     done:!!c.visa_no,        critical:true  },
      { key:'visa_expiry',   label:'Visa Expiry', done:!!c.visa_expiry,    critical:false },
      { key:'adnoc_medical', label:'ADNOC Med',   done:!!c.adnoc_medical_status && c.adnoc_medical_status!=='Unfit', critical:false },
    ];
    const missing  = checks.filter(x=>!x.done);
    const critical = missing.filter(x=>x.critical);
    return { checks, missing, criticalMissing:critical, ready: missing.length===0, coreReady: critical.length===0 };
  }, []);

  useEffect(()=>{ if(tabSearch) setSearch(tabSearch); },[tabSearch]);

  useEffect(()=>{
    db.from('employees')
      .select('employee_id,full_name,nationality,dob,passport_no,passport_expiry,eid_no,eid_expiry,evisa_no,visa_expiry,location,mobile,position')
      .is('deleted_at', null)
      .order('employee_id')
      .then(({data})=>setSatcoEmps(data||[]));
  },[]);

  // Auto-generate next supplier emp number in format SUB-001-1001
  // Uses mob_suppliers to find the supplier code, then finds next sequential number
  const getNextEmpNo = useCallback((supplierName, suppliersList=[]) => {
    if (!supplierName) return '';
    // Find the supplier record to get its code (e.g. SUB-001)
    const supplierRec = suppliersList.find(s => s.name === supplierName);
    const supplierCode = supplierRec?.supplier_code || '';
    const prefix = supplierCode ? `${supplierCode}-` : '';
    // Find highest existing number for this supplier across all candidates
    const existing = candidates
      .filter(c => c.supplier_name === supplierName && c.supplier_emp_no)
      .map(c => {
        // Handle both old format (BALA1001) and new format (SUB-001-1001)
        const m = (c.supplier_emp_no||'').match(/(\d+)$/);
        return m ? parseInt(m[1]) : 0;
      })
      .filter(n => !isNaN(n) && n > 0);
    const next = existing.length > 0 ? Math.max(...existing) + 1 : 1001;
    return `${prefix}${next}`;
  }, [candidates]);

  const activeCandIds   = useMemo(()=>new Set(mobList.filter(m=>m.status==='mobilised').map(m=>m.candidate_id).filter(Boolean)),[mobList]);
  const activeNames     = useMemo(()=>new Set(mobList.filter(m=>m.status==='mobilised'&&!m.candidate_id).map(m=>(m.full_name||'').toLowerCase().trim())),[mobList]);
  const candSiteMap     = useMemo(()=>{ const m={}; mobList.filter(r=>r.status==='mobilised'&&r.candidate_id).forEach(r=>{ m[r.candidate_id]=r.location||'On Site'; }); return m; },[mobList]);
  const [excludeOnSite, setExcludeOnSite] = useState(false);
  // isOnSite: check mob_register, name fallback, AND HR portal mob_demob for SATCO employees
  const isOnSiteFn = useCallback(c => {
    if (activeCandIds.has(c.id)) return true;
    if (activeNames.has((c.full_name||'').toLowerCase().trim())) return true;
    if (c.source==='satco_own' && c.supplier_emp_no && hrMobActive.has(c.supplier_emp_no)) return true;
    return false;
  }, [activeCandIds, activeNames, hrMobActive]);
  // Build supplier list from mob_suppliers (full registry) + any names already in candidates
  const supplierList = useMemo(() => {
    const fromRegistry = suppliers.map(s => s.name).filter(Boolean);
    const fromCandidates = candidates.map(c => c.supplier_name).filter(Boolean);
    return [...new Set([...fromRegistry, ...fromCandidates])].sort();
  }, [suppliers, candidates]);

  const filtered = useMemo(()=> {
    const list = candidates.filter(c=>{
      if (excludeOnSite && (activeCandIds.has(c.id)||activeNames.has((c.full_name||'').toLowerCase().trim()))) return false;
      if (suppF.size && !suppF.has(c.supplier_name||'')) return false;
      if (desigF.size && !desigF.has(normalizeDesig(c.designation))) return false;
      if (cicpaLocF.size && !cicpaLocF.has(canonicalCicpa(c.cicpa_location))) return false;
      if (readyF.size) {
        const docOk = !!c.passport_no && !!c.emirates_id && !!c.visa_no;
        const mob = mobList.filter(m=>m.candidate_id===c.id||m.full_name===c.full_name).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
        const cicpaCandOk = c.cicpa_status==='active' && !!c.security_pass_no;
        const adnocCandOk = !!c.adnoc_medical_status && c.adnoc_medical_status!=='Unfit';
        const mobOk = !!mob?.hse_passport_done && !!mob?.h2s_done && cicpaCandOk && adnocCandOk && (c.source==='satco_own' || !!mob?.wp_approved_date);
        const allGreen = docOk && mobOk;
        if (readyF.has('ready')     && !allGreen) return false;
        if (readyF.has('not_ready') && allGreen)  return false;
      }
      return matchSearch(c, search);
    });
    // Sort: supplier name A→Z, then emp number numerically
    list.sort((a, b) => {
      const sA = (a.source==='satco_own' ? 'SATCO Arabia' : a.supplier_name||'').toLowerCase();
      const sB = (b.source==='satco_own' ? 'SATCO Arabia' : b.supplier_name||'').toLowerCase();
      if (sA !== sB) return sA.localeCompare(sB);
      // Within same supplier: sort by trailing number in emp no
      const nA = parseInt((a.supplier_emp_no||'').match(/(\d+)$/)?.[1]||'0');
      const nB = parseInt((b.supplier_emp_no||'').match(/(\d+)$/)?.[1]||'0');
      return nA - nB;
    });
    return list;
  }, [candidates, mobList, search, suppF, readyF, desigF, cicpaLocF, excludeOnSite]);

  // Unique values for filter dropdowns — normalized & deduplicated
  const designationOpts = useMemo(() => {
    // Group by normalized key, keep best canonical label (longest/most capitalized)
    const map = new Map(); // normalizedKey -> {label, count}
    candidates.forEach(c => {
      if (!c.designation) return;
      const key = normalizeDesig(c.designation);
      if (!map.has(key)) map.set(key, { label: canonicalDesig(c.designation), count: 0 });
      map.get(key).count++;
    });
    return [...map.entries()]
      .sort((a, b) => a[1].label.localeCompare(b[1].label))
      .map(([value, { label, count }]) => ({ value, label, count }));
  }, [candidates]);

  const cicpaLocationOpts = useMemo(() => {
    const map = new Map(); // canonicalEnglish -> count
    candidates.forEach(c => {
      if (!c.cicpa_location) return;
      const key = canonicalCicpa(c.cicpa_location);
      map.set(key, (map.get(key) || 0) + 1);
    });
    return [...map.entries()]
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([value, count]) => ({ value, label: value, count }));
  }, [candidates]);

  const supplierOpts = useMemo(() => {
    const map = new Map();
    candidates.forEach(c => {
      if (!c.supplier_name) return;
      map.set(c.supplier_name, (map.get(c.supplier_name)||0)+1);
    });
    return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([v,cnt])=>({value:v,label:v,count:cnt}));
  }, [candidates]);

  const blank = () => { setDraft({full_name:'',designation:'',source:'supplier',supplier_name:'',supplier_emp_no:'',nationality:'',date_of_birth:'',passport_no:'',passport_expiry:'',emirates_id:'',eid_expiry:'',visa_no:'',visa_type:'',visa_location:'',visa_expiry:'',phone:'',email:'',wp_no:'',wp_employer:'',wp_expiry:'',wp_issue_date:'',security_pass_no:'',security_pass_expiry:'',adnoc_medical_status:'',adnoc_medical_date:'',cicpa_location:'',cicpa_status:'not_issued',cicpa_remarks:'',remarks:'',active:true}); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); };

  const personHistory = (cand) => {
    const hist = mobList.filter(m => m.candidate_id === cand.id || m.full_name === cand.full_name);
    setHistPerson({candidate:cand, history:hist});
  };

  // Single click = highlight + open doc panel; double click = open edit form
  const handleRowClick = (cand, e) => {
    if (e.target.closest('button')) return;
    if (draft) return; // edit form is open — don't open doc panel
    clearTimeout(clickTimer.current);
    clickTimer.current = setTimeout(() => {
      setDocPanel({entity: cand, entityType: 'candidate'});
    }, 250);
  };
  const handleRowDblClick = (cand, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    setDocPanel(null); // close doc panel if open
    setDraft({...cand});
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0);
  };

  // Apply AI-scanned data back to a candidate record — handles all doc types
  const applyAiData = async (aiData, docType) => {
    if (!docPanel) return;
    const dt = (aiData.doc_type || docType || '').toLowerCase();
    const updates = {};

    // Work Permit — check passport matches, extract employer
    if (dt.includes('work_permit') || aiData.wp_no || aiData.wp_employer) {
      // Passport number cross-check
      const scannedPassport = aiData.passport_no || '';
      const existingPassport = docPanel.entity.passport_no || '';
      if (scannedPassport && existingPassport && scannedPassport.toUpperCase() !== existingPassport.toUpperCase()) {
        const proceed = window.confirm(
          `⚠ PASSPORT MISMATCH\n\nWork permit passport: ${scannedPassport}\nCandidate passport:   ${existingPassport}\n\nThese do not match — this work permit may belong to a different person.\n\nApply anyway?`
        );
        if (!proceed) return;
      }
      if (aiData.wp_no)         updates.wp_no         = aiData.wp_no;
      if (aiData.wp_employer)   updates.wp_employer   = aiData.wp_employer;
      const wpExp = aiData.wp_card_expiry || aiData.wp_expiry || aiData.wp_expiry;
      if (wpExp)                updates.wp_expiry     = wpExp;
      const wpIssue = aiData.wp_issue_date || aiData.issue_date;
      if (wpIssue)              updates.wp_issue_date = wpIssue;
      if (scannedPassport && !existingPassport) updates.passport_no = scannedPassport;
    }
    // Passport — only update name if currently empty, never touch designation
    else if (dt.includes('passport') || (aiData.passport_no && !aiData.wp_no)) {
      if (aiData.full_name && !docPanel.entity.full_name) updates.full_name = aiData.full_name;
      if (aiData.passport_no)     updates.passport_no     = aiData.passport_no;
      if (aiData.passport_expiry) updates.passport_expiry = aiData.passport_expiry;
      if (aiData.nationality)     updates.nationality     = aiData.nationality;
      if (aiData.date_of_birth)   updates.date_of_birth   = aiData.date_of_birth;
      // NEVER overwrite designation from any scan
    }
    // Emirates ID
    else if (dt.includes('emirates') || aiData.emirates_id) {
      if (aiData.emirates_id)  updates.emirates_id = aiData.emirates_id;
      if (aiData.eid_expiry)   updates.eid_expiry  = aiData.eid_expiry;
      if (aiData.full_name)    updates.full_name   = aiData.full_name;
    }
    // UAE Visa
    else if (dt.includes('visa') || aiData.visa_no) {
      if (aiData.visa_no)      updates.visa_no      = aiData.visa_no;
      if (aiData.visa_type)    updates.visa_type    = aiData.visa_type;
      if (aiData.visa_expiry)  updates.visa_expiry  = aiData.visa_expiry;
      if (aiData.issue_date)   updates.visa_expiry  = aiData.issue_date; // fallback
    }
    // CICPA gate pass / security pass — NEVER overwrite name or designation
    else if (dt.includes('cicpa') || aiData.cicpa_pass_no) {
      if (aiData.cicpa_pass_no)   updates.security_pass_no     = aiData.cicpa_pass_no;
      if (aiData.pass_expiry)     updates.security_pass_expiry = aiData.pass_expiry;
      if (aiData.cicpa_expiry)    updates.security_pass_expiry = aiData.cicpa_expiry;
      if (aiData.training_expiry) updates.security_pass_expiry = aiData.training_expiry;
      if (aiData.site_location)   updates.cicpa_location       = aiData.site_location;
      // Never touch full_name or designation from CICPA scan
    }
    // Medical / ADNOC Medical
    else if (dt.includes('medical') || aiData.medical_result || aiData.medical_date) {
      if (aiData.medical_result) updates.adnoc_medical_status = aiData.medical_result;
      if (aiData.medical_date)   updates.adnoc_medical_date   = aiData.medical_date;
      if (aiData.issue_date && !aiData.medical_date) updates.adnoc_medical_date = aiData.issue_date;
    }
    // Fallback: fill whatever recognised document fields exist — never overwrite designation or existing name
    else {
      if (aiData.full_name && !docPanel.entity.full_name) updates.full_name = aiData.full_name;
      if (aiData.passport_no)     updates.passport_no     = aiData.passport_no;
      if (aiData.passport_expiry) updates.passport_expiry = aiData.passport_expiry;
      if (aiData.emirates_id)     updates.emirates_id     = aiData.emirates_id;
      if (aiData.eid_expiry)      updates.eid_expiry      = aiData.eid_expiry;
      if (aiData.nationality)     updates.nationality     = aiData.nationality;
      if (aiData.date_of_birth)   updates.date_of_birth   = aiData.date_of_birth;
      if (aiData.cicpa_pass_no)   updates.security_pass_no    = aiData.cicpa_pass_no;
      if (aiData.site_location)   updates.cicpa_location       = aiData.site_location;
      if (aiData.pass_expiry)     updates.security_pass_expiry = aiData.pass_expiry;
    }

    if (!Object.keys(updates).length) { alert('No recognised fields found in this document.'); return; }

    // Clean nationality — strip Arabic if parenthetical English exists e.g. "الهند (India)" → "India"
    if (updates.nationality) {
      const m = updates.nationality.match(/\(([^)]+)\)/);
      if (m) updates.nationality = m[1];
    }

    const { error } = await db.from('mob_candidates').update({...updates, updated_at: new Date().toISOString()}).eq('id', docPanel.entity.id);
    if (error) { alert(error.message); return; }
    await onRefresh?.();
    setDocPanel(d => d ? {...d, entity:{...d.entity,...updates}} : d);
    const filled = Object.keys(updates).join(', ');
    alert(`✓ Updated: ${filled}`);
  };

  // ── Export all portal fields as Excel ─────────────────────────────────────
  const exportExcel = (rows, filename) => {
    const XLSX = window.XLSX;
    if (!XLSX) return alert('SheetJS not loaded — refresh and try again.');
    const data = rows.map((c, i) => {
      // Get latest mob record for this candidate
      const mob = mobList
        .filter(m => m.candidate_id === c.id || m.full_name === c.full_name)
        .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
      const docOk = !!c.passport_no && !!c.emirates_id && !!c.visa_no;
      const cicpaDone = c.cicpa_status === 'active' && !!c.security_pass_no;
      const adnocOk   = !!c.adnoc_medical_status && c.adnoc_medical_status !== 'Unfit';
      const wpDone    = !!mob?.wp_approved_date;
      const hseDone   = !!mob?.hse_passport_done;
      const h2sDone   = !!mob?.h2s_done;
      const mobOk     = hseDone && h2sDone && cicpaDone && adnocOk && (c.source==='satco_own' || wpDone);
      const ready     = docOk && mobOk ? 'Ready' : docOk ? 'Pending' : 'Docs Missing';
      const fD = d => d ? new Date(d).toLocaleDateString('en-GB') : '';
      return {
        'S.No':                  i + 1,
        'Name':                  c.full_name || '',
        'Supplier Emp No':       c.supplier_emp_no || '',
        'Supplier':              c.source==='satco_own' ? 'SATCO Arabia' : (c.supplier_name || ''),
        'Designation':           c.designation || '',
        'Source':                c.source || '',
        'Nationality':           c.nationality || '',
        'Date of Birth':         fD(c.date_of_birth),
        'Passport No':           c.passport_no || '',
        'Passport Expiry':       fD(c.passport_expiry),
        'Emirates ID':           c.emirates_id || '',
        'EID Expiry':            fD(c.eid_expiry),
        'Visa No':               c.visa_no || '',
        'Visa Type':             c.visa_type || '',
        'Visa Issued Emirate':   c.visa_location || '',
        'Visa Expiry':           fD(c.visa_expiry),
        'Security Pass No':      c.security_pass_no || '',
        'Security Pass Expiry':  fD(c.security_pass_expiry),
        'CICPA Status':          c.cicpa_status || '',
        'CICPA Location':        c.cicpa_location || '',
        'CICPA Remarks':         c.cicpa_remarks || '',
        'ADNOC Medical':         c.adnoc_medical_status || '',
        'ADNOC Medical Date':    fD(c.adnoc_medical_date),
        'Work Permit No':        mob?.wp_no || '',
        'WP Applied Date':       fD(mob?.wp_applied_date),
        'WP Approved Date':      fD(mob?.wp_approved_date),
        'WP Expiry':             fD(mob?.wp_expiry),
        'Medical Done':          mob?.medical_done ? 'Yes' : 'No',
        'Medical Date':          fD(mob?.medical_date),
        'Medical Result':        mob?.medical_result || '',
        'Medical Expiry':        fD(mob?.medical_expiry),
        'HSE Passport':          mob?.hse_passport_done ? 'Yes' : 'No',
        'HSE Date':              fD(mob?.hse_passport_date),
        'HSE Expiry':            fD(mob?.hse_passport_expiry),
        'H2S Done':              mob?.h2s_done ? 'Yes' : 'No',
        'H2S Date':              fD(mob?.h2s_date),
        'H2S Expiry':            fD(mob?.h2s_expiry),
        'CICPA Pass No (Mob)':   mob?.cicpa_pass_no || '',
        'CICPA Approved Date':   fD(mob?.cicpa_approved_date),
        'CICPA Expiry':          fD(mob?.cicpa_expiry_date),
        'Customer':              mob?.customer_name || '',
        'Location / Site':       mob?.location || '',
        'Mob Status':            mob?.status || '',
        'Mobilisation Date':     fD(mob?.mobilisation_date),
        'Demob Date':            fD(mob?.demobilisation_date),
        'Demob Reason':          mob?.demob_reason || '',
        'Readiness':             ready,
        'Phone':                 c.phone || '',
        'Remarks':               c.remarks || '',
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    // Column widths
    ws['!cols'] = [
      {wch:5},{wch:28},{wch:14},{wch:36},{wch:18},{wch:10},{wch:12},{wch:12},
      {wch:12},{wch:14},{wch:20},{wch:12},{wch:14},{wch:12},{wch:14},{wch:12},
      {wch:16},{wch:16},{wch:12},{wch:24},{wch:20},{wch:14},{wch:14},
      {wch:14},{wch:14},{wch:14},{wch:12},{wch:10},{wch:12},{wch:12},{wch:12},
      {wch:10},{wch:12},{wch:12},{wch:10},{wch:12},{wch:12},{wch:14},{wch:16},{wch:12},
      {wch:20},{wch:20},{wch:12},{wch:16},{wch:14},{wch:14},{wch:14},{wch:16},{wch:20},
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Candidates');
    XLSX.writeFile(wb, `${filename}_${todayStr()}.xlsx`);
  };

  return (

      <div ref={measureToStk2} className="sticky-toolbar" style={{padding:'8px 14px',display:'flex',gap:'8px',justifyContent:'space-between',flexWrap:'wrap',alignItems:'center'}}>

          <button style={{...S.btnSm,background:excludeOnSite?'#0369a1':'#f1f5f9',color:excludeOnSite?'#fff':'#475569',fontWeight:700,border:'1px solid',borderColor:excludeOnSite?'#0369a1':'#e2e8f0'}}
            onClick={()=>setExcludeOnSite(v=>!v)}
            title={excludeOnSite?'Click to show all candidates':'Click to hide candidates currently on site'}>

      </div>

      {draft&&(
        <div style={{...S.card,padding:'16px',marginBottom:'14px',background:'#fffbeb',border:'1px solid #fde68a'}}>
          <div style={{fontWeight:800,fontSize:'14px',color:'#92400e',marginBottom:'14px'}}>{draft.id?'Edit Person':'Add Person to Candidates Pool'}</div>

          {/* AI Document Scan — upload all docs at once */}
          <div style={{background:'#0f172a',borderRadius:'8px',padding:'14px 16px',marginBottom:'16px'}}>
            <div style={{fontWeight:800,fontSize:'13px',color:'#b8972a',marginBottom:'4px'}}>✨ Scan All Documents — AI fills the form automatically</div>
            <div style={{fontSize:'11px',color:'#64748b',marginBottom:'10px'}}>Upload passport, Emirates ID, visa, medical — all at once. AI reads each and fills the matching fields.</div>
            <label style={{display:'inline-flex',alignItems:'center',gap:'10px',padding:'10px 20px',background:'#b8972a',color:'#fff',borderRadius:'6px',cursor:'pointer',fontWeight:700,fontSize:'13px',whiteSpace:'nowrap'}}>
              {draft._scanning ? (draft._scanStatus||'⏳ Reading documents…') : '📂 Upload Documents (select multiple)'}
              <input type="file" accept="image/*,application/pdf" multiple style={{display:'none'}}
                onChange={async e=>{
                  const files=Array.from(e.target.files||[]); if(!files.length)return;
                  setDraft(d=>({...d,_scanning:true,_scanErr:'',_scanResult:null}));
                  const allUpdates={};
                  const allResults=[];
                  const docTypeGuess = f => {
                    const n=f.name.toLowerCase();
                    if(n.includes('passport')||n.includes('pp')) return 'passport';
                    if(n.includes('eid')||n.includes('emirates')||n.includes('id')) return 'eid';
                    if(n.includes('visa')||n.includes('entry')) return 'visa';
                    if(n.includes('medical')||n.includes('fit')||n.includes('health')) return 'medical';
                    if(n.includes('cicpa')||n.includes('gate')) return 'cicpa';
                    if(n.includes('permit')||n.includes('wp')) return 'work_permit';
                    return 'passport'; // default — passport most common
                  };
                  // Unified field map — covers all document types
                  const directMap = {
                    passport_no:'passport_no', nationality:'nationality',
                    date_of_birth:'date_of_birth', passport_expiry:'passport_expiry',
                    emirates_id:'emirates_id', eid_expiry:'eid_expiry',
                    phone:'phone',
                    // full_name handled separately (only if empty)
                    // designation NEVER overwritten from scan
                    // visa fields excluded — EID covers visa for UAE residents
                  };
                  try {
                    for (const file of files) {
                      const isPdf = (await detectMimeType(file))==='application/pdf';
                      setDraft(d=>({...d,_scanStatus:`${isPdf?'🔄 Processing PDF':'📷 Reading'}: ${file.name}…`}));
                      const result = await aiScanDocument(file, 'other');
                      const detectedType = (result.doc_type || 'unknown').toLowerCase();
                      // Map standard document fields — never overwrite existing values
                      Object.entries(result).forEach(([k,v]) => {
                        if(directMap[k] && v && !allUpdates[directMap[k]]) allUpdates[directMap[k]] = v;
                      });
                      // full_name: only if draft currently has no name
                      if (result.full_name && !draft.full_name && !allUpdates.full_name) allUpdates.full_name = result.full_name;
                      // ── Work Permit (MOHRE) ──────────────────────────────
                      if (detectedType.includes('work_permit') || result.wp_no || result.wp_employer) {
                        // Passport cross-check warning
                        const scannedPP = result.passport_no || '';
                        const existingPP = (draft.passport_no || allUpdates.passport_no || '').toUpperCase();
                        if (scannedPP && existingPP && scannedPP.toUpperCase() !== existingPP) {
                          allUpdates._wpPassportWarn = `WP passport (${scannedPP}) ≠ candidate passport (${existingPP}) — please verify`;
                        }
                        if (result.wp_no       && !allUpdates.wp_no)         allUpdates.wp_no         = result.wp_no;
                        if (result.wp_employer && !allUpdates.wp_employer)   allUpdates.wp_employer   = result.wp_employer;
                        const wpExp = result.wp_card_expiry || result.wp_expiry;
                        if (wpExp              && !allUpdates.wp_expiry)     allUpdates.wp_expiry     = wpExp;
                        const wpIss = result.wp_issue_date || result.issue_date;
                        if (wpIss              && !allUpdates.wp_issue_date) allUpdates.wp_issue_date = wpIss;
                      }
                      // CICPA gate pass / security pass — never touch name or designation
                      if (detectedType.includes('cicpa') || result.cicpa_pass_no) {
                        if (result.cicpa_pass_no && !allUpdates.security_pass_no)
                          allUpdates.security_pass_no = result.cicpa_pass_no;
                        const exp = result.pass_expiry || result.cicpa_expiry || result.training_expiry;
                        if (exp && !allUpdates.security_pass_expiry) allUpdates.security_pass_expiry = exp;
                        if (result.site_location && !allUpdates.cicpa_location) allUpdates.cicpa_location = result.site_location;
                      }
                      // ADNOC Medical / medical certificate
                      if (detectedType.includes('medical') || result.medical_result || result.medical_date) {
                        if (result.medical_result && !allUpdates.adnoc_medical_status) allUpdates.adnoc_medical_status = result.medical_result;
                        const md = result.medical_date || result.issue_date;
                        if (md && !allUpdates.adnoc_medical_date) allUpdates.adnoc_medical_date = md;
                      }
                      allResults.push({file:file.name, docType:detectedType, result});
                    }
                    // Clean nationality — remove Arabic text if it contains parenthetical English
                    if (allUpdates.nationality) {
                      const m = allUpdates.nationality.match(/\(([^)]+)\)/);
                      if (m) allUpdates.nationality = m[1]; // extract English from e.g. "الهند (India)"
                    }
                    setDraft(d=>({...d,...allUpdates,_scanning:false,_scanResult:allResults}));
                  } catch(ex) { setDraft(d=>({...d,_scanning:false,_scanErr:ex.message})); }
                  e.target.value='';
                }}/>
            </label>
            {draft._scanning&&(
              <div style={{marginTop:'10px',color:'#b8972a',fontSize:'13px',fontWeight:600}}>⏳ Reading documents, please wait…</div>
            )}
            {draft._scanErr&&<div style={{color:'#f87171',fontSize:'12px',marginTop:'8px'}}>⚠ {draft._scanErr}</div>}
            {draft._scanResult&&Array.isArray(draft._scanResult)&&(
              <div style={{marginTop:'10px'}}>
                <div style={{color:'#4ade80',fontWeight:700,fontSize:'13px',marginBottom:'6px'}}>✓ {draft._scanResult.length} document(s) scanned — fields filled below</div>
                {draft._wpPassportWarn&&(
                  <div style={{background:'#fef3c7',border:'1px solid #f59e0b',borderRadius:'6px',padding:'8px 12px',marginBottom:'6px',fontSize:'12px',color:'#92400e',fontWeight:600}}>
                    ⚠ Passport Mismatch: {draft._wpPassportWarn}
                  </div>
                )}
                {draft._scanResult.map((r,i)=>(
                  <div key={i} style={{background:'#1e293b',borderRadius:'5px',padding:'6px 10px',marginBottom:'4px',fontSize:'11px',color:'#94a3b8'}}>
                    <span style={{color:'#b8972a',fontWeight:700}}>{r.file}</span>
                    <span style={{color:'#4ade80',fontWeight:700,marginLeft:'8px'}}>[{r.docType.replace(/_/g,' ')}]</span>:&nbsp;
                    {Object.entries(r.result).filter(([k,v])=>v&&k!=='doc_type').map(([k,v])=>`${k.replace(/_/g,' ')}: ${v}`).join(' · ')}
                  </div>
                ))}
                <div style={{fontSize:'11px',color:'#64748b',marginTop:'4px'}}>Review the fields below — edit anything if needed — then click Save.</div>
              </div>
            )}
            <div style={{marginTop:'8px',fontSize:'11px',color:'#475569'}}>
              💡 Tip: Name files before uploading for better detection — e.g. <em>passport.jpg</em>, <em>eid.jpg</em>, <em>visa.pdf</em>. Or select all files and AI will do its best to identify each.
            </div>
          </div>
          <Grid cols={3}>
            <Field label="Full Name *"><input value={draft.full_name||''} onChange={e=>setDraft(d=>({...d,full_name:e.target.value}))} style={S.input}/></Field>
            <Field label="Designation"><input value={draft.designation||''} onChange={e=>setDraft(d=>({...d,designation:e.target.value}))} placeholder="Pipe Fitter / Fabricator / Engineer…" style={S.input}/></Field>
            <Field label="Source">
              <select value={draft.source||'supplier'} onChange={e=>setDraft(d=>({...d,source:e.target.value}))} style={S.input}>
                <option value="supplier">Labour Supplier</option>
                <option value="satco_own">SATCO Own Employee</option>
              </select>
            </Field>
            {draft.source==='supplier'&&<>
              <Field label="Supplier Company">
                <select value={draft.supplier_name||''} style={S.input}
                  onChange={e=>{
                    const name = e.target.value;
                    const nextNo = getNextEmpNo(name, suppliers);
                    setDraft(d=>({...d, supplier_name:name, supplier_emp_no:nextNo}));
                  }}>
                  <option value="">— Select Supplier —</option>
                  {supplierList.map(s => {
                    const rec = suppliers.find(x=>x.name===s);
                    return <option key={s} value={s}>{rec?.supplier_code ? `${rec.supplier_code} · ` : ''}{s}</option>;
                  })}
                </select>
                <div style={{fontSize:'10px',color:'#94a3b8',marginTop:'2px'}}>Select from registered suppliers · <span style={{color:'#b8972a',cursor:'pointer',textDecoration:'underline'}} onClick={()=>{}}>Manage in Suppliers tab</span></div>
              </Field>
              <Field label="Supplier Emp No">
                <input value={draft.supplier_emp_no||''} onChange={e=>setDraft(d=>({...d,supplier_emp_no:e.target.value}))}
                  placeholder="e.g. SUB-001-1001" style={S.input}/>
                <div style={{fontSize:'10px',color:'#94a3b8',marginTop:'2px'}}>Auto-generated as SUB-001-1001 · edit if needed</div>
              </Field>
            </>}
            {draft.source==='satco_own'&&(
              <Field label="SATCO Employee">
                <select value={draft.supplier_emp_no||''} onChange={e=>{
                  const emp=satcoEmps.find(x=>x.employee_id===e.target.value);
                  setDraft(d=>({...d,
                    supplier_emp_no: e.target.value,
                    supplier_name: 'SATCO Arabia',
                    full_name: emp?.full_name||d.full_name,
                    designation: emp?.position||d.designation,

                    date_of_birth: emp?.dob||d.date_of_birth,
