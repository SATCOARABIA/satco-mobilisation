// ── Sticky header measurement ─────────────────────────────────────────────────
// Measures each sticky layer's real rendered height and publishes it as a CSS
// variable, so the next layer knows exactly where to stick. Same pattern as HR/Finance portals.
function readStkVar(n) { const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)); return isNaN(v)?0:v; }
function setStkVar(n,px) { document.documentElement.style.setProperty(n,Math.round(px)+'px'); }

// Callback ref for toolbar divs — call as ref={measureToStk2} on the toolbar element
function measureToStk2(el) {
  if (!el) return;
  const compute = () => setStkVar('--stk-2', readStkVar('--stk-1') + el.offsetHeight);
  compute();
  if (!el.__stkRO) {
    el.__stkRO = new ResizeObserver(compute);
    el.__stkRO.observe(el);
    window.addEventListener('resize', compute);
    let ticks=0;
    const iv=setInterval(()=>{ if(!el.isConnected||++ticks>20){clearInterval(iv);return;} compute(); },250);
  }
}

// Callback ref for filter bars — call as ref={measureToStk3}
function measureToStk3(el) {
  if (!el) return;
  const compute = () => setStkVar('--stk-3', readStkVar('--stk-2') + el.offsetHeight);
  compute();
  if (!el.__stkRO) {
    el.__stkRO = new ResizeObserver(compute);
    el.__stkRO.observe(el);
    window.addEventListener('resize', compute);
    let ticks=0;
    const iv=setInterval(()=>{ if(!el.isConnected||++ticks>20){clearInterval(iv);return;} compute(); },250);
  }
}

// Hook for the top nav — publishes --stk-1
function useStkPublish(varName, baseVarName) {
  const [node,setNode] = useState(null);
  const ref = useCallback(n=>setNode(n),[]);
  useLayoutEffect(()=>{
    if(!node)return;
    const compute=()=>setStkVar(varName,(baseVarName?readStkVar(baseVarName):0)+node.offsetHeight);
    compute();
    const ro=new ResizeObserver(compute);
    ro.observe(node);
    window.addEventListener('resize',compute);
    let ticks=0;
    const iv=setInterval(()=>{if(++ticks>20){clearInterval(iv);return;}compute();},250);
    return()=>{ro.disconnect();window.removeEventListener('resize',compute);clearInterval(iv);};
  },[node]);
  return ref;
}

// ── Drag-to-scroll ────────────────────────────────────────────────────────────
// Global handler: any element with class "drag-scroll" or "tbl-box" becomes
// draggable with mouse/pointer. Matches HR/Finance portal behaviour exactly.
function useDragScroll() {
  useEffect(()=>{
    let active=null;
    const stop=()=>{ if(active?.el) active.el.classList.remove('dragging'); active=null; };
    const onDown=e=>{
      if(e.button!==0)return;
      const el=e.target.closest&&e.target.closest('.drag-scroll,.tbl-box');
      if(!el)return;
      if(e.target.closest('button,input,select,textarea,a,label,[contenteditable="true"]'))return;
      if(el.scrollWidth<=el.clientWidth&&el.scrollHeight<=el.clientHeight)return;
      active={el,startX:e.clientX,startY:e.clientY,left:el.scrollLeft,top:el.scrollTop,moved:false};
      el.classList.add('dragging');
    };
    const onMove=e=>{
      if(!active)return;
      const dx=e.clientX-active.startX, dy=e.clientY-active.startY;
      if(Math.abs(dx)>3||Math.abs(dy)>3) active.moved=true;
      active.el.scrollLeft=active.left-dx;
      active.el.scrollTop=active.top-dy;
      e.preventDefault();
    };
    const onClick=e=>{ if(active?.moved){e.preventDefault();e.stopPropagation();} };
    document.addEventListener('mousedown',onDown);
    document.addEventListener('mousemove',onMove,{passive:false});
    document.addEventListener('mouseup',stop);
    document.addEventListener('mouseleave',stop);
    document.addEventListener('click',onClick,true);
    return()=>{
      document.removeEventListener('mousedown',onDown);
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',stop);
      document.removeEventListener('mouseleave',stop);
      document.removeEventListener('click',onClick,true);
    };
  },[]);
}

const fmtDate  = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtDOB   = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
const todayStr = () => new Date().toISOString().slice(0,10);
const isExpired = d => d && new Date(d) < new Date();

const SEARCH_FIELDS = ['full_name','designation','supplier_name','supplier_emp_no','nationality','passport_no','emirates_id','visa_no','visa_location','customer_name','location','cicpa_pass_no','wp_no','phone','remarks','notes'];
const matchSearch = (obj, q) => {
  if (!q) return true;
  const lq = q.toLowerCase();
  return SEARCH_FIELDS.some(f => (obj[f]||'').toLowerCase().includes(lq));
};

function exportCSV(rows, filename, cols) {
  const hdr = cols.map(c => c.label);
  const data = rows.map(r => cols.map(c => {
    const v = c.key.split('.').reduce((o,k) => o?.[k], r);
    if (c.bool) return v ? 'Yes' : 'No';
    if (c.date) return v ? fmtDOB(v) : '';
    return v ?? '';
  }));
  const csv = [hdr,...data].map(row => row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), {href:url, download:`${filename}_${todayStr()}.csv`}).click();
  URL.revokeObjectURL(url);
}

// ── Document / Storage helpers ────────────────────────────────────────────────
const fileToBase64 = file => new Promise((res,rej)=>{
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]);
  r.onerror = () => rej(new Error('File read failed'));
  r.readAsDataURL(file);
});

// Upload a file to Supabase Storage and record in mob_documents
async function uploadDocument(file, entityType, entityId, docType, docLabel) {
  const ext   = file.name.split('.').pop().toLowerCase();
  const path  = `${entityType}/${entityId}/${docType}_${Date.now()}.${ext}`;
  const { error: upErr } = await db.storage.from(DOC_BUCKET).upload(path, file, { upsert: false });
  if (upErr) throw new Error('Upload failed: ' + upErr.message);
  const { error: dbErr } = await db.from('mob_documents').insert({
    entity_type: entityType, entity_id: entityId,
    doc_type: docType, doc_label: docLabel || file.name,
    file_path: path, file_name: file.name,
    file_size: file.size, mime_type: file.type,
  });
  if (dbErr) throw new Error('Record failed: ' + dbErr.message);
  return path;
}

// Get a signed URL for viewing (60-minute expiry)
async function getSignedUrl(filePath) {
  const { data, error } = await db.storage.from(DOC_BUCKET).createSignedUrl(filePath, 3600);
  if (error) throw new Error(error.message);
  return data.signedUrl;
}

// AI scan a document image/PDF for passport/EID/visa data
async function aiScanDocument(file, docType) {
  const b64      = await fileToBase64(file);
  const mimeType = file.type || 'application/pdf';
  const prompts  = {
    passport:     'Extract from this passport: full_name, passport_no, nationality, date_of_birth (YYYY-MM-DD), expiry_date (YYYY-MM-DD), country_of_issue. Return ONLY valid JSON, no markdown.',
    eid:          'Extract from this UAE Emirates ID: full_name, emirates_id (15 digits), nationality, date_of_birth (YYYY-MM-DD), expiry_date (YYYY-MM-DD), id_number. Return ONLY valid JSON.',
    visa:         'Extract from this UAE visa/entry permit: full_name, visa_no, visa_type, nationality, issue_date (YYYY-MM-DD), expiry_date (YYYY-MM-DD), sponsor_name, place_of_issue. Return ONLY valid JSON.',
    medical:      'Extract from this medical report: full_name, result (Fit/Unfit), exam_date (YYYY-MM-DD), expiry_date if shown (YYYY-MM-DD), issuing_authority. Return ONLY valid JSON.',
    work_permit:  'Extract from this UAE work permit: full_name, wp_no, occupation, issue_date (YYYY-MM-DD), expiry_date (YYYY-MM-DD), sponsor. Return ONLY valid JSON.',
    cicpa:        'Extract from this CICPA gate pass: full_name, pass_no, designation, issue_date (YYYY-MM-DD), expiry_date (YYYY-MM-DD), location. Return ONLY valid JSON.',
    other:        'Extract all key information from this document. Return ONLY valid JSON with relevant fields.',
  };
  const prompt = prompts[docType] || prompts.other;
  const contentType = mimeType.startsWith('image/') ? 'image' : 'document';
  const res = await fetch(CLAUDE_PROXY, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:800,
      messages:[{ role:'user', content:[
        { type: contentType, source:{ type:'base64', media_type:mimeType, data:b64 } },
        { type:'text', text: prompt },
      ]}]
    })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  const text = (data.content||[]).map(c=>c.text||'').join('').trim();
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('AI did not return JSON: ' + text.slice(0,200));
  return JSON.parse(match[0]);
}

  const m = {pending:{bg:'#fef9c3',c:'#854d0e'},mobilised:{bg:'#dcfce7',c:'#166534'},demobilised:{bg:'#f1f5f9',c:'#475569'},rejected:{bg:'#fee2e2',c:'#991b1b'}};
  const s = m[status] || m.pending;
  return <span style={{background:s.bg,color:s.c,fontWeight:700,fontSize:'11px',padding:'2px 8px',borderRadius:10,textTransform:'capitalize'}}>{status}</span>;
}
function Tick({done,label,date}) {
  return done
    ? <span style={{color:'#166534',fontWeight:700,fontSize:'11px'}}>✓ {label}{date?' '+fmtDate(date):''}</span>
    : <span style={{color:'#9ca3af',fontSize:'11px'}}>— {label}</span>;
}
// ── Global Search Bar ─────────────────────────────────────────────────────────
function GlobalSearch({value, onChange, results, onSelect, onClear}) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);
  return (
    <div ref={ref} style={{position:'relative', width:'340px'}}>
      <div style={{display:'flex', gap:'6px', alignItems:'center'}}>
        <span style={{position:'absolute', left:'10px', color:'#94a3b8', fontSize:'15px', pointerEvents:'none'}}>🔍</span>
        <input
          value={value}
          onChange={e => { onChange(e.target.value); setOpen(true); }}
          onFocus={() => value && setOpen(true)}
          placeholder="Search name, EID, passport, designation…"
          style={{...S.input, paddingLeft:'32px', background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.2)', color:'#fff', fontSize:'13px'}}
        />
        {value && <button onClick={()=>{ onChange(''); setOpen(false); onClear?.(); }} style={{position:'absolute',right:'8px',background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:'16px',lineHeight:1}}>×</button>}
      </div>
      {open && results.length > 0 && (
        <div style={{position:'absolute',top:'calc(100% + 6px)',left:0,right:0,background:'#fff',border:'1px solid #e2e8f0',borderRadius:'8px',boxShadow:'0 8px 24px rgba(0,0,0,0.15)',zIndex:200,maxHeight:'360px',overflowY:'auto'}}>
          {results.map((r,i) => (
            <div key={i} onClick={() => { onSelect(r); setOpen(false); onChange(''); }}
              style={{padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid #f1f5f9',display:'flex',gap:'10px',alignItems:'center'}}
              onMouseEnter={e=>e.currentTarget.style.background='#f8fafc'}
              onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
              <span style={{fontSize:'18px'}}>{r._type==='candidate'?'👤':'🏗️'}</span>
              <div>
                <div style={{fontWeight:700,fontSize:'13px',color:'#0f172a'}}>{r.full_name}</div>
                <div style={{fontSize:'11px',color:'#64748b'}}>
                  {r.designation||'—'} · {r._type==='candidate'?(r.supplier_name||'SATCO Own'):`${r.customer_name} / ${r.location}`}
                  {r.emirates_id && <span style={{fontFamily:'monospace',marginLeft:'8px'}}>{r.emirates_id}</span>}
                  {r.passport_no && <span style={{fontFamily:'monospace',marginLeft:'6px'}}>{r.passport_no}</span>}
                </div>
              </div>
              <span style={{marginLeft:'auto',fontSize:'10px',fontWeight:700,color:'#94a3b8'}}>{r._type==='candidate'?'CANDIDATE':'MOB RECORD'}</span>
            </div>
          ))}
        </div>
      )}
      {open && value && results.length === 0 && (
        <div style={{position:'absolute',top:'calc(100% + 6px)',left:0,right:0,background:'#fff',border:'1px solid #e2e8f0',borderRadius:'8px',padding:'14px',color:'#94a3b8',fontSize:'13px',textAlign:'center',zIndex:200}}>
          No results for "{value}"
        </div>
      )}
    </div>
  );
}

// ── LOA Alert Banner ──────────────────────────────────────────────────────────
function LoaBanner({loaList, usedMap, onManage}) {
  const alerts = loaList.filter(l => (l.total_count-(usedMap[l.id]||0)) < (l.alert_threshold||10));
  if (!alerts.length) return null;
  return (
    <div style={{background:'#fef3c7',border:'1px solid #fde68a',borderRadius:'8px',padding:'10px 16px',marginBottom:'16px',display:'flex',gap:'12px',alignItems:'flex-start'}}>
      <span style={{fontSize:'22px',flexShrink:0}}>⚠️</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:800,fontSize:'13px',color:'#92400e',marginBottom:'4px'}}>LOA Running Low — Request New LOA from Customer</div>
        {alerts.map(l => {
          const rem = l.total_count-(usedMap[l.id]||0);
          return (
            <div key={l.id} style={{fontSize:'12.5px',color:'#78350f',marginBottom:'2px'}}>
              <strong>{l.customer_name}</strong> · {l.location}: <strong style={{color:rem<=5?'#dc2626':'#b45309'}}>{rem} remaining</strong> of {l.total_count} (ref: {l.loa_reference||'—'})
              <span style={{marginLeft:'10px',color:'#0369a1',cursor:'pointer',textDecoration:'underline'}} onClick={onManage}>Manage LOA →</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Document Panel ────────────────────────────────────────────────────────────
// Slide-out right panel: shows candidate/mob record details, documents, AI scan
function DocumentPanel({entity, entityType, onClose, onApplyAiData}) {
  const [docs,       setDocs]       = useState([]);
  const [loading,    setLoading]    = useState(true);
  const [uploading,  setUploading]  = useState(false);
  const [scanning,   setScanning]   = useState(null); // doc id being scanned
  const [scanResult, setScanResult] = useState(null);
  const [err,        setErr]        = useState('');
  const [docType,    setDocType]    = useState('passport');
  const fileRef = useRef(null);

  const DOC_TYPES = [
    {v:'passport',    l:'Passport'},
    {v:'eid',         l:'Emirates ID'},
    {v:'visa',        l:'UAE Visa'},
    {v:'medical',     l:'Medical Certificate'},
    {v:'work_permit', l:'Work Permit'},
    {v:'cicpa',       l:'CICPA Gate Pass'},
    {v:'other',       l:'Other'},
  ];

  const loadDocs = useCallback(async () => {
    setLoading(true);
    const { data } = await db.from('mob_documents')
      .select('*')
      .eq('entity_type', entityType)
      .eq('entity_id', entity.id)
      .order('uploaded_at', {ascending:false});
    setDocs(data || []);
    setLoading(false);
  }, [entity.id, entityType]);

  useEffect(() => { loadDocs(); }, [loadDocs]);

  const handleUpload = async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    setErr(''); setUploading(true);
    try {
      await uploadDocument(file, entityType, entity.id, docType, DOC_TYPES.find(d=>d.v===docType)?.l || docType);
      await loadDocs();
    } catch(ex) { setErr(ex.message); }
    setUploading(false);
    e.target.value = '';
  };

  const viewDoc = async doc => {
    try {
      const url = await getSignedUrl(doc.file_path);
      window.open(url, '_blank');
    } catch(ex) { setErr(ex.message); }
  };

  const deleteDoc = async doc => {
    if (!window.confirm(`Delete "${doc.doc_label}"?`)) return;
    await db.storage.from(DOC_BUCKET).remove([doc.file_path]);
    await db.from('mob_documents').delete().eq('id', doc.id);
    await loadDocs();
  };

  const scanDoc = async doc => {
    setErr(''); setScanning(doc.id); setScanResult(null);
    try {
      // Download file content for scanning
      const { data: blob } = await db.storage.from(DOC_BUCKET).download(doc.file_path);
      const file = new File([blob], doc.file_name || 'doc', { type: doc.mime_type || 'image/jpeg' });
      const result = await aiScanDocument(file, doc.doc_type || 'other');
      setScanResult({ docId: doc.id, data: result, docType: doc.doc_type });
      // Mark as scanned in DB
      await db.from('mob_documents').update({ ai_scanned: true, ai_data: result }).eq('id', doc.id);
      await loadDocs();
    } catch(ex) { setErr('AI scan failed: ' + ex.message); }
    setScanning(null);
  };

  const applyToRecord = data => {
    if (onApplyAiData) onApplyAiData(data, scanResult?.docType);
    setScanResult(null);
  };

  // Field mapping from AI scan result to record fields
  const getSuggestedFields = (aiData, docType) => {
    const map = {
      passport:    [['full_name','Full Name'],['passport_no','Passport No'],['nationality','Nationality'],['date_of_birth','Date of Birth'],['expiry_date','Passport Expiry']],
      eid:         [['full_name','Full Name'],['emirates_id','Emirates ID'],['expiry_date','EID Expiry']],
      visa:        [['full_name','Full Name'],['visa_no','Visa No'],['visa_type','Visa Type'],['expiry_date','Visa Expiry']],
      medical:     [['result','Result'],['exam_date','Medical Date'],['expiry_date','Medical Expiry']],
      work_permit: [['full_name','Full Name'],['wp_no','WP Number'],['expiry_date','WP Expiry']],
      cicpa:       [['full_name','Full Name'],['pass_no','CICPA Pass No'],['expiry_date','CICPA Expiry']],
    };
    return (map[docType] || []).filter(([k]) => aiData[k]);
  };

  const typeColor = { passport:'#2563eb',eid:'#7c3aed',visa:'#0369a1',medical:'#166534',work_permit:'#b45309',cicpa:'#991b1b',other:'#475569' };

  return (
    <div style={{position:'fixed',inset:0,zIndex:400,display:'flex'}}>
      {/* Backdrop */}
      <div style={{flex:1,background:'rgba(0,0,0,0.4)'}} onClick={onClose}/>
      {/* Panel */}
      <div style={{width:'480px',background:'#fff',height:'100%',overflowY:'auto',boxShadow:'-8px 0 32px rgba(0,0,0,0.2)',display:'flex',flexDirection:'column'}}>
        {/* Header */}
        <div style={{padding:'16px 20px',background:'#0f172a',color:'#fff',flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <div style={{fontSize:'11px',fontWeight:700,color:'#b8972a',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'2px'}}>
                {entityType === 'candidate' ? 'Candidate' : 'Mobilisation Record'}
              </div>
              <div style={{fontWeight:800,fontSize:'16px'}}>{entity.full_name}</div>
              <div style={{fontSize:'12px',color:'#94a3b8',marginTop:'2px'}}>
                {entity.designation||'—'}
                {entityType==='mobilisation' && ` · ${entity.customer_name} / ${entity.location}`}
              </div>
            </div>
            <button onClick={onClose} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',width:32,height:32,borderRadius:'50%',cursor:'pointer',fontSize:'18px',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
          </div>
        </div>

        {/* Key details strip */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1px',background:'#e2e8f0',borderBottom:'1px solid #e2e8f0',flexShrink:0}}>
          {[
            ['Passport No', entity.passport_no],
            ['Emirates ID', entity.emirates_id],
            ['Nationality', entity.nationality],
            ['DOB', entity.date_of_birth ? fmtDOB(entity.date_of_birth) : null],
            ['Visa Location', entity.visa_location],
            ['Supplier / EmpNo', entity.supplier_name ? `${entity.supplier_name}${entity.supplier_emp_no?' #'+entity.supplier_emp_no:''}` : null],
          ].map(([l,v])=> v ? (
            <div key={l} style={{padding:'8px 14px',background:'#fff'}}>
              <div style={{fontSize:'10px',fontWeight:700,color:'#94a3b8',textTransform:'uppercase'}}>{l}</div>
              <div style={{fontSize:'12.5px',fontWeight:600,fontFamily:l.includes('No')||l.includes('ID')?'monospace':undefined}}>{v}</div>
            </div>
          ) : null)}
        </div>

        {/* Upload section */}
        <div style={{padding:'14px 20px',borderBottom:'1px solid #e2e8f0',background:'#f8fafc',flexShrink:0}}>
          <div style={{fontWeight:700,fontSize:'12px',color:'#0f172a',marginBottom:'8px'}}>📎 Upload Document</div>
          <div style={{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}}>
            <select value={docType} onChange={e=>setDocType(e.target.value)} style={{...S.input,width:'150px',fontSize:'12px',padding:'6px 8px'}}>
              {DOC_TYPES.map(d=><option key={d.v} value={d.v}>{d.l}</option>)}
            </select>
            <button onClick={()=>fileRef.current?.click()} disabled={uploading}
              style={{...S.btnGold,padding:'6px 14px',fontSize:'12px'}}>
              {uploading ? 'Uploading…' : '⬆ Choose File'}
            </button>
            <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={handleUpload}/>
          </div>
          <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>Accepts PDF, JPG, PNG · After upload, click Scan with AI to extract data</div>
        </div>

        {/* AI scan result */}
        {scanResult && (
          <div style={{padding:'14px 20px',background:'#f0fdf4',borderBottom:'1px solid #bbf7d0',flexShrink:0}}>
            <div style={{fontWeight:700,fontSize:'12px',color:'#166534',marginBottom:'8px'}}>✨ AI Scan Result</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginBottom:'10px'}}>
              {Object.entries(scanResult.data).map(([k,v])=> v ? (
                <div key={k} style={{background:'#fff',borderRadius:6,padding:'6px 10px',border:'1px solid #bbf7d0'}}>
                  <div style={{fontSize:'10px',fontWeight:700,color:'#94a3b8',textTransform:'uppercase'}}>{k.replace(/_/g,' ')}</div>
                  <div style={{fontSize:'12px',fontWeight:600}}>{String(v)}</div>
                </div>
              ) : null)}
            </div>
            <div style={{display:'flex',gap:'8px'}}>
              <button style={{...S.btnGrn,padding:'6px 14px',fontSize:'12px'}} onClick={()=>applyToRecord(scanResult.data)}>
                Apply to Record
              </button>
              <button style={{...S.btnSec,padding:'6px 14px',fontSize:'12px'}} onClick={()=>setScanResult(null)}>Dismiss</button>
            </div>
            {getSuggestedFields(scanResult.data, scanResult.docType).length > 0 && (
              <div style={{fontSize:'11px',color:'#166534',marginTop:'6px'}}>
                Will update: {getSuggestedFields(scanResult.data, scanResult.docType).map(([,l])=>l).join(', ')}
              </div>
            )}
          </div>
        )}

        {err && <div style={{margin:'10px 20px',padding:'8px 12px',background:'#fee2e2',color:'#991b1b',borderRadius:6,fontSize:'12px'}}>{err}<button onClick={()=>setErr('')} style={{marginLeft:'8px',background:'none',border:'none',cursor:'pointer',color:'#991b1b'}}>×</button></div>}

        {/* Documents list */}
        <div style={{flex:1,padding:'14px 20px',overflowY:'auto'}}>
          <div style={{fontWeight:700,fontSize:'12px',color:'#0f172a',marginBottom:'10px'}}>📄 Documents ({docs.length})</div>
          {loading && <div style={{color:'#94a3b8',fontSize:'13px'}}>Loading…</div>}
          {!loading && docs.length===0 && (
            <div style={{textAlign:'center',padding:'30px 20px',color:'#94a3b8',border:'2px dashed #e2e8f0',borderRadius:8}}>
              <div style={{fontSize:'28px',marginBottom:'8px'}}>📁</div>
              <div style={{fontSize:'13px'}}>No documents uploaded yet</div>
              <div style={{fontSize:'11px',marginTop:'4px'}}>Upload passport, EID, visa, medical or CICPA above</div>
            </div>
          )}
          {docs.map(doc => (
            <div key={doc.id} style={{border:'1px solid #e2e8f0',borderRadius:8,padding:'10px 12px',marginBottom:'8px',background:'#fff'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',gap:'6px',alignItems:'center',marginBottom:'3px'}}>
                    <span style={{background:typeColor[doc.doc_type]||'#475569',color:'#fff',fontSize:'10px',fontWeight:700,padding:'2px 7px',borderRadius:10,flexShrink:0}}>
                      {DOC_TYPES.find(d=>d.v===doc.doc_type)?.l||doc.doc_type}
                    </span>
                    {doc.ai_scanned && <span style={{fontSize:'10px',color:'#166534',fontWeight:700}}>✨ AI scanned</span>}
                  </div>
                  <div style={{fontSize:'12.5px',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.doc_label||doc.file_name}</div>
                  <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>
                    {doc.file_size ? Math.round(doc.file_size/1024)+'KB' : ''} · {fmtDate(doc.uploaded_at)}
                  </div>
                </div>
                <div style={{display:'flex',gap:'4px',flexShrink:0,marginLeft:'8px'}}>
                  <button style={{...S.btnSm,padding:'4px 8px'}} onClick={()=>viewDoc(doc)} title="Open">👁</button>
                  <button style={{...S.btnSm,padding:'4px 8px',background:scanning===doc.id?'#f0fdf4':'#fff'}} onClick={()=>scanDoc(doc)} disabled={scanning===doc.id} title="Scan with AI">
                    {scanning===doc.id ? '⏳' : '✨'}
                  </button>
                  <button style={{...S.btnSm,padding:'4px 8px',color:'#dc2626'}} onClick={()=>deleteDoc(doc)} title="Delete">🗑</button>
                </div>
              </div>
              {doc.ai_data && (
                <div style={{marginTop:'6px',padding:'6px 8px',background:'#f8fafc',borderRadius:5,fontSize:'11px',color:'#475569'}}>
                  {Object.entries(doc.ai_data).filter(([,v])=>v).slice(0,3).map(([k,v])=>`${k.replace(/_/g,' ')}: ${v}`).join(' · ')}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Demobilise Modal ──────────────────────────────────────────────────────────
function DemobModal({record, onSave, onClose}) {
  const [form, setForm] = useState({
    demobilisation_date: todayStr(),
    demob_reason: '',
    demob_remarks: '',
    wp_action_on_demob: '',
    cicpa_returned: false,

  });
  const save = async () => {
    if (!form.demob_reason) return alert('Please select a demob reason');
    if (!form.demobilisation_date) return alert('Demobilisation date is required');
    onSave(record.id, form);
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}} onClick={onClose}>

          <Field label="Reason *">
            <select value={form.demob_reason} onChange={e=>setForm(f=>({...f,demob_reason:e.target.value}))} style={S.input}>
              <option value="">Select reason…</option>
              {DEMOB_REASONS.map(r=><option key={r} value={r}>{r}</option>)}

          </Field>
          <Field label="Work Permit Action" span={2}>

          <input value={form.demob_remarks} onChange={e=>setForm(f=>({...f,demob_remarks:e.target.value}))} placeholder="Any additional notes on demobilisation" style={{...S.input,marginBottom:'12px'}}/>

        <label style={{display:'flex',gap:'8px',alignItems:'center',cursor:'pointer',marginBottom:'16px',fontSize:'13px',fontWeight:600}}>

  );

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({data, loaUsed, setTab, setFilterStatus}) {
  const {candidates, loaList, mobList} = data;
  const active     = mobList.filter(m=>m.status==='mobilised').length;
  const pending    = mobList.filter(m=>m.status==='pending').length;
  const demobbed   = mobList.filter(m=>m.status==='demobilised').length;
  const noWP       = mobList.filter(m=>!m.wp_approved_date&&!['rejected','demobilised'].includes(m.status)).length;
  const noCICPA    = mobList.filter(m=>!m.cicpa_pass_no&&!['rejected','demobilised'].includes(m.status)).length;
  const medPending = mobList.filter(m=>!m.medical_done&&!['rejected','demobilised'].includes(m.status)).length;
  const expCICPA   = mobList.filter(m=>m.cicpa_expiry_date&&daysUntil(m.cicpa_expiry_date)<=30&&daysUntil(m.cicpa_expiry_date)>=0&&m.status==='mobilised');
  const expVisa    = candidates.filter(c=>c.visa_expiry&&isExpired(c.visa_expiry)&&c.active);

  // Available candidates (no active mobilisation)
  const activeCandIds = new Set(mobList.filter(m=>m.status==='mobilised').map(m=>m.candidate_id).filter(Boolean));
  const availCands = candidates.filter(c=>!activeCandIds.has(c.id)&&c.active);

  const Stat=({label,value,color,sub,onClick})=>(
    <div onClick={onClick} style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:'10px',padding:'18px 20px',cursor:onClick?'pointer':'default',transition:'border-color 0.15s'}}
      onMouseEnter={e=>onClick&&(e.currentTarget.style.borderColor='#b8972a')}
      onMouseLeave={e=>e.currentTarget.style.borderColor='#e2e8f0'}>
      <div style={{fontSize:'11px',fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>{label}</div>
      <div style={{fontSize:'32px',fontWeight:800,color,lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>{sub}</div>}
    </div>
  );

  return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(155px,1fr))',gap:'12px',marginBottom:'20px'}}>
        <Stat label="Candidates Pool"    value={candidates.length}  color="#2563eb"  onClick={()=>setTab('candidates')} />
        <Stat label="Available"          value={availCands.length}  color="#0369a1"  sub="not currently mobilised" onClick={()=>setTab('candidates')} />
        <Stat label="Active On Site"     value={active}             color="#166534"  onClick={()=>{setFilterStatus('mobilised');setTab('mobilisation');}} />
        <Stat label="Pending"            value={pending}            color="#b45309"  onClick={()=>{setFilterStatus('pending');setTab('mobilisation');}} />
        <Stat label="Demobilised"        value={demobbed}           color="#475569"  onClick={()=>{setFilterStatus('demobilised');setTab('mobilisation');}} />
        <Stat label="No Work Permit"     value={noWP}               color="#dc2626"  sub="approved" />
        <Stat label="No CICPA Pass"      value={noCICPA}            color="#7c3aed" />
        <Stat label="CICPA Expiring"     value={expCICPA.length}    color="#b45309"  sub="within 30 days" />
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
        {/* LOA Status */}
        <div style={S.card}>
          <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f8fafc'}}>
            <div style={{fontWeight:800,fontSize:'13px'}}>📄 LOA Status</div>
            <button style={S.btnSm} onClick={()=>setTab('loa')}>Manage →</button>
          </div>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>{['Customer','Location','Remaining','Used','Total'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {loaList.length===0&&<tr><td colSpan={5} style={{padding:'16px',textAlign:'center',color:'#94a3b8',fontSize:'13px'}}>No LOA registered</td></tr>}
              {loaList.map(l=>{
                const used=loaUsed[l.id]||0, rem=l.total_count-used, low=rem<(l.alert_threshold||10);
                return <tr key={l.id} style={{background:low?'#fffbeb':'#fff'}}>
                  <td style={{...S.td,fontWeight:700}}>{l.customer_name}</td>
                  <td style={S.td}>{l.location}</td>
                  <td style={{...S.td,fontWeight:800,color:rem<=5?'#dc2626':low?'#b45309':'#166534'}}>{rem}</td>
                  <td style={{...S.td,color:'#0369a1'}}>{used}</td>
                  <td style={{...S.td,color:'#64748b'}}>{l.total_count}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>

        {/* CICPA Expiry */}
        <div style={S.card}>
          <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',background:'#f8fafc'}}>
            <div style={{fontWeight:800,fontSize:'13px'}}>⏰ CICPA Expiring (30 days)</div>
          </div>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>{['Name','Customer / Location','Pass No','Days Left'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {expCICPA.length===0&&<tr><td colSpan={4} style={{padding:'16px',textAlign:'center',color:'#94a3b8',fontSize:'13px'}}>No expiries in next 30 days</td></tr>}
              {expCICPA.map(r=>{
                const d=daysUntil(r.cicpa_expiry_date);
                return <tr key={r.id} style={{background:d<=7?'#fee2e2':'#fffbeb'}}>
                  <td style={{...S.td,fontWeight:600}}>{r.full_name}</td>
                  <td style={S.td}>{r.customer_name} / {r.location}</td>
                  <td style={{...S.td,fontFamily:'monospace',fontSize:'11px'}}>{r.cicpa_pass_no}</td>
                  <td style={{...S.td,fontWeight:800,color:d<=7?'#dc2626':'#b45309'}}>{d}d</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>

        {/* Expired Visas */}
        {expVisa.length>0&&(
          <div style={S.card}>
            <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',background:'#fef2f2'}}>
              <div style={{fontWeight:800,fontSize:'13px',color:'#991b1b'}}>🚨 Expired Visas in Candidates Pool</div>
            </div>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr>{['Name','Designation','Supplier','Visa Location','Expired'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
              <tbody>
                {expVisa.slice(0,10).map(c=><tr key={c.id}>
                  <td style={{...S.td,fontWeight:600}}>{c.full_name}</td>
                  <td style={S.td}>{c.designation||'—'}</td>
                  <td style={S.td}>{c.supplier_name||'SATCO Own'}</td>
                  <td style={S.td}>{c.visa_location||'—'}</td>
                  <td style={{...S.td,color:'#dc2626',fontWeight:700}}>{fmtDate(c.visa_expiry)}</td>
                </tr>)}
              </tbody>
            </table>
          </div>
        )}

        {/* Recent mob */}
        <div style={S.card}>
          <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',justifyContent:'space-between',background:'#f8fafc'}}>
            <div style={{fontWeight:800,fontSize:'13px'}}>🏗️ Recent Activity</div>
            <button style={S.btnSm} onClick={()=>setTab('mobilisation')}>View All →</button>
          </div>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>{['Name','Designation','Customer / Location','Status'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {mobList.slice(0,8).map(r=><tr key={r.id} className="hr-row">
                <td style={{...S.td,fontWeight:600}}>{r.full_name}</td>
                <td style={S.td}>{r.designation||'—'}</td>
                <td style={S.td}>{r.customer_name} / {r.location}</td>
                <td style={S.td}><StatusBadge status={r.status}/></td>
              </tr>)}
              {mobList.length===0&&<tr><td colSpan={4} style={{padding:'16px',textAlign:'center',color:'#94a3b8'}}>No records yet</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}
// ── Candidates Tab ────────────────────────────────────────────────────────────
function CandidatesTab({candidates, mobList, onSave, onMobilise, tabSearch}) {
  const [draft,setDraft]   = useState(null);
  const [search,setSearch] = useState(tabSearch||'');
  const [suppF,setSuppF]   = useState('');
  const [histPerson, setHistPerson] = useState(null);
  const [docPanel,  setDocPanel]   = useState(null); // {entity, entityType}
  const clickTimer  = useRef(null);

  useEffect(()=>{ if(tabSearch) setSearch(tabSearch); },[tabSearch]);

  const activeCandIds = useMemo(()=>new Set(mobList.filter(m=>m.status==='mobilised').map(m=>m.candidate_id).filter(Boolean)),[mobList]);
  const supplierList  = useMemo(()=>[...new Set(candidates.map(c=>c.supplier_name).filter(Boolean))].sort(),[candidates]);

  const filtered = useMemo(()=> candidates.filter(c=>{
    if (suppF && c.supplier_name !== suppF) return false;
    return matchSearch(c, search);
  }), [candidates, search, suppF]);

  const blank = () => { setDraft({full_name:'',designation:'',source:'supplier',supplier_name:'',supplier_emp_no:'',nationality:'',date_of_birth:'',passport_no:'',passport_expiry:'',emirates_id:'',eid_expiry:'',visa_no:'',visa_type:'',visa_location:'',visa_expiry:'',phone:'',remarks:'',active:true}); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); };

  const personHistory = (cand) => {
    const hist = mobList.filter(m => m.candidate_id === cand.id || m.full_name === cand.full_name);
    setHistPerson({candidate:cand, history:hist});
  };

  // Single click = highlight + open doc panel; double click = open edit form
  const handleRowClick = (cand, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    clickTimer.current = setTimeout(() => {
      setDocPanel({entity: cand, entityType: 'candidate'});
    }, 220);
  };
  const handleRowDblClick = (cand, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    setDraft({...cand});
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0);
  };

  // Apply AI-scanned data back to a candidate record
  const applyAiData = async (aiData, docType) => {
    if (!docPanel) return;
    const fieldMap = {
      full_name: 'full_name', passport_no: 'passport_no', nationality: 'nationality',
      date_of_birth: 'date_of_birth', expiry_date: docType==='passport'?'passport_expiry':docType==='eid'?'eid_expiry':docType==='visa'?'visa_expiry':null,
      emirates_id: 'emirates_id', visa_no: 'visa_no', visa_type: 'visa_type',
    };
    const updates = {};
    Object.entries(aiData).forEach(([k,v]) => { if (fieldMap[k] && v) updates[fieldMap[k]] = v; });
    if (!Object.keys(updates).length) return;
    const { error } = await db.from('mob_candidates').update({...updates, updated_at: new Date().toISOString()}).eq('id', docPanel.entity.id);
    if (error) { alert(error.message); return; }
    await onSave('candidates', {...docPanel.entity, ...updates}, ()=>{});
    setDocPanel(d => d ? {...d, entity:{...d.entity,...updates}} : d);
    alert('Record updated from AI scan ✓');
  };

  const exportCols = [
    {key:'full_name',label:'Name'},{key:'designation',label:'Designation'},{key:'source',label:'Source'},
    {key:'supplier_name',label:'Supplier'},{key:'supplier_emp_no',label:'Supplier Emp No'},
    {key:'nationality',label:'Nationality'},{key:'date_of_birth',label:'DOB',date:true},
    {key:'passport_no',label:'Passport No'},{key:'passport_expiry',label:'Passport Expiry',date:true},
    {key:'emirates_id',label:'Emirates ID'},{key:'eid_expiry',label:'EID Expiry',date:true},
    {key:'visa_no',label:'Visa No'},{key:'visa_type',label:'Visa Type'},
    {key:'visa_location',label:'Visa Location'},{key:'visa_expiry',label:'Visa Expiry',date:true},
    {key:'phone',label:'Phone'},{key:'remarks',label:'Remarks'},
  ];

  return (
    <div>
      {histPerson && (
        <PersonHistoryModal
          candidate={histPerson.candidate}
          mobHistory={histPerson.history}
          onClose={()=>setHistPerson(null)}
          onNewMob={()=>{ setHistPerson(null); onMobilise(histPerson.candidate); }}
        />
      )}
      {docPanel && (
        <DocumentPanel
          entity={docPanel.entity}
          entityType={docPanel.entityType}
          onClose={()=>setDocPanel(null)}
          onApplyAiData={applyAiData}
        />
      )}

      <div ref={measureToStk2} className="sticky-toolbar" style={{padding:'8px 14px',display:'flex',gap:'8px',justifyContent:'space-between',flexWrap:'wrap',alignItems:'center'}}>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}}>
          <input placeholder="Search name, EID, passport, designation, supplier…" value={search} onChange={e=>setSearch(e.target.value)} style={{...S.input,width:'320px'}}/>
          <select value={suppF} onChange={e=>setSuppF(e.target.value)} style={{...S.input,width:'180px'}}>
            <option value="">All suppliers</option>
            {supplierList.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <span style={{fontSize:'12px',color:'#64748b'}}>{filtered.length} people</span>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button style={S.btnGold} onClick={()=>exportCSV(filtered,'SATCO_Candidates',exportCols)}>⬇ Export</button>
          <button style={S.btnPri} onClick={blank}>+ Add Person</button>
        </div>

            <Field label="Designation"><input value={draft.designation||''} onChange={e=>setDraft(d=>({...d,designation:e.target.value}))} placeholder="Pipe Fitter / Fabricator / Engineer…" style={S.input}/></Field>

              <Field label="Supplier Emp No"><input value={draft.supplier_emp_no||''} onChange={e=>setDraft(d=>({...d,supplier_emp_no:e.target.value}))} placeholder="e.g. 734" style={S.input}/></Field>

// ── Mobilisation Tab ──────────────────────────────────────────────────────────
function MobilisationTab({mobList, candidates, loaList, usedMap, locConfigs, onSave, onDemob, initialStatus, tabSearch}) {
  const [draft,setDraft]     = useState(null);
  const [demobRec,setDemobRec] = useState(null);
  const [docPanel, setDocPanel] = useState(null);
  const clickTimer = useRef(null);
  const [search,setSearch]   = useState(tabSearch||'');
  const [fCust,setFCust]     = useState('');
  const [fLoc,setFLoc]       = useState('');
  const [fStatus,setFStatus] = useState(initialStatus||'');

  useEffect(()=>{ if(initialStatus) setFStatus(initialStatus); },[initialStatus]);
  useEffect(()=>{ if(tabSearch) setSearch(tabSearch); },[tabSearch]);

  const customers = useMemo(()=>[...new Set(mobList.map(m=>m.customer_name).filter(Boolean))].sort(),[mobList]);
  const locations = useMemo(()=>[...new Set(mobList.map(m=>m.location).filter(Boolean))].sort(),[mobList]);

  const filtered = useMemo(()=> mobList.filter(m=>{
    if (fCust && m.customer_name!==fCust) return false;
    if (fLoc  && m.location!==fLoc)      return false;
    if (fStatus && m.status!==fStatus)   return false;
    return matchSearch(m, search);
  }), [mobList, search, fCust, fLoc, fStatus]);

  const fillFromCandidate = candId => {
    const c = candidates.find(x=>x.id===candId);
    if (!c) return;
    setDraft(d=>({...d, candidate_id:c.id, full_name:c.full_name, designation:c.designation||d.designation,
      source:c.source||'supplier', supplier_name:c.supplier_name, supplier_emp_no:c.supplier_emp_no,
      nationality:c.nationality, date_of_birth:c.date_of_birth, passport_no:c.passport_no,
      emirates_id:c.emirates_id, visa_no:c.visa_no, visa_location:c.visa_location}));
  };

  const applyLocTrainings = loc => {
    const cfg = locConfigs.find(l=>l.location===loc);
    if (!cfg||!cfg.trainings?.length) return;
    setDraft(d=>({...d, extra_trainings:cfg.trainings.map(t=>({name:t.name,mandatory:t.mandatory,done:false,date:null}))}));
  };

  const availLoas = draft ? loaList.filter(l=>(!draft.customer_name||l.customer_name===draft.customer_name)&&(!draft.location||l.location===draft.location)) : [];

  const blank = () => { setDraft({full_name:'',designation:'',source:'supplier',supplier_name:'',supplier_emp_no:'',nationality:'',date_of_birth:'',passport_no:'',emirates_id:'',visa_no:'',visa_location:'',customer_name:'',location:'',loa_id:'',medical_done:false,medical_result:'',hse_passport_done:false,h2s_done:false,extra_trainings:[],status:'pending',notes:''}); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); };

  const handleRowClick = (r, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    clickTimer.current = setTimeout(() => {
      setDocPanel({entity: r, entityType: 'mobilisation'});
    }, 220);
  };
  const handleRowDblClick = (r, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    setDraft({...r});
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0);
  };

  const applyAiData = async (aiData, docType) => {
    if (!docPanel) return;
    const fieldMap = {
      full_name:'full_name', passport_no:'passport_no', nationality:'nationality',
      date_of_birth:'date_of_birth', emirates_id:'emirates_id',
      visa_no:'visa_no', visa_type:'visa_type',
      wp_no:'wp_no',
      pass_no:'cicpa_pass_no',
      expiry_date: docType==='work_permit'?null:docType==='cicpa'?'cicpa_expiry_date':null,
      exam_date: docType==='medical'?'medical_date':null,
      result: docType==='medical'?'medical_result':null,
    };
    const updates = {};
    Object.entries(aiData).forEach(([k,v])=>{ if(fieldMap[k]&&v) updates[fieldMap[k]]=v; });
    if(docType==='medical'&&aiData.result) updates.medical_done=true;
    if(docType==='work_permit'&&aiData.wp_no) updates.wp_approved_date=aiData.issue_date||undefined;
    if(docType==='cicpa'&&aiData.pass_no){ updates.cicpa_pass_no=aiData.pass_no; updates.cicpa_approved_date=aiData.issue_date||undefined; }
    if(!Object.keys(updates).length)return;
    const{error}=await db.from('mob_register').update({...updates,updated_at:new Date().toISOString()}).eq('id',docPanel.entity.id);
    if(error){alert(error.message);return;}
    setDocPanel(d=>d?{...d,entity:{...d.entity,...updates}}:d);
    alert('Mobilisation record updated from AI scan ✓');
  };

  // Read prefill from candidates tab
  useEffect(()=>{
    const pf = sessionStorage.getItem('satco_mob_prefill');
    if (pf) { try { setDraft(JSON.parse(pf)); } catch(e){} sessionStorage.removeItem('satco_mob_prefill'); }
  },[]);

  const exportCols = [
    {key:'full_name',label:'Name'},{key:'designation',label:'Designation'},{key:'source',label:'Source'},
    {key:'supplier_name',label:'Supplier'},{key:'supplier_emp_no',label:'Supplier Emp No'},
    {key:'nationality',label:'Nationality'},{key:'date_of_birth',label:'DOB',date:true},
    {key:'passport_no',label:'Passport No'},{key:'emirates_id',label:'Emirates ID'},{key:'visa_location',label:'Visa Location'},
    {key:'customer_name',label:'Customer'},{key:'location',label:'Location'},
    {key:'wp_no',label:'WP No'},{key:'wp_approved_date',label:'WP Approved',date:true},
    {key:'medical_done',label:'Medical Done',bool:true},{key:'medical_date',label:'Medical Date',date:true},{key:'medical_result',label:'Medical Result'},
    {key:'hse_passport_done',label:'HSE Passport',bool:true},{key:'hse_passport_date',label:'HSE Date',date:true},
    {key:'h2s_done',label:'H2S Done',bool:true},{key:'h2s_date',label:'H2S Date',date:true},
    {key:'cicpa_pass_no',label:'CICPA Pass No'},{key:'cicpa_approved_date',label:'CICPA Approved',date:true},{key:'cicpa_expiry_date',label:'CICPA Expiry',date:true},
    {key:'status',label:'Status'},{key:'mobilisation_date',label:'Mob Date',date:true},
    {key:'demobilisation_date',label:'Demob Date',date:true},{key:'demob_reason',label:'Demob Reason'},{key:'demob_remarks',label:'Demob Remarks'},
    {key:'wp_action_on_demob',label:'WP Action on Demob'},{key:'notes',label:'Notes'},
  ];

  return (
    <div>
      {demobRec && <DemobModal record={demobRec} onClose={()=>setDemobRec(null)} onSave={(id,form)=>{onDemob(id,form);setDemobRec(null);}}/>}
      {docPanel && (
        <DocumentPanel
          entity={docPanel.entity}
          entityType={docPanel.entityType}
          onClose={()=>setDocPanel(null)}
          onApplyAiData={applyAiData}
        />
      )}

      <div ref={measureToStk2} className="sticky-toolbar" style={{padding:'8px 14px',display:'flex',gap:'8px',justifyContent:'space-between',flexWrap:'wrap',alignItems:'center'}}>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}}>
          <input placeholder="Search name, EID, passport, CICPA…" value={search} onChange={e=>setSearch(e.target.value)} style={{...S.input,width:'260px'}}/>
          <select value={fCust} onChange={e=>setFCust(e.target.value)} style={{...S.input,width:'140px'}}>
            <option value="">All customers</option>
            {customers.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select value={fLoc} onChange={e=>setFLoc(e.target.value)} style={{...S.input,width:'130px'}}>
            <option value="">All locations</option>
            {locations.map(l=><option key={l} value={l}>{l}</option>)}
          </select>
          <select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{...S.input,width:'120px'}}>
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="mobilised">Mobilised</option>
            <option value="demobilised">Demobilised</option>
            <option value="rejected">Rejected</option>
          </select>
          <span style={{fontSize:'12px',color:'#64748b',whiteSpace:'nowrap'}}>{filtered.length} records</span>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button style={S.btnGold} onClick={()=>exportCSV(filtered,`SATCO_Mob_${fCust||'All'}_${fLoc||'AllLoc'}`,exportCols)}>⬇ Export Excel</button>
          <button style={S.btnPri} onClick={blank}>+ Add Person</button>
        </div>
      </div>

      {draft&&(
        <div style={{...S.card,padding:'16px',marginBottom:'14px',background:'#f0fdf4',border:'1px solid #bbf7d0'}}>

          <Grid cols={4}>

              <select value={draft.status||'pending'} onChange={e=>setDraft(d=>({...d,status:e.target.value}))} style={S.input}>

      <div style={{...S.card,overflow:'hidden'}}>

                  {r.supplier_emp_no&&<div style={{fontSize:'11px',color:'#64748b',fontFamily:'monospace'}}>#{r.supplier_emp_no}</div>}

// ── Letters Tab ───────────────────────────────────────────────────────────────
function LettersTab({mobList}) {
  const [letterType,setLetterType] = useState('client');
  const [fCust,setFCust]   = useState('');
  const [fLoc,setFLoc]     = useState('');
  const [search,setSearch] = useState('');
  const [selected,setSelected] = useState(new Set());
  const [subject,setSubject]   = useState('');
  const [arrival,setArrival]   = useState('');
  const [date,setDate]         = useState(todayStr());

  const customers=[...new Set(mobList.map(m=>m.customer_name).filter(Boolean))].sort();
  const locations=[...new Set(mobList.map(m=>m.location).filter(Boolean))].sort();

  const pool = useMemo(()=>{
    const base = letterType==='client'
      ? mobList.filter(m=>m.wp_approved_date&&m.status!=='rejected'&&m.status!=='demobilised')
      : mobList.filter(m=>['mobilised','pending'].includes(m.status));
    return base.filter(m=>{
      if(fCust&&m.customer_name!==fCust)return false;
      if(fLoc&&m.location!==fLoc)return false;
      return matchSearch(m,search);
    });
  },[mobList,letterType,fCust,fLoc,search]);

  const toggle=id=>{const s=new Set(selected);s.has(id)?s.delete(id):s.add(id);setSelected(s);};
  const toggleAll=()=>selected.size===pool.length?setSelected(new Set()):setSelected(new Set(pool.map(r=>r.id)));
  const selRows=pool.filter(r=>selected.has(r.id));

  const generateLetter=()=>{
    if(!selRows.length)return alert('Select at least one person');
    const dateStr=new Date(date).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
    const clientRows=selRows.map((r,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${COMPANY_SHORT}</td><td style="text-align:center">${r.supplier_emp_no||'—'}</td><td>${r.full_name}</td><td>${r.designation||'—'}</td><td style="text-align:center">${r.date_of_birth?fmtDOB(r.date_of_birth):'—'}</td><td>${r.nationality||'—'}</td><td style="text-align:center;font-family:monospace">${r.emirates_id||'—'}</td></tr>`).join('');
    const campRows=selRows.map((r,i)=>`<tr><td style="text-align:center">${i+1}</td><td style="text-align:center;font-family:monospace">${r.supplier_emp_no||'—'}</td><td>${r.full_name}</td><td>${r.designation||'—'}</td><td>${r.nationality||'—'}</td><td>${COMPANY_SHORT}</td><td>${r.notes||''}</td></tr>`).join('');

    const clientTable=`<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:13px;"><thead style="background:#f0f0f0"><tr><th>S.L.</th><th>Company Name</th><th>Employee Number</th><th>Employee Name</th><th>Designation</th><th>DOB</th><th>Nationality</th><th>Emirates ID Number</th></tr></thead><tbody>${clientRows}</tbody></table>`;
    const campTable=`<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:13px;"><thead style="background:#f0f0f0"><tr><th>S.L.</th><th>Emp. No.</th><th>Name</th><th>Designation</th><th>Nationality</th><th>Company</th><th>Remarks</th></tr></thead><tbody>${campRows}</tbody></table>`;

    const body=letterType==='client'
      ?`<p>Dear Sir,</p><br/><p>Please find the attached complete documents along with CICPA copies of the below-listed personnel.</p><br/>${clientTable}<br/><p>They are ready to mobilize, kindly review &amp; confirm us accordingly.</p>`
      :`<p>Dear Team,</p><br/><p>Please be informed that the below-listed personnel will be arriving at your accommodation ${arrival||'tomorrow'}. Kindly make the necessary arrangements to facilitate their stay.</p><br/>${campTable}<br/><p>Kindly acknowledge receipt of this notification.</p>`;

    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><style>body{font-family:'Times New Roman',serif;margin:60px;color:#00008B;font-size:14px;line-height:1.7;}table{color:#000;}th,td{padding:8px 10px;}@media print{body{margin:30px;}}</style></head><body>
      <p style="text-align:right">${dateStr}</p><br/>
      <p><strong>To:</strong> ${subject||'The Concerned Authority'}</p>
      <p><strong>Ref:</strong> ${fCust||''} ${fLoc?'— '+fLoc:''}</p><br/>
      ${body}
      <div style="margin-top:60px"><p>Yours faithfully,</p><br/><br/><p><strong>Shaik Zaheerudeen, PMP</strong></p><p>CEO &amp; Founder</p><p>${COMPANY_NAME}</p></div>
    </body></html>`;

    const win=window.open('','_blank');
    win.document.write(html); win.document.close();
    setTimeout(()=>win.print(),500);
  };

  return (
    <div>
      <div style={{...S.card,padding:'16px',marginBottom:'16px'}}>
        <div style={{fontWeight:800,fontSize:'14px',color:'#0f172a',marginBottom:'14px'}}>✉️ Generate Letter</div>
        <div style={{display:'flex',gap:'12px',marginBottom:'14px',flexWrap:'wrap'}}>
          {[['client','📋 Client Submission Letter','CICPA/mobilisation — Company: SATCO Arabia, includes DOB & EID'],['camp','🏕️ Camp Arrival Notification','Accommodation team — arrival notification']].map(([k,lbl,sub])=>(
            <div key={k} onClick={()=>{setLetterType(k);setSelected(new Set());}} style={{padding:'12px 18px',borderRadius:'8px',border:`2px solid ${letterType===k?'#0f172a':'#e2e8f0'}`,background:letterType===k?'#0f172a':'#fff',cursor:'pointer',minWidth:'260px'}}>
              <div style={{fontWeight:700,fontSize:'13px',color:letterType===k?'#fff':'#475569'}}>{lbl}</div>
              <div style={{fontSize:'11px',color:letterType===k?'#94a3b8':'#94a3b8',marginTop:'3px'}}>{sub}</div>
            </div>
          ))}
        </div>
        <Grid cols={4}>
          <Field label="Letter Date"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={S.input}/></Field>
          <Field label="To (addressee / department)"><input value={subject} onChange={e=>setSubject(e.target.value)} placeholder="e.g. ADNOC HSE Department" style={S.input}/></Field>
          {letterType==='camp'&&<Field label="Arrival Wording"><input value={arrival} onChange={e=>setArrival(e.target.value)} placeholder="tomorrow / on 25 Aug 2025" style={S.input}/></Field>}
          <Field label="Filter Customer"><select value={fCust} onChange={e=>setFCust(e.target.value)} style={S.input}><option value="">All</option>{customers.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
          <Field label="Filter Location"><select value={fLoc} onChange={e=>setFLoc(e.target.value)} style={S.input}><option value="">All</option>{locations.map(l=><option key={l} value={l}>{l}</option>)}</select></Field>
        </Grid>
        <div style={{marginBottom:'8px'}}>
          <input placeholder="Search within list…" value={search} onChange={e=>setSearch(e.target.value)} style={{...S.input,width:'260px',marginBottom:'10px'}}/>
        </div>
        <div style={{...S.card,marginBottom:'12px'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{background:'#f8fafc'}}>
              <th style={{...S.th,width:36}}><input type="checkbox" checked={selected.size===pool.length&&pool.length>0} onChange={toggleAll}/></th>
              {['Name','Designation','Supplier Emp No','Customer / Location','WP','CICPA','EID'].map(h=><th key={h} style={S.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {pool.length===0&&<tr><td colSpan={8} style={{padding:'16px',textAlign:'center',color:'#94a3b8',fontSize:'13px'}}>No personnel match the filters.</td></tr>}
              {pool.map(r=><tr key={r.id} className="hr-row" onClick={()=>toggle(r.id)} style={{cursor:'pointer',background:selected.has(r.id)?'#eff6ff':'#fff'}}>
                <td style={{...S.td,textAlign:'center'}}><input type="checkbox" checked={selected.has(r.id)} onChange={()=>toggle(r.id)} onClick={e=>e.stopPropagation()}/></td>
                <td style={{...S.td,fontWeight:700}}>{r.full_name}</td>
                <td style={S.td}>{r.designation||'—'}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'11px'}}>{r.supplier_emp_no||'—'}</td>
                <td style={S.td}>{r.customer_name} / {r.location}</td>
                <td style={S.td}>{r.wp_approved_date?<span style={{color:'#166534',fontWeight:700,fontSize:'11px'}}>✓</span>:'—'}</td>
                <td style={S.td}>{r.cicpa_pass_no?<span style={{color:'#166534',fontSize:'11px',fontWeight:700}}>✓ {r.cicpa_pass_no}</span>:'—'}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'11px'}}>{r.emirates_id||'—'}</td>
              </tr>)}
            </tbody>
          </table>
        </div>
        <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
          <button style={S.btnPri} onClick={generateLetter}>🖨️ Generate & Print ({selRows.length} selected)</button>
          <span style={{fontSize:'12px',color:'#64748b'}}>Opens print dialog → Save as PDF. Company shown: <strong>SATCO Arabia</strong></span>
        </div>
      </div>
    </div>
  );
}

// ── Config Tab ────────────────────────────────────────────────────────────────

  const [suppDraft,setSuppDraft]=useState(null);
  return (
    <div>
      <div style={S.card}>

          <div style={{fontWeight:800,fontSize:'13px'}}>🏭 Labour Suppliers / Subcontractors</div>

        {suppDraft&&(
          <div style={{padding:'14px',background:'#fffbeb',borderBottom:'1px solid #e2e8f0'}}>
            <Grid cols={3}>
              <Field label="Supplier Name *"><input value={suppDraft.name||''} onChange={e=>setSuppDraft(d=>({...d,name:e.target.value}))} style={S.input}/></Field>
              <Field label="Contact Person"><input value={suppDraft.contact_name||''} onChange={e=>setSuppDraft(d=>({...d,contact_name:e.target.value}))} style={S.input}/></Field>
              <Field label="Phone"><input value={suppDraft.contact_phone||''} onChange={e=>setSuppDraft(d=>({...d,contact_phone:e.target.value}))} style={S.input}/></Field>
              <Field label="Email"><input value={suppDraft.contact_email||''} onChange={e=>setSuppDraft(d=>({...d,contact_email:e.target.value}))} style={S.input}/></Field>
              <Field label="Remarks"><input value={suppDraft.remarks||''} onChange={e=>setSuppDraft(d=>({...d,remarks:e.target.value}))} style={S.input}/></Field>

            <div style={{display:'flex',gap:'8px',marginTop:'8px'}}>

              <button style={S.btnSec} onClick={()=>setSuppDraft(null)}>Cancel</button>
            </div>
          </div>
        )}
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>{['Name','Contact','Phone','Email','Remarks',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {suppliers.length===0&&<tr><td colSpan={6} style={{padding:'16px',textAlign:'center',color:'#94a3b8'}}>No suppliers yet.</td></tr>}
            {suppliers.map(s=><tr key={s.id} className="hr-row">
              <td style={{...S.td,fontWeight:700}}>{s.name}</td>
              <td style={S.td}>{s.contact_name||'—'}</td>
              <td style={S.td}>{s.contact_phone||'—'}</td>
              <td style={S.td}>{s.contact_email||'—'}</td>
              <td style={S.td}>{s.remarks||'—'}</td>
              <td style={S.td}><button style={S.btnSm} onClick={()=>setSuppDraft({...s})}>Edit</button></td>
            </tr>)}
          </tbody>
        </table>
      </div>
      <div style={S.card}>
        <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f8fafc'}}>
          <div>
            <div style={{fontWeight:800,fontSize:'13px'}}>📍 Location Training Requirements</div>
            <div style={{fontSize:'12px',color:'#64748b',marginTop:'2px'}}>Required certs per deployment site — auto-populates when adding a mobilisation record for that location</div>
          </div>
          <button style={S.btnPri} onClick={()=>setLocDraft({location:'',_lines:''})}>+ Add Location</button>
        </div>
        {locDraft&&(
          <div style={{padding:'14px',background:'#eff6ff',borderBottom:'1px solid #e2e8f0'}}>
            <Grid cols={2}>
              <Field label="Location Name *"><input value={locDraft.location||''} onChange={e=>setLocDraft(d=>({...d,location:e.target.value}))} placeholder="Ruwais / Das Island / KEZAD…" style={S.input}/></Field>
            </Grid>
            <Field label="Required Trainings — one per line">
              <textarea value={locDraft._lines||''} onChange={e=>setLocDraft(d=>({...d,_lines:e.target.value}))} placeholder={"BOSIET\nCHUSET\nH2S Awareness\nFire Warden\nBasic First Aid"} style={{...S.input,height:'110px',resize:'vertical',fontFamily:'monospace',marginTop:'2px'}}/>
            </Field>
            <div style={{display:'flex',gap:'8px',marginTop:'10px'}}>
              <button style={S.btnPri} onClick={()=>{if(!locDraft.location)return alert('Location required');const trainings=(locDraft._lines||'').split('\n').map(l=>l.trim()).filter(Boolean).map(name=>({name,mandatory:true}));onSave('locconfig',{...locDraft,trainings},()=>setLocDraft(null));}}>Save</button>
              <button style={S.btnSec} onClick={()=>setLocDraft(null)}>Cancel</button>

          </div>
        )}
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>{['Location','Required Trainings','Updated',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {locConfigs.length===0&&<tr><td colSpan={4} style={{padding:'16px',textAlign:'center',color:'#94a3b8'}}>No location configs yet.</td></tr>}
            {locConfigs.map(l=><tr key={l.id} className="hr-row">
              <td style={{...S.td,fontWeight:700}}>{l.location}</td>
              <td style={S.td}>{(l.trainings||[]).map((t,i)=><span key={i} style={{display:'inline-block',background:'#eff6ff',color:'#1e40af',fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:10,marginRight:'4px',marginBottom:'3px'}}>{t.name}</span>)}</td>
              <td style={{...S.td,fontSize:'11px',color:'#94a3b8'}}>{fmtDate(l.updated_at)}</td>
              <td style={S.td}><button style={S.btnSm} onClick={()=>setLocDraft({...l,_lines:(l.trainings||[]).map(t=>t.name).join('\n')})}>Edit</button></td>

// ── Setup SQL Screen ──────────────────────────────────────────────────────────
function SetupScreen({onRetry}) {
  const [copied,setCopied]=useState(false);
  return (
    <div style={{padding:'32px',maxWidth:'900px',margin:'0 auto'}}>
      <div style={{fontWeight:800,fontSize:'18px',color:'#0f172a',marginBottom:'6px'}}>🏗️ One-time Setup Required</div>
      <div style={{fontSize:'13px',color:'#64748b',marginBottom:'16px'}}>Run this SQL once in <strong>Supabase → SQL Editor</strong> (project: oaerqjrkdpuhiproppaz), then click Check Again.</div>
      <div style={{display:'flex',gap:'10px',marginBottom:'12px'}}>
        <button onClick={()=>{navigator.clipboard.writeText(SETUP_SQL);setCopied(true);setTimeout(()=>setCopied(false),2000);}} style={S.btnGold}>{copied?'✓ Copied!':'Copy SQL'}</button>
        <button onClick={onRetry} style={S.btnPri}>Check Again</button>
      </div>
      <pre style={{background:'#1e293b',color:'#f8fafc',padding:'16px',borderRadius:'8px',fontSize:'11px',overflowX:'auto',whiteSpace:'pre',maxHeight:'500px',overflowY:'auto'}}>{SETUP_SQL}</pre>
    </div>
  );
}

// ── Login Screen ──────────────────────────────────────────────────────────────
function LoginScreen({onLogin}) {
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setErr('');setLoading(true);
    const{error}=await db.auth.signInWithPassword({email,password:pass});
    if(error)setErr(error.message);else onLogin();
    setLoading(false);
  };
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)'}}>
      <div style={{background:'#fff',borderRadius:'12px',padding:'40px',width:'360px',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{textAlign:'center',marginBottom:'28px'}}>
          <div style={{fontSize:'11px',fontWeight:800,color:'#b8972a',letterSpacing:'3px',textTransform:'uppercase',marginBottom:'4px'}}>SATCO Arabia</div>
          <div style={{fontSize:'22px',fontWeight:800,color:'#0f172a'}}>Mobilisation Portal</div>
          <div style={{fontSize:'12px',color:'#64748b',marginTop:'4px'}}>CICPA · Work Permit · Personnel Deployment</div>
        </div>
        <div style={{marginBottom:'14px'}}><label style={S.label}>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} type="email" style={S.input} autoFocus/></div>
        <div style={{marginBottom:'20px'}}><label style={S.label}>Password</label><input value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} type="password" style={S.input}/></div>
        {err&&<div style={{background:'#fee2e2',color:'#991b1b',padding:'8px 10px',borderRadius:'6px',fontSize:'12px',marginBottom:'14px'}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{...S.btnPri,width:'100%',padding:'10px'}}>{loading?'Signing in…':'Sign In'}</button>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  useDragScroll(); // global drag-to-scroll for all .drag-scroll and .tbl-box elements
  const [session,      setSession]      = useState(null);
  const [authReady,    setAuthReady]    = useState(false);
  const [tab,          setTab]          = useState('dashboard');
  const [tableReady,   setTableReady]   = useState(null);
  const [loading,      setLoading]      = useState(true);
  const [filterStatus, setFilterStatus] = useState('');
  const [globalSearch, setGlobalSearch] = useState('');
  const [tabSearch,    setTabSearch]    = useState('');

  const [data, setData] = useState({candidates:[],suppliers:[],requirements:[],loaList:[],mobList:[],locConfigs:[]});

  useEffect(()=>{
    db.auth.getSession().then(({data})=>{setSession(data.session);setAuthReady(true);});
    const{data:l}=db.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>l.subscription.unsubscribe();
  },[]);

  const loadAll = useCallback(async()=>{
    setLoading(true);
    try {
      const[supp,cand,req,loa,mob,loc]=await Promise.all([
        db.from('mob_suppliers').select('*').order('name'),
        db.from('mob_candidates').select('*').order('full_name'),
        db.from('mob_requirements').select('*').order('created_at',{ascending:false}),
        db.from('mob_loa').select('*').order('loa_date',{ascending:false}),
        db.from('mob_register').select('*').order('created_at',{ascending:false}),
        db.from('mob_location_config').select('*').order('location'),
      ]);
      if(cand.error?.code==='42P01'){setTableReady(false);setLoading(false);return;}
      setTableReady(true);
      setData({suppliers:supp.data||[],candidates:cand.data||[],requirements:req.data||[],loaList:loa.data||[],mobList:mob.data||[],locConfigs:loc.data||[]});
    } catch(e){console.error(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{if(session)loadAll();},[session,loadAll]);

  const loaUsed = useMemo(()=>{
    const m={};
    data.mobList.forEach(r=>{if(r.loa_id)m[r.loa_id]=(m[r.loa_id]||0)+1;});
    return m;
  },[data.mobList]);

  // Global search results — search both candidates and mob records
  const searchResults = useMemo(()=>{
    if(!globalSearch.trim())return[];
    const q=globalSearch.trim().toLowerCase();
    const cands=data.candidates.filter(c=>matchSearch(c,q)).slice(0,8).map(c=>({...c,_type:'candidate'}));
    const mobs=data.mobList.filter(m=>matchSearch(m,q)).slice(0,8).map(m=>({...m,_type:'mob'}));
    return [...cands,...mobs].slice(0,12);
  },[globalSearch,data.candidates,data.mobList]);

  const onSearchSelect = result => {
    setGlobalSearch('');
    if(result._type==='candidate'){setTabSearch(result.full_name);setTab('candidates');}
    else{setTabSearch(result.full_name);setTab('mobilisation');}
  };

  const onSave = async(type,draft,onDone)=>{
    const tableMap={candidates:'mob_candidates',suppliers:'mob_suppliers',requirements:'mob_requirements',loa:'mob_loa',mob:'mob_register',locconfig:'mob_location_config'};
    const table=tableMap[type];
    const clean={...draft,updated_at:new Date().toISOString()};
    delete clean._lines; delete clean._candidate;
    const{error}=draft.id
      ?await db.from(table).update(clean).eq('id',draft.id)
      :await db.from(table).insert(clean);
    if(error){alert(error.message);return;}
    await loadAll();
    onDone?.();
  };

  // Demob handler — updates status + demob fields
  const onDemob = async(id, form) => {
    const{error}=await db.from('mob_register').update({
      status:'demobilised',
      demobilisation_date: form.demobilisation_date,
      demob_reason: form.demob_reason,
      demob_remarks: form.demob_remarks,
      wp_action_on_demob: form.wp_action_on_demob,
      cicpa_returned: form.cicpa_returned,
      updated_at: new Date().toISOString(),
    }).eq('id',id);
    if(error){alert(error.message);return;}
    await loadAll();
  };

  const handleMobilise = candidate => {
    sessionStorage.setItem('satco_mob_prefill', JSON.stringify({
      candidate_id:candidate.id, full_name:candidate.full_name,
      designation:candidate.designation, source:candidate.source||'supplier',
      supplier_name:candidate.supplier_name, supplier_emp_no:candidate.supplier_emp_no,
      nationality:candidate.nationality, date_of_birth:candidate.date_of_birth,
      passport_no:candidate.passport_no, emirates_id:candidate.emirates_id,
      visa_no:candidate.visa_no, visa_location:candidate.visa_location,
      customer_name:'',location:'',loa_id:'',
      medical_done:false,hse_passport_done:false,h2s_done:false,extra_trainings:[],status:'pending',notes:'',
    }));
    setTab('mobilisation');
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),150);
  };

  if(!authReady)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#64748b'}}>Loading…</div>;
  if(!session)return<LoginScreen onLogin={()=>db.auth.getSession().then(({data})=>setSession(data.session))}/>;
  if(tableReady===false)return<><TopNav tab={tab} setTab={setTab} onSignOut={()=>db.auth.signOut()} globalSearch={globalSearch} setGlobalSearch={setGlobalSearch} searchResults={[]} onSearchSelect={()=>{}}/><SetupScreen onRetry={loadAll}/></>;

  return (
    <div style={S.page}>
      <TopNav tab={tab} setTab={t=>{setTab(t);setTabSearch('');}} onSignOut={()=>db.auth.signOut()} globalSearch={globalSearch} setGlobalSearch={setGlobalSearch} searchResults={searchResults} onSearchSelect={onSearchSelect}/>
      <div style={S.wrap}>
        <div style={{paddingTop:'20px'}}>
          <LoaBanner loaList={data.loaList} usedMap={loaUsed} onManage={()=>setTab('loa')}/>
          {loading&&tableReady===null&&<div style={{padding:'40px',textAlign:'center',color:'#94a3b8'}}>Loading…</div>}
          {!loading&&tableReady&&<>
            {tab==='dashboard'    &&<Dashboard data={data} loaUsed={loaUsed} setTab={t=>{setTab(t);}} setFilterStatus={setFilterStatus}/>}
            {tab==='candidates'   &&<CandidatesTab candidates={data.candidates} mobList={data.mobList} onSave={onSave} onMobilise={handleMobilise} tabSearch={tabSearch}/>}
            {tab==='requirements' &&<RequirementsTab requirements={data.requirements} onSave={onSave}/>}
            {tab==='loa'          &&<LoaTab loaList={data.loaList} usedMap={loaUsed} onSave={onSave}/>}
            {tab==='mobilisation' &&<MobilisationTab mobList={data.mobList} candidates={data.candidates} loaList={data.loaList} usedMap={loaUsed} locConfigs={data.locConfigs} onSave={onSave} onDemob={onDemob} initialStatus={filterStatus} tabSearch={tabSearch}/>}
            {tab==='letters'      &&<LettersTab mobList={data.mobList}/>}
            {tab==='config'       &&<ConfigTab locConfigs={data.locConfigs} suppliers={data.suppliers} onSave={onSave}/>}
          </>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
