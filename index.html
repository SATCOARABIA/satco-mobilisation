                <td style={{...S.td,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',paddingTop:'4px',paddingBottom:'4px',fontWeight:c.source==='satco_own'?700:400,color:c.source==='satco_own'?'#2563eb':'inherit',fontSize:'12px'}}>{c.source==='satco_own'?'SATCO Arabia':c.supplier_name||'—'}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'12px',fontWeight:700,color:'#0369a1',whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>{c.supplier_emp_no||'—'}</td>
                <td style={{...S.td,whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>{c.nationality||'—'}</td>
                <td style={{...S.td,fontSize:'12px',whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>{c.date_of_birth?fmtDOB(c.date_of_birth):'—'}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'11px',color:pExp?'#dc2626':'inherit',whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>{c.passport_no||'—'}{pExp&&<span style={{marginLeft:'4px',fontSize:'9px',fontWeight:800,color:'#dc2626'}}>EXP</span>}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'11px',whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>{c.emirates_id||'—'}</td>
                <td style={{...S.td,whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>{c.visa_type||'—'} <span style={{color:'#94a3b8',fontSize:'11px'}}>{c.visa_location||''}</span></td>
                <td style={{...S.td,color:vExp?'#dc2626':'inherit',fontWeight:vExp?700:400,whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>{fmtDate(c.visa_expiry)}{vExp&&<span style={{marginLeft:'4px',fontSize:'9px',fontWeight:800,color:'#dc2626'}}>EXP</span>}</td>
                <td style={{...S.td,whiteSpace:'nowrap',paddingTop:'2px',paddingBottom:'2px'}}>
                  <div style={{display:'flex',gap:'3px',alignItems:'center'}}>
                    <button style={{...S.btnSm,padding:'3px 7px',fontSize:'11px'}} onClick={e=>{e.stopPropagation();personHistory(c);}}>History</button>
                    <button style={{...S.btnSm,padding:'3px 7px',fontSize:'11px'}} onClick={e=>{e.stopPropagation();setDraft({...c});setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0);}}>Edit</button>
                    <button style={{...S.btnSm,padding:'3px 7px',fontSize:'11px',background:'#7c3aed',color:'#fff',border:'none'}} onClick={e=>{e.stopPropagation();onMobilise(c);}}>+Mob</button>
                    <button style={{...S.btnSm,padding:'3px 7px',fontSize:'11px',color:'#dc2626',border:'1px solid #fecaca'}} onClick={e=>{e.stopPropagation();onDelete('candidates',c);}}>Del</button>
                  </div>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
        </div>{/* tbl-box */}
      </div>
    </div>
  );
}
// ── Requirements Tab ──────────────────────────────────────────────────────────
function RequirementsTab({requirements, onSave}) {
  const [draft,setDraft]=useState(null);
  const [opsPOs, setOpsPOs]=useState([]);
  const [opsLoading, setOpsLoading]=useState(false);

  // Load POs from Ops portal on mount
  useEffect(()=>{
    setOpsLoading(true);
    opsDb.from('purchase_orders')
      .select('id, po_no, po_date, expiry_date, po_value, currency, status, remarks, customers(name)')
      .neq('status','closed')
      .order('po_date',{ascending:false})
      .then(({data,error})=>{
        if(!error) setOpsPOs(data||[]);
        setOpsLoading(false);
      });
  },[]);

  const fillFromPO = po => {
    setDraft(d=>({...d,
      customer_name: po.customers?.name || d.customer_name,
      po_reference:  po.po_no,
      requirement_date: po.po_date || todayStr(),
      notes: [po.remarks, po.po_value?`PO Value: ${po.currency||'AED'} ${Number(po.po_value).toLocaleString()}`:''].filter(Boolean).join(' · ') || d.notes || '',
    }));
  };
  const blank=()=>setDraft({customer_name:'',po_reference:'',location:'',requirement_date:todayStr(),_lines:'',notes:''});
  const save=()=>{
    if(!draft.customer_name||!draft.location)return alert('Customer and location required');
    const positions=(draft._lines||'').split('\n').map(l=>{const[p,q]=l.split(':').map(s=>s.trim());return p?{designation:p,qty:parseInt(q)||0}:null;}).filter(Boolean);
    onSave('requirements',{...draft,positions,total_headcount:positions.reduce((s,p)=>s+p.qty,0)},()=>setDraft(null));
  };
  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'12px'}}>
        <button style={S.btnPri} onClick={blank}>+ Add Requirement</button>
      </div>
      {draft&&(
        <div style={{...S.card,padding:'16px',marginBottom:'14px',background:'#eff6ff',border:'1px solid #bfdbfe'}}>
          <div style={{fontWeight:800,fontSize:'14px',color:'#1e40af',marginBottom:'14px'}}>{draft.id?'Edit Requirement':'New Customer Requirement'}</div>

          {/* Import from Ops PO + AI Scan PO document */}
          <div style={{background:'#0f172a',borderRadius:'8px',padding:'12px 16px',marginBottom:'14px'}}>
            <div style={{fontWeight:700,fontSize:'12px',color:'#b8972a',marginBottom:'8px'}}>🔗 Import from Ops Portal — Select PO or Scan Document</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'4px'}}>
              <div>
                <div style={{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}}>Search by PO number or customer:</div>
                <input placeholder="Type to filter…" value={draft._poSearch||''} onChange={e=>setDraft(d=>({...d,_poSearch:e.target.value}))} style={{...S.input,background:'#1e293b',color:'#fff',border:'1px solid #334155',marginBottom:'4px'}}/>
                <select onChange={e=>{const po=opsPOs.find(p=>p.id===e.target.value);if(po)fillFromPO(po);}} style={{...S.input,background:'#1e293b',color:'#fff',border:'1px solid #334155',height:'110px'}} size={5}>
                  <option value="">{opsLoading?'Loading…':'— select PO —'}</option>
                  {opsPOs.filter(po=>{const q=(draft._poSearch||'').toLowerCase();if(!q)return true;return(po.po_no||'').toLowerCase().includes(q)||(po.customers?.name||'').toLowerCase().includes(q);}).map(po=>(
                    <option key={po.id} value={po.id}>{po.po_no} — {po.customers?.name||'?'} {po.po_value?`(${po.currency||'AED'} ${Number(po.po_value).toLocaleString()})`:''}</option>
                  ))}
                </select>
                <a href="https://satco-ops.vercel.app" target="_blank" rel="noopener noreferrer" style={{color:'#b8972a',fontSize:'11px',fontWeight:700,textDecoration:'none',display:'block',marginTop:'4px'}}>Open Ops Portal ↗</a>
              </div>
              <div>
                <div style={{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}}>Or upload the PO document — AI reads all details:</div>
                <label style={{display:'flex',alignItems:'center',gap:'8px',padding:'10px 14px',background:'#b8972a',color:'#fff',borderRadius:'6px',cursor:'pointer',fontWeight:700,fontSize:'12px',marginBottom:'6px',whiteSpace:'nowrap'}}>
                  {draft._poScanning?'⏳ Reading PO…':'📄 Upload PO PDF / Image'}
                  <input type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={async e=>{
                    const file=e.target.files?.[0];if(!file)return;
                    setDraft(d=>({...d,_poScanning:true,_poScanErr:''}));
                    try{
                      const b64=await fileToBase64(file);
                      const mime=file.type||'application/pdf';
                      const res=await fetch(CLAUDE_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[{type:mime.startsWith('image/')?'image':'document',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:'Extract from this Purchase Order. Return ONLY valid JSON: {"customer_name":"","po_no":"","po_date":"YYYY-MM-DD","location":"","positions":[{"designation":"","qty":0}],"notes":""}'}]}]})});
                      const data=await res.json();
                      const text=(data.content||[]).map(c=>c.text||'').join('').trim();
                      const match=text.match(/\{[\s\S]*\}/);
                      if(!match)throw new Error('AI did not return JSON');
                      const r=JSON.parse(match[0]);
                      setDraft(d=>({...d,customer_name:r.customer_name||d.customer_name,po_reference:r.po_no||d.po_reference,requirement_date:r.po_date||d.requirement_date||todayStr(),location:r.location||d.location,_lines:r.positions?.length?r.positions.map(p=>`${p.designation}: ${p.qty}`).join('\n'):(d._lines||''),notes:r.notes||d.notes||'',_poScanning:false,_poScanResult:r}));
                    }catch(ex){setDraft(d=>({...d,_poScanning:false,_poScanErr:ex.message}));}
                    e.target.value='';
                  }}/>
                </label>
                {draft._poScanErr&&<div style={{color:'#f87171',fontSize:'11px',marginBottom:'4px'}}>⚠ {draft._poScanErr}</div>}
                {draft._poScanResult&&<div style={{color:'#4ade80',fontSize:'11px',fontWeight:700,marginBottom:'4px'}}>✓ PO scanned — fields filled. Review below and save.</div>}
                <div style={{fontSize:'11px',color:'#475569'}}>Upload scanned PDF or photo. AI extracts customer, PO no, location and positions.</div>
              </div>
            </div>
          </div>
          <Grid cols={3}>
            <Field label="Customer *"><input value={draft.customer_name||''} onChange={e=>setDraft(d=>({...d,customer_name:e.target.value}))} placeholder="ADNOC / TAQA / Linde…" style={S.input}/></Field>
            <Field label="Location *"><input value={draft.location||''} onChange={e=>setDraft(d=>({...d,location:e.target.value}))} placeholder="Ruwais / KEZAD / Das Island…" style={S.input}/></Field>
            <Field label="PO Reference"><input value={draft.po_reference||''} onChange={e=>setDraft(d=>({...d,po_reference:e.target.value}))} style={S.input}/></Field>
            <Field label="Date"><input type="date" value={draft.requirement_date||''} onChange={e=>setDraft(d=>({...d,requirement_date:e.target.value}))} style={S.input}/></Field>
          </Grid>
          <Field label="Positions & Quantities — one per line as: Designation: Qty">
            <textarea value={draft._lines||''} onChange={e=>setDraft(d=>({...d,_lines:e.target.value}))} placeholder={"Pipe Fabricator: 50\nScaffolder: 50\nPipe Fitter: 20\nMech Helper: 30"} style={{...S.input,height:'100px',resize:'vertical',fontFamily:'monospace',marginTop:'2px'}}/>
          </Field>
          <Field label="Notes"><input value={draft.notes||''} onChange={e=>setDraft(d=>({...d,notes:e.target.value}))} style={{...S.input,marginTop:'8px'}}/></Field>
          <div style={{display:'flex',gap:'8px',marginTop:'12px'}}>
            <button style={S.btnPri} onClick={save}>Save</button>
            <button style={S.btnSec} onClick={()=>setDraft(null)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={{...S.card,overflow:'hidden'}}>
        <div className="drag-scroll" style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>{['Customer','Location','PO Ref','Date','Breakdown','Total','Notes',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {requirements.length===0&&<tr><td colSpan={8} style={{padding:'24px',textAlign:'center',color:'#94a3b8'}}>No requirements yet.</td></tr>}
            {requirements.map(r=><tr key={r.id} className="hr-row">
              <td style={{...S.td,fontWeight:700}}>{r.customer_name}</td>
              <td style={S.td}>{r.location}</td>
              <td style={{...S.td,fontFamily:'monospace',fontSize:'11px'}}>{r.po_reference||'—'}</td>
              <td style={S.td}>{fmtDate(r.requirement_date)}</td>
              <td style={S.td}>{(r.positions||[]).map((p,i)=><div key={i} style={{fontSize:'12px'}}><strong>{p.qty}</strong> × {p.designation}</div>)}</td>
              <td style={{...S.td,fontWeight:800,fontSize:'18px',textAlign:'center'}}>{r.total_headcount}</td>
              <td style={S.td}>{r.notes||'—'}</td>
              <td style={S.td}><button style={S.btnSm} onClick={()=>setDraft({...r,_lines:(r.positions||[]).map(p=>`${p.designation}: ${p.qty}`).join('\n')})}>Edit</button></td>
            </tr>)}
          </tbody>
        </table>
        </div>{/* drag-scroll */}
      </div>
    </div>
  );
}

// ── LOA Tab ───────────────────────────────────────────────────────────────────
function LoaTab({loaList, usedMap, onSave}) {
  const [draft,setDraft]=useState(null);
  const blank=()=>setDraft({customer_name:'',location:'',loa_reference:'',loa_date:todayStr(),total_count:'',alert_threshold:10,notes:''});
  const save=()=>{
    if(!draft.customer_name||!draft.location)return alert('Customer and location required');
    if(!draft.total_count||draft.total_count<1)return alert('LOA count required');
    onSave('loa',{...draft,total_count:parseInt(draft.total_count),alert_threshold:parseInt(draft.alert_threshold)||10},()=>setDraft(null));
  };
  return (
    <div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'12px'}}>
        <button style={S.btnGold} onClick={blank}>+ Register LOA</button>
      </div>
      {draft&&(
        <div style={{...S.card,padding:'16px',marginBottom:'14px',background:'#fffbeb',border:'1px solid #fde68a'}}>
          <div style={{fontWeight:800,fontSize:'14px',color:'#92400e',marginBottom:'14px'}}>{draft.id?'Edit LOA':'Register New LOA'}</div>
          <Grid cols={3}>
            <Field label="Customer *"><input value={draft.customer_name||''} onChange={e=>setDraft(d=>({...d,customer_name:e.target.value}))} style={S.input}/></Field>
            <Field label="Location *"><input value={draft.location||''} onChange={e=>setDraft(d=>({...d,location:e.target.value}))} style={S.input}/></Field>
            <Field label="LOA Reference"><input value={draft.loa_reference||''} onChange={e=>setDraft(d=>({...d,loa_reference:e.target.value}))} style={S.input}/></Field>
            <Field label="LOA Date"><input type="date" value={draft.loa_date||''} onChange={e=>setDraft(d=>({...d,loa_date:e.target.value}))} style={S.input}/></Field>
            <Field label="Total LOA Count *">
              <input type="number" min="1" value={draft.total_count||''} onChange={e=>setDraft(d=>({...d,total_count:e.target.value}))} placeholder="e.g. 100" style={S.input}/>
            </Field>
            <Field label="Alert When Remaining Below">
              <input type="number" min="1" value={draft.alert_threshold||10} onChange={e=>setDraft(d=>({...d,alert_threshold:e.target.value}))} style={S.input}/>
              <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'3px'}}>Shows warning banner when fewer than this many LOAs remain</div>
            </Field>
          </Grid>
          <Field label="Notes"><input value={draft.notes||''} onChange={e=>setDraft(d=>({...d,notes:e.target.value}))} style={{...S.input,marginBottom:'14px'}}/></Field>
          <div style={{display:'flex',gap:'8px'}}><button style={S.btnGold} onClick={save}>Save LOA</button><button style={S.btnSec} onClick={()=>setDraft(null)}>Cancel</button></div>
        </div>
      )}
      <div style={{...S.card,overflow:'hidden'}}>
        <div className="drag-scroll" style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>{['Customer','Location','LOA Ref','Date','Total','Used','Remaining','Alert At','Notes',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {loaList.length===0&&<tr><td colSpan={10} style={{padding:'24px',textAlign:'center',color:'#94a3b8'}}>No LOA registered. Click <strong>+ Register LOA</strong>.</td></tr>}
            {loaList.map(l=>{
              const used=usedMap[l.id]||0, rem=l.total_count-used, low=rem<(l.alert_threshold||10);
              return <tr key={l.id} style={{background:low?'#fffbeb':'#fff'}} className="hr-row">
                <td style={{...S.td,fontWeight:700}}>{l.customer_name}</td>
                <td style={S.td}>{l.location}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'11px'}}>{l.loa_reference||'—'}</td>
                <td style={S.td}>{fmtDate(l.loa_date)}</td>
                <td style={{...S.td,fontWeight:700,textAlign:'right'}}>{l.total_count}</td>
                <td style={{...S.td,textAlign:'right',color:'#0369a1',fontWeight:600}}>{used}</td>
                <td style={{...S.td,textAlign:'right',fontWeight:800,color:rem<=5?'#dc2626':low?'#b45309':'#166534'}}>{rem}</td>
                <td style={{...S.td,textAlign:'right',color:'#94a3b8'}}>{l.alert_threshold||10}</td>
                <td style={S.td}>{l.notes||'—'}</td>
                <td style={S.td}><button style={S.btnSm} onClick={()=>setDraft({...l})}>Edit</button></td>
              </tr>;
            })}
          </tbody>
        </table>
        </div>{/* drag-scroll */}
      </div>
    </div>
  );
}
// ── Candidate Picker ─────────────────────────────────────────────────────────
// Shows all candidates/SATCO employees as a searchable card list for selection
function CandidatePicker({candidates, movedIds, onSelect, selectedId}) {
  const [search, setSearch] = useState('');
  const [srcFilter, setSrcFilter] = useState(''); // '' | 'satco_own' | 'supplier'
  const [open, setOpen] = useState(!selectedId); // collapsed once someone is selected

  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    return candidates.filter(c => {
      if (srcFilter && c.source !== srcFilter) return false;
      if (!q) return true;
      return (c.full_name||'').toLowerCase().includes(q)
        || (c.designation||'').toLowerCase().includes(q)
        || (c.supplier_name||'').toLowerCase().includes(q)
        || (c.supplier_emp_no||'').toLowerCase().includes(q)
        || (c.emirates_id||'').toLowerCase().includes(q)
        || (c.passport_no||'').toLowerCase().includes(q);
    });
  }, [candidates, search, srcFilter]);

  const selected = candidates.find(c => c.id === selectedId);

  return (
    <div style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:'8px',marginBottom:'14px',overflow:'hidden'}}>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',background:'#f8fafc',borderBottom:'1px solid #e2e8f0',cursor:'pointer'}} onClick={()=>setOpen(o=>!o)}>
        <div style={{fontWeight:700,fontSize:'12px',color:'#0f172a'}}>
          👤 Select Candidate for This Mobilisation
        </div>
        <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
          {selected && (
            <span style={{background:'#dbeafe',color:'#1e40af',fontWeight:700,fontSize:'11px',padding:'2px 10px',borderRadius:12}}>
              ✓ {selected.full_name} — {selected.supplier_emp_no||selected.designation||'SATCO Own'}
            </span>
          )}
          <span style={{color:'#64748b',fontSize:'13px'}}>{open?'▲':'▼'}</span>
        </div>
      </div>

      {/* Picker body */}
      {open && (
        <div>
          {/* Filters */}
          <div style={{display:'flex',gap:'8px',padding:'10px 14px',borderBottom:'1px solid #f1f5f9',flexWrap:'wrap',alignItems:'center'}}>
            <input
              placeholder="Search name, EMP no, EID, designation…"
              value={search}
              onChange={e=>setSearch(e.target.value)}
              style={{...S.input,width:'280px',fontSize:'12px',padding:'6px 10px'}}
              autoFocus
            />
            <select value={srcFilter} onChange={e=>setSrcFilter(e.target.value)} style={{...S.input,width:'160px',fontSize:'12px',padding:'6px 10px'}}>
              <option value="">All sources</option>
              <option value="satco_own">SATCO Own Employees</option>
              <option value="supplier">Labour Suppliers</option>
            </select>
            <span style={{fontSize:'12px',color:'#64748b'}}>{filtered.length} people</span>
          </div>

          {/* Card grid */}
          <div style={{maxHeight:'340px',overflowY:'auto',padding:'10px 14px',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:'8px'}}>
            {filtered.length === 0 && (
              <div style={{gridColumn:'1/-1',textAlign:'center',padding:'24px',color:'#94a3b8',fontSize:'13px'}}>
                No candidates match. <span style={{color:'#2563eb',cursor:'pointer'}} onClick={()=>{setSearch('');setSrcFilter('');}}>Clear filters</span>
              </div>
            )}
            {filtered.map(c => {
              const isSelected = c.id === selectedId;
              const isOnSite = movedIds.has(c.id);
              const isSatco = c.source === 'satco_own';
              return (
                <div key={c.id}
                  onClick={()=>{ onSelect(c.id); setOpen(false); }}
                  style={{
                    border: isSelected ? '2px solid #2563eb' : '1px solid #e2e8f0',
                    borderRadius:'8px', padding:'10px 12px',
                    cursor:'pointer', background: isSelected?'#eff6ff':'#fff',
                    transition:'border-color 0.15s',
                    position:'relative',
                  }}
                  onMouseEnter={e=>{ if(!isSelected) e.currentTarget.style.borderColor='#b897 2a'; }}
                  onMouseLeave={e=>{ if(!isSelected) e.currentTarget.style.borderColor='#e2e8f0'; }}
                >
                  {/* Status badges */}
                  <div style={{display:'flex',gap:'4px',marginBottom:'4px',flexWrap:'wrap'}}>
                    {isSatco
                      ? <span style={{background:'#dbeafe',color:'#1e40af',fontSize:'10px',fontWeight:700,padding:'1px 6px',borderRadius:8}}>SATCO</span>
                      : <span style={{background:'#f1f5f9',color:'#475569',fontSize:'10px',fontWeight:700,padding:'1px 6px',borderRadius:8}}>Supplier</span>
                    }
                    {isOnSite && <span style={{background:'#dcfce7',color:'#166534',fontSize:'10px',fontWeight:700,padding:'1px 6px',borderRadius:8}}>On Site</span>}
                    {isSelected && <span style={{background:'#2563eb',color:'#fff',fontSize:'10px',fontWeight:700,padding:'1px 6px',borderRadius:8}}>✓ Selected</span>}
                  </div>
                  {/* Name */}
                  <div style={{fontWeight:700,fontSize:'13px',color:'#0f172a',marginBottom:'2px'}}>{c.full_name}</div>
                  {/* Designation */}
                  <div style={{fontSize:'11px',color:'#475569',marginBottom:'4px'}}>{c.designation||'—'}</div>
                  {/* Details */}
                  <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
                    {c.supplier_emp_no && (
                      <span style={{fontFamily:'monospace',fontSize:'11px',color:'#0369a1',fontWeight:700}}>{c.supplier_emp_no}</span>
                    )}
                    {c.supplier_name && !isSatco && (
                      <span style={{fontSize:'11px',color:'#64748b'}}>{c.supplier_name}</span>
                    )}
                    {c.nationality && (
                      <span style={{fontSize:'11px',color:'#64748b'}}>{c.nationality}</span>
                    )}
                  </div>
                  {c.passport_no && (
                    <div style={{fontFamily:'monospace',fontSize:'10px',color:'#94a3b8',marginTop:'3px'}}>PP: {c.passport_no}</div>
                  )}
                  {c.emirates_id && (
                    <div style={{fontFamily:'monospace',fontSize:'10px',color:'#94a3b8'}}>EID: {c.emirates_id}</div>
                  )}
                </div>
              );
            })}
          </div>

          {selected && (
            <div style={{padding:'8px 14px',borderTop:'1px solid #f1f5f9',display:'flex',gap:'8px',alignItems:'center'}}>
              <span style={{fontSize:'12px',color:'#166534',fontWeight:600}}>✓ Selected: {selected.full_name}</span>
              <button onClick={()=>{onSelect('');setOpen(true);}} style={{...S.btnSm,fontSize:'11px',color:'#dc2626'}}>Clear selection</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Mobilisation Tab ──────────────────────────────────────────────────────────
function MobilisationTab({mobList, candidates, loaList, requirements, usedMap, locConfigs, onSave, onDemob, onRefresh, initialStatus, tabSearch}) {
  const [draft,setDraft]     = usePersistentDraft('mobilisation');
  const [savedDraft, setSavedDraft] = useState(() => { try { const v=localStorage.getItem('satco_mob_draft_mobilisation'); return v?JSON.parse(v):null; } catch{return null;} });
  const [demobRec,setDemobRec] = useState(null);
  const [docPanel, setDocPanel] = useState(null);
  const [readinessRow, setReadinessRow] = useState(null);
  const clickTimer = useRef(null);
  const [search,setSearch]   = useState(tabSearch||'');
  const [fCust,setFCust]     = useState('');
  const [fLoc,setFLoc]       = useState('');
  const [fStatus,setFStatus] = useState(initialStatus||'');
  const [fReady,setFReady]   = useState(''); // 'ready'|'not_ready'|''

  useEffect(()=>{ if(initialStatus) setFStatus(initialStatus); },[initialStatus]);
  useEffect(()=>{ if(tabSearch) setSearch(tabSearch); },[tabSearch]);

  // ── Compute readiness for one mobilisation record ────────────────────────
  const computeReadiness = useCallback((r) => {
    const cfg = locConfigs.find(l => l.location === r.location);
    const required = [];

    // Always required
    required.push({ name:'Passport',      done: !!r.passport_no,           label:'Passport No',        critical:true });
    required.push({ name:'Emirates ID',   done: !!r.emirates_id,           label:'Emirates ID',        critical:true });
    required.push({ name:'Visa',          done: !!r.visa_no,               label:'Visa No',            critical:true });
    // Work Permit only required for supplier/subcontractor personnel — SATCO Own employees are on SATCO visa
    if (r.source !== 'satco_own') {
      required.push({ name:'Work Permit', done: !!r.wp_approved_date,      label:'WP Approved',        critical:true });
    }
    required.push({ name:'Medical',       done: !!r.medical_done && r.medical_result!=='Unfit', label:'Medical Fit', critical:true });
    required.push({ name:'HSE Passport',  done: !!r.hse_passport_done,     label:'HSE Passport',       critical:false });
    required.push({ name:'H2S Training',  done: !!r.h2s_done,             label:'H2S',                critical:false });

    // Location-specific from config
    if (cfg?.trainings?.length) {
      cfg.trainings.forEach(t => {
        const found = (r.extra_trainings||[]).find(et => et.name.toLowerCase() === t.name.toLowerCase());
        required.push({
          name:     t.name,
          done:     !!(found?.done),
          label:    t.name,
          critical: !!t.mandatory,
          expiry:   found?.expiry || null,
        });
      });
    }

    // Check CICPA (needed for final submission)
    required.push({ name:'CICPA', done: !!r.cicpa_pass_no, label:'CICPA Gate Pass', critical:false });

    const missing  = required.filter(x => !x.done);
    const critical = missing.filter(x => x.critical);
    const ready    = missing.length === 0;
    const readyForSubmission = critical.length === 0; // critical docs all present

    return { required, missing, ready, readyForSubmission, criticalMissing: critical };
  }, [locConfigs]);

  // ── Readiness Panel ───────────────────────────────────────────────────────
  const ReadinessPanel = ({ r, onClose }) => {
    const rd = computeReadiness(r);
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}} onClick={onClose}>
        <div style={{background:'#fff',borderRadius:'12px',width:'100%',maxWidth:'580px',maxHeight:'90vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
          <div style={{padding:'16px 20px',background:'#0f172a',borderRadius:'12px 12px 0 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontWeight:800,fontSize:'15px',color:'#fff'}}>{r.full_name}</div>
              <div style={{fontSize:'12px',color:'#94a3b8'}}>{r.designation||'—'} · {r.customer_name} / {r.location}</div>
            </div>
            <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
              <span style={{background:rd.ready?'#166534':rd.readyForSubmission?'#92400e':'#991b1b',color:'#fff',fontWeight:800,fontSize:'12px',padding:'4px 12px',borderRadius:20}}>
                {rd.ready ? '✅ FULLY READY' : rd.readyForSubmission ? '⚠ READY (pending CICPA)' : '❌ NOT READY'}
              </span>
              <button onClick={onClose} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',width:30,height:30,borderRadius:'50%',cursor:'pointer',fontSize:'16px'}}>×</button>
            </div>
          </div>
          <div style={{padding:'16px 20px'}}>
            <div style={{fontWeight:700,fontSize:'12px',color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'10px'}}>
              Document & Training Checklist — {r.location}
            </div>
            {rd.required.map((item,i) => (
              <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderRadius:'6px',marginBottom:'4px',background:item.done?'#f0fdf4':'#fef2f2',border:`1px solid ${item.done?'#bbf7d0':item.critical?'#fecaca':'#fed7aa'}`}}>
                <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
                  <span style={{fontSize:'16px'}}>{item.done ? '✅' : item.critical ? '❌' : '⚠️'}</span>
                  <div>
                    <div style={{fontWeight:600,fontSize:'13px',color: item.done?'#166534':item.critical?'#991b1b':'#92400e'}}>{item.name}</div>
                    {item.expiry && <div style={{fontSize:'11px',color:'#64748b'}}>Expires: {fmtDate(item.expiry)}</div>}
                  </div>
                </div>
                <span style={{fontSize:'11px',fontWeight:700,color:item.done?'#166534':item.critical?'#dc2626':'#b45309'}}>
                  {item.done ? 'Done' : item.critical ? 'REQUIRED' : 'Pending'}
                </span>
              </div>
            ))}
            {rd.missing.length > 0 && (
              <div style={{marginTop:'12px',padding:'10px 14px',background:'#fef3c7',borderRadius:'8px',fontSize:'12px',color:'#92400e'}}>
                <strong>Missing ({rd.missing.length}):</strong> {rd.missing.map(x=>x.name).join(', ')}
              </div>
            )}
            {rd.ready && (
              <div style={{marginTop:'12px',padding:'10px 14px',background:'#dcfce7',borderRadius:'8px',fontSize:'12px',color:'#166534',fontWeight:700}}>
                ✅ All documents complete — this person can be included in the client submission list.
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  const customers = useMemo(()=>[...new Set(mobList.map(m=>m.customer_name).filter(Boolean))].sort(),[mobList]);
  const locations = useMemo(()=>[...new Set(mobList.map(m=>m.location).filter(Boolean))].sort(),[mobList]);

  const filtered = useMemo(()=> mobList.filter(m=>{
    if (fCust && m.customer_name!==fCust) return false;
    if (fLoc  && m.location!==fLoc)      return false;
    if (fStatus && m.status!==fStatus)   return false;
    if (fReady) {
      const rd = computeReadiness(m);
      if (fReady==='ready'     && !rd.readyForSubmission) return false;
      if (fReady==='not_ready' && rd.readyForSubmission)  return false;
    }
    return matchSearch(m, search);
  }), [mobList, search, fCust, fLoc, fStatus, fReady, computeReadiness]);

  const fillFromCandidate = candId => {
    if (!candId) { setDraft(d=>({...d,candidate_id:null})); return; }
    const c = candidates.find(x=>x.id===candId);
    if (!c) return;
    setDraft(d=>({...d, candidate_id:c.id, full_name:c.full_name, designation:c.designation||d.designation,
      source:c.source||'supplier', supplier_name:c.supplier_name, supplier_emp_no:c.supplier_emp_no,
      nationality:c.nationality, date_of_birth:c.date_of_birth,
      passport_no:c.passport_no, passport_expiry:c.passport_expiry||d.passport_expiry,
      emirates_id:c.emirates_id, eid_expiry:c.eid_expiry||d.eid_expiry,
      visa_no:c.visa_no, visa_type:c.visa_type||d.visa_type,
      visa_location:c.visa_location, visa_expiry:c.visa_expiry||d.visa_expiry,
      phone:c.phone||d.phone}));
  };

  const applyLocTrainings = loc => {
    const cfg = locConfigs.find(l=>l.location===loc);
    if (!cfg||!cfg.trainings?.length) return;
    setDraft(d=>({...d, extra_trainings:cfg.trainings.map(t=>({name:t.name,mandatory:t.mandatory,done:false,date:null}))}));
  };

  // availLoas: show all LOAs for selected customer, also show all if no customer selected
  const availLoas = draft ? loaList.filter(l=>{
    if (!draft.customer_name) return true;
    // exact match first, then partial match on customer name
    const custMatch = l.customer_name===draft.customer_name ||
      l.customer_name?.toLowerCase().includes(draft.customer_name.toLowerCase().split(' ')[0]) ||
      draft.customer_name.toLowerCase().includes((l.customer_name||'').toLowerCase().split(' ')[0]);
    if (!custMatch) return false;
    if (!draft.location) return true;
    const locMatch = !l.location || l.location===draft.location ||
      l.location?.toLowerCase().includes(draft.location.toLowerCase().split(' ')[0]) ||
      draft.location.toLowerCase().includes((l.location||'').toLowerCase().split(' ')[0]);
    return locMatch;
  }) : [];

  const blank = () => { setDraft({full_name:'',designation:'',source:'supplier',supplier_name:'',supplier_emp_no:'',nationality:'',date_of_birth:'',passport_no:'',emirates_id:'',visa_no:'',visa_location:'',customer_name:'',location:'',loa_id:'',medical_done:false,medical_result:'',hse_passport_done:false,h2s_done:false,extra_trainings:[],status:'pending',notes:''}); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); };

  const handleRowClick = (r, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    clickTimer.current = setTimeout(() => {
      setDocPanel({entity: r, entityType: 'mobilisation'});
    }, 220);
  };
  const handleRowDblClick = (r, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    setDraft({...r});
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0);
  };

  const applyAiData = async (aiData, docType) => {
    if (!docPanel) return;
    const dt = (aiData.doc_type || docType || '').toLowerCase();
    const tn = (aiData.training_name || '').toLowerCase();
    const updates = {};

    // Identity fields
    if (aiData.full_name)       updates.full_name       = aiData.full_name;
    if (aiData.passport_no)     updates.passport_no     = aiData.passport_no;
    if (aiData.nationality)     updates.nationality     = aiData.nationality;
    if (aiData.date_of_birth)   updates.date_of_birth   = aiData.date_of_birth;
    if (aiData.passport_expiry) updates.passport_expiry = aiData.passport_expiry;
    if (aiData.emirates_id)     updates.emirates_id     = aiData.emirates_id;
    if (aiData.eid_expiry)      updates.eid_expiry      = aiData.eid_expiry;
    if (aiData.visa_no)         updates.visa_no         = aiData.visa_no;
    if (aiData.visa_type)       updates.visa_type       = aiData.visa_type;
    if (aiData.visa_expiry)     updates.visa_expiry     = aiData.visa_expiry;
    if (aiData.designation)     updates.designation     = aiData.designation;

    // Work permit
    if (dt.includes('work_permit') || aiData.wp_no) {
      if (aiData.wp_no)       updates.wp_no            = aiData.wp_no;
      if (aiData.issue_date)  updates.wp_approved_date = aiData.issue_date;
    }
    // CICPA
    if (dt.includes('cicpa') || aiData.cicpa_pass_no) {
      if (aiData.cicpa_pass_no)   updates.cicpa_pass_no       = aiData.cicpa_pass_no;
      if (aiData.issue_date)      updates.cicpa_approved_date = aiData.issue_date;
      if (aiData.cicpa_expiry)    updates.cicpa_expiry_date   = aiData.cicpa_expiry;
      if (aiData.training_expiry) updates.cicpa_expiry_date   = aiData.training_expiry;
    }
    // Medical
    if (dt.includes('medical') || aiData.medical_result || aiData.medical_date) {
      updates.medical_done = true;
      if (aiData.medical_result) updates.medical_result = aiData.medical_result;
      const md = aiData.medical_date || aiData.issue_date;
      if (md) updates.medical_date = md;
    }
    // HSE Passport
    else if (dt === 'hse_passport' || tn.includes('hse passport') || tn.includes('hse induction')) {
      updates.hse_passport_done = true;
      const d = aiData.training_date || aiData.issue_date;
      if (d) updates.hse_passport_date = d;
    }
    // H2S
    else if (dt === 'h2s_certificate' || tn.includes('h2s')) {
      updates.h2s_done = true;
      const d = aiData.training_date || aiData.issue_date;
      if (d) updates.h2s_date = d;
    }
    // Any other training certificate — add to extra_trainings (unlimited)
    else if (aiData.training_name && !dt.includes('medical') && !dt.includes('passport') && !dt.includes('emirates') && !dt.includes('visa') && !dt.includes('work_permit') && !dt.includes('cicpa')) {
      const current = Array.isArray(docPanel.entity.extra_trainings) ? docPanel.entity.extra_trainings : [];
      const certName = aiData.training_name;
      const alreadyExists = current.some(t => (t.name||'').toLowerCase() === certName.toLowerCase());
      if (!alreadyExists) {
        const newEntry = {
          name:      certName,
          done:      aiData.training_passed !== false,
          date:      aiData.training_date || aiData.issue_date || null,
          expiry:    aiData.training_expiry || null,
          cert_no:   aiData.certificate_no  || null,
          issuer:    aiData.issuing_authority || null,
          mandatory: false,
        };
        updates.extra_trainings = [...current, newEntry];
      }
    }

    if (!Object.keys(updates).length) {
      alert('No matching fields found. Make sure the image is clear and the document is readable.');
      return;
    }
    const { error } = await db.from('mob_register').update({ ...updates, updated_at: new Date().toISOString() }).eq('id', docPanel.entity.id);
    if (error) { alert(error.message); return; }
    setDocPanel(d => d ? {...d, entity:{...d.entity,...updates}} : d);
    const changed = Object.keys(updates).filter(k => k !== 'updated_at');
    alert('✓ Updated: ' + changed.join(', '));
  };

  // Read prefill from candidates tab
  useEffect(()=>{
    const pf = sessionStorage.getItem('satco_mob_prefill');
    if (pf) { try { setDraft(JSON.parse(pf)); } catch(e){} sessionStorage.removeItem('satco_mob_prefill'); }
  },[]);

  const exportCols = [
    {key:'full_name',label:'Name'},{key:'designation',label:'Designation'},{key:'source',label:'Source'},
    {key:'supplier_name',label:'Supplier'},{key:'supplier_emp_no',label:'Supplier Emp No'},
    {key:'nationality',label:'Nationality'},{key:'date_of_birth',label:'DOB',date:true},
    {key:'passport_no',label:'Passport No'},{key:'emirates_id',label:'Emirates ID'},{key:'visa_location',label:'Visa Location'},
    {key:'customer_name',label:'Customer'},{key:'location',label:'Location'},
    {key:'wp_no',label:'WP No'},{key:'wp_approved_date',label:'WP Approved',date:true},
    {key:'medical_done',label:'Medical Done',bool:true},{key:'medical_date',label:'Medical Date',date:true},{key:'medical_result',label:'Medical Result'},
    {key:'hse_passport_done',label:'HSE Passport',bool:true},{key:'hse_passport_date',label:'HSE Date',date:true},
    {key:'h2s_done',label:'H2S Done',bool:true},{key:'h2s_date',label:'H2S Date',date:true},
    {key:'cicpa_pass_no',label:'CICPA Pass No'},{key:'cicpa_approved_date',label:'CICPA Approved',date:true},{key:'cicpa_expiry_date',label:'CICPA Expiry',date:true},
    {key:'status',label:'Status'},{key:'mobilisation_date',label:'Mob Date',date:true},
    {key:'demobilisation_date',label:'Demob Date',date:true},{key:'demob_reason',label:'Demob Reason'},{key:'demob_remarks',label:'Demob Remarks'},
    {key:'wp_action_on_demob',label:'WP Action on Demob'},{key:'notes',label:'Notes'},
  ];

  return (
    <div>
      {!draft && savedDraft && (
        <DraftBanner draft={savedDraft}
          onRestore={()=>{ setDraft(savedDraft); setSavedDraft(null); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); }}
          onDiscard={()=>{ localStorage.removeItem('satco_mob_draft_mobilisation'); setSavedDraft(null); }}
        />
      )}
      {demobRec && <DemobModal record={demobRec} onClose={()=>setDemobRec(null)} onSave={(id,form)=>{onDemob(id,form);setDemobRec(null);}}/>}
      {docPanel && <DocumentPanel entity={docPanel.entity} entityType={docPanel.entityType} onClose={()=>setDocPanel(null)} onApplyAiData={applyAiData}/>}
      {readinessRow && <ReadinessPanel r={readinessRow} onClose={()=>setReadinessRow(null)}/>}

      <div ref={measureToStk2} className="sticky-toolbar" style={{padding:'8px 14px',display:'flex',gap:'8px',justifyContent:'space-between',flexWrap:'wrap',alignItems:'center'}}>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}}>
          <input placeholder="Search name, EID, passport, CICPA…" value={search} onChange={e=>setSearch(e.target.value)} style={{...S.input,width:'200px'}}/>
          <select value={fCust} onChange={e=>setFCust(e.target.value)} style={{...S.input,width:'130px'}}>
            <option value="">All customers</option>
            {customers.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select value={fLoc} onChange={e=>setFLoc(e.target.value)} style={{...S.input,width:'120px'}}>
            <option value="">All locations</option>
            {locations.map(l=><option key={l} value={l}>{l}</option>)}
          </select>
          <select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{...S.input,width:'115px'}}>
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="mobilised">Mobilised</option>
            <option value="demobilised">Demobilised</option>
            <option value="rejected">Rejected</option>
          </select>
          <select value={fReady} onChange={e=>setFReady(e.target.value)} style={{...S.input,width:'130px',borderColor:fReady?'#b8972a':undefined,fontWeight:fReady?700:400}}>
            <option value="">All readiness</option>
            <option value="ready">✅ Ready only</option>
            <option value="not_ready">❌ Not ready</option>
          </select>
          <span style={{fontSize:'12px',color:'#64748b',whiteSpace:'nowrap'}}>{filtered.length} records</span>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button style={{...S.btnGold,background:'#166534'}} onClick={()=>{
            const readyOnly=filtered.filter(r=>computeReadiness(r).readyForSubmission);
            if(!readyOnly.length)return alert('No ready personnel in current filter. Check location config for required certs.');
            exportCSV(readyOnly,`SATCO_Ready_${fCust||'All'}_${fLoc||'AllLoc'}`,exportCols);
          }}>✅ Export Ready</button>
          <button style={S.btnGold} onClick={()=>exportCSV(filtered,`SATCO_Mob_${fCust||'All'}_${fLoc||'AllLoc'}`,exportCols)}>⬇ Export All</button>
          <button style={{...S.btnGold,background:'#0f172a',color:'#c49a28',fontWeight:700,fontSize:'12px'}} onClick={()=>{
            const XLSX=window.XLSX;
            if(!XLSX)return alert('SheetJS not loaded — refresh page.');
            const rows=filtered.map((r,i)=>({
              'SI No':i+1,'Company Name':'SATCO Arabia','Employee Number':r.supplier_emp_no||'',
              'Employee Name':r.full_name||'','Designation':r.designation||'',
              'DOB':r.date_of_birth?new Date(r.date_of_birth).toLocaleDateString('en-GB'):'',
              'Nationality':r.nationality||'','Emirates ID Number':r.emirates_id||'',
              'Emirates ID Validity Date':r.eid_expiry?new Date(r.eid_expiry).toLocaleDateString('en-GB'):'',
              'Visa State':r.visa_location||'','Passport Number':r.passport_no||'',
              'Email ID':'admin@satcoarabiaengg.com','Phone Number':'+971565032032',
              'Security Pass Expiry':r.cicpa_expiry_date?new Date(r.cicpa_expiry_date).toLocaleDateString('en-GB'):'',
              'Security Pass No':r.cicpa_pass_no||'',
              'Adnoc Medical Status':r.medical_done&&r.medical_expiry?new Date(r.medical_expiry).toLocaleDateString('en-GB'):(r.medical_done?(r.medical_result||'Fit'):'')
            }));
            const ws=XLSX.utils.json_to_sheet(rows);
            ws['!cols']=[{wch:6},{wch:22},{wch:14},{wch:26},{wch:16},{wch:12},{wch:14},{wch:22},{wch:18},{wch:14},{wch:14},{wch:28},{wch:16},{wch:16},{wch:16},{wch:18}];
            const wb2=XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb2,ws,'Mob Submission List');
            XLSX.writeFile(wb2,`SATCO_ClientList_${(fCust||'All').replace(/\s+/g,'_')}_${todayStr()}.xlsx`);
          }}>📊 Client Excel</button>
          <button style={S.btnPri} onClick={blank}>+ Add Person</button>
        </div>
      </div>

      {draft&&(
        <div style={{...S.card,padding:'16px',marginBottom:'14px',background:'#f0fdf4',border:'1px solid #bbf7d0'}}>
          <div style={{fontWeight:800,fontSize:'14px',color:'#166534',marginBottom:'14px'}}>{draft.id?`Edit — ${draft.full_name}`:'Add Person to Mobilisation'}</div>
          <CandidatePicker candidates={candidates} movedIds={new Set(mobList.filter(m=>m.status==='mobilised').map(m=>m.candidate_id).filter(Boolean))} onSelect={fillFromCandidate} selectedId={draft.candidate_id}/>
          <div style={{fontSize:'11px',fontWeight:800,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Personal Details</div>
          <Grid cols={3}>
            <Field label="Full Name *"><input value={draft.full_name||''} onChange={e=>setDraft(d=>({...d,full_name:e.target.value}))} style={S.input}/></Field>
            <Field label="Designation"><input value={draft.designation||''} onChange={e=>setDraft(d=>({...d,designation:e.target.value}))} style={S.input}/></Field>
            <Field label="Source">
              <select value={draft.source||'supplier'} onChange={e=>setDraft(d=>({...d,source:e.target.value}))} style={S.input}>

                  {r.demobilisation_date?<span>{fmtDate(r.demobilisation_date)}</span>:<span style={{color:'#9ca3af'}}>—</span>}
                </td>
                <td style={{...S.td,paddingTop:'4px',paddingBottom:'4px'}}><StatusBadge status={r.status}/></td>
                <td style={{...S.td,whiteSpace:'nowrap',paddingTop:'4px',paddingBottom:'4px'}}>
                  <span style={{fontSize:'11px',fontWeight:800,cursor:'pointer',color:rd.ready?'#166534':rd.readyForSubmission?'#92400e':'#dc2626'}}
                    onClick={e=>{e.stopPropagation();setReadinessRow(r);}}>
                    {rd.ready?'✅ Ready':rd.readyForSubmission?`⚠ ${rd.missing.length}p`:`❌ ${rd.criticalMissing.length}m`}
                  </span>
                </td>
                <td style={{...S.td,whiteSpace:'nowrap',paddingTop:'2px',paddingBottom:'2px'}}>
                  <div style={{display:'flex',gap:'3px',alignItems:'center'}}>
                    <button style={{...S.btnSm,padding:'3px 7px',fontSize:'11px'}} onClick={e=>{e.stopPropagation();setDraft({...r});setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0);}}>Edit</button>
                    {r.status==='mobilised'&&<button style={{...S.btnSm,padding:'3px 7px',fontSize:'11px',background:'#991b1b',color:'#fff',border:'none'}} onClick={e=>{e.stopPropagation();setDemobRec(r);}}>Demob</button>}
                    {!r.candidate_id&&(()=>{
                      const match=candidates.find(c=>(c.full_name||'').toLowerCase().trim()===(r.full_name||'').toLowerCase().trim());
                      if(!match)return null;
                      return <button style={{...S.btnSm,padding:'3px 7px',fontSize:'10px',background:'#2563eb',color:'#fff',border:'none'}}
                        onClick={async e=>{e.stopPropagation();await db.from('mob_register').update({candidate_id:match.id}).eq('id',r.id);alert('Linked ✓');}}
                        title={`Link to candidate: ${match.full_name}`}>🔗</button>;
                    })()}
                    <button style={{...S.btnSm,padding:'3px 7px',fontSize:'11px',color:'#dc2626',border:'1px solid #fecaca'}}
                      onClick={async e=>{e.stopPropagation();if(!window.confirm(`Delete mob record for "${r.full_name}"?\n\nThis only removes from this portal.`))return;const{error}=await db.from('mob_register').delete().eq('id',r.id);if(error){alert(error.message);return;}onRefresh();}}>Del</button>
                  </div>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
        </div>{/* tbl-box */}
      </div>
    </div>
  );
}
// ── Letters Tab ───────────────────────────────────────────────────────────────
function LettersTab({mobList}) {
  const [letterType,setLetterType] = useState('client');
  const [fCust,setFCust]   = useState('');
  const [fLoc,setFLoc]     = useState('');
  const [search,setSearch] = useState('');
  const [selected,setSelected] = useState(new Set());
  const [subject,setSubject]   = useState('');
  const [arrival,setArrival]   = useState('');
  const [date,setDate]         = useState(todayStr());

  const customers=[...new Set(mobList.map(m=>m.customer_name).filter(Boolean))].sort();
  const locations=[...new Set(mobList.map(m=>m.location).filter(Boolean))].sort();

  const pool = useMemo(()=>{
    const base = letterType==='client'
      ? mobList.filter(m=>m.wp_approved_date&&m.status!=='rejected'&&m.status!=='demobilised')
      : mobList.filter(m=>['mobilised','pending'].includes(m.status));
    return base.filter(m=>{
      if(fCust&&m.customer_name!==fCust)return false;
      if(fLoc&&m.location!==fLoc)return false;
      return matchSearch(m,search);
    });
  },[mobList,letterType,fCust,fLoc,search]);

  const toggle=id=>{const s=new Set(selected);s.has(id)?s.delete(id):s.add(id);setSelected(s);};
  const toggleAll=()=>selected.size===pool.length?setSelected(new Set()):setSelected(new Set(pool.map(r=>r.id)));
  const selRows=pool.filter(r=>selected.has(r.id));

  const generateClientExcel=()=>{
    if(!selRows.length)return alert('Select at least one person');
    const XLSX = window.XLSX;
    if(!XLSX)return alert('SheetJS not loaded — check internet connection and refresh.');

    const wb = XLSX.utils.book_new();

    // ── Sheet 1: Candidate Submission List (PSN format) ──────────────────────
    const hdrs = ['SI No','Company Name','Employee Number','Employee Name','Designation',
      'DOB','Nationality','Emirates ID Number','Emirates ID Validity Date','Visa State',
      'Passport Number','Email ID','Phone Number','Security Pass Expiry','Security Pass No',
      'Adnoc Medical Status'];

    const rows = selRows.map((r,i)=>({
      'SI No': i+1,
      'Company Name': COMPANY_SHORT,
      'Employee Number': r.supplier_emp_no||'',
      'Employee Name': r.full_name||'',
      'Designation': r.designation||'',
      'DOB': r.date_of_birth ? new Date(r.date_of_birth).toLocaleDateString('en-GB') : '',
      'Nationality': r.nationality||'',
      'Emirates ID Number': r.emirates_id||'',
      'Emirates ID Validity Date': r.eid_expiry ? new Date(r.eid_expiry).toLocaleDateString('en-GB') : '',
      'Visa State': r.visa_location||'',
      'Passport Number': r.passport_no||'',
      'Email ID': 'admin@satcoarabiaengg.com',
      'Phone Number': '+971565032032',
      'Security Pass Expiry': r.cicpa_expiry_date ? new Date(r.cicpa_expiry_date).toLocaleDateString('en-GB') : '',
      'Security Pass No': r.cicpa_pass_no||'',
      'Adnoc Medical Status': r.medical_done && r.medical_expiry ? new Date(r.medical_expiry).toLocaleDateString('en-GB') : (r.medical_done ? (r.medical_result||'Fit') : ''),
    }));

    const ws = XLSX.utils.json_to_sheet(rows, {header: hdrs});

    // Column widths (characters)
    ws['!cols'] = [
      {wch:6},{wch:22},{wch:14},{wch:26},{wch:16},
      {wch:12},{wch:14},{wch:22},{wch:18},{wch:14},
      {wch:14},{wch:28},{wch:16},{wch:16},{wch:16},{wch:18}
    ];

    XLSX.utils.book_append_sheet(wb, ws, 'Mob Submission List');

    // ── Sheet 2: Pending Actions ──────────────────────────────────────────────
    const pendingRows = selRows
      .filter(r => !r.emirates_id || !r.passport_no || !r.cicpa_pass_no || !r.medical_done)
      .map(r => {
        const missing = [];
        if(!r.emirates_id)    missing.push('Emirates ID');
        if(!r.eid_expiry)     missing.push('EID Expiry');
        if(!r.passport_no)    missing.push('Passport No');
        if(!r.cicpa_pass_no)  missing.push('CICPA Pass No');
        if(!r.medical_done)   missing.push('Medical');
        return {'Employee Name':r.full_name,'Designation':r.designation||'','Customer':r.customer_name||'','Location':r.location||'','Missing / Action Required':missing.join(', ')};
      });

    if(pendingRows.length){
      const ws2 = XLSX.utils.json_to_sheet(pendingRows);
      ws2['!cols']=[{wch:26},{wch:16},{wch:18},{wch:16},{wch:50}];
      XLSX.utils.book_append_sheet(wb, ws2, 'Pending Actions');
    }

    // ── File name: SATCO_MobList_<Customer>_<Date>.xlsx ─────────────────────
    const custTag = (fCust||'All').replace(/\s+/g,'_');
    const locTag  = (fLoc||'').replace(/\s+/g,'_');
    const fname   = `SATCO_MobList_${custTag}${locTag?'_'+locTag:''}_${todayStr()}.xlsx`;
    XLSX.writeFile(wb, fname);
  };

  const generateLetter=()=>{
    if(!selRows.length)return alert('Select at least one person');
    const dateStr=new Date(date).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
    const clientRows=selRows.map((r,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${COMPANY_SHORT}</td><td style="text-align:center">${r.supplier_emp_no||'—'}</td><td>${r.full_name}</td><td>${r.designation||'—'}</td><td style="text-align:center">${r.date_of_birth?fmtDOB(r.date_of_birth):'—'}</td><td>${r.nationality||'—'}</td><td style="text-align:center;font-family:monospace">${r.emirates_id||'—'}</td></tr>`).join('');
    const campRows=selRows.map((r,i)=>`<tr><td style="text-align:center">${i+1}</td><td style="text-align:center;font-family:monospace">${r.supplier_emp_no||'—'}</td><td>${r.full_name}</td><td>${r.designation||'—'}</td><td>${r.nationality||'—'}</td><td>${COMPANY_SHORT}</td><td>${r.notes||''}</td></tr>`).join('');

    const clientTable=`<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:13px;"><thead style="background:#f0f0f0"><tr><th>S.L.</th><th>Company Name</th><th>Employee Number</th><th>Employee Name</th><th>Designation</th><th>DOB</th><th>Nationality</th><th>Emirates ID Number</th></tr></thead><tbody>${clientRows}</tbody></table>`;
    const campTable=`<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:13px;"><thead style="background:#f0f0f0"><tr><th>S.L.</th><th>Emp. No.</th><th>Name</th><th>Designation</th><th>Nationality</th><th>Company</th><th>Remarks</th></tr></thead><tbody>${campRows}</tbody></table>`;

    const body=letterType==='client'
      ?`<p>Dear Sir,</p><br/><p>Please find the attached complete documents along with CICPA copies of the below-listed personnel.</p><br/>${clientTable}<br/><p>They are ready to mobilize, kindly review &amp; confirm us accordingly.</p>`
      :`<p>Dear Team,</p><br/><p>Please be informed that the below-listed personnel will be arriving at your accommodation ${arrival||'tomorrow'}. Kindly make the necessary arrangements to facilitate their stay.</p><br/>${campTable}<br/><p>Kindly acknowledge receipt of this notification.</p>`;

    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><style>body{font-family:'Times New Roman',serif;margin:60px;color:#00008B;font-size:14px;line-height:1.7;}table{color:#000;}th,td{padding:8px 10px;}@media print{body{margin:30px;}}</style></head><body>
      <p style="text-align:right">${dateStr}</p><br/>
      <p><strong>To:</strong> ${subject||'The Concerned Authority'}</p>
      <p><strong>Ref:</strong> ${fCust||''} ${fLoc?'— '+fLoc:''}</p><br/>
      ${body}
      <div style="margin-top:60px"><p>Yours faithfully,</p><br/><br/><p><strong>Shaik Zaheerudeen, PMP</strong></p><p>CEO &amp; Founder</p><p>${COMPANY_NAME}</p></div>
    </body></html>`;

    const win=window.open('','_blank');
    win.document.write(html); win.document.close();
    setTimeout(()=>win.print(),500);
  };

  return (
    <div>
      <div style={{...S.card,padding:'16px',marginBottom:'16px'}}>
        <div style={{fontWeight:800,fontSize:'14px',color:'#0f172a',marginBottom:'14px'}}>✉️ Generate Letter</div>
        <div style={{display:'flex',gap:'12px',marginBottom:'14px',flexWrap:'wrap'}}>
          {[['client','📋 Client Submission Letter','CICPA/mobilisation — Company: SATCO Arabia, includes DOB & EID'],['camp','🏕️ Camp Arrival Notification','Accommodation team — arrival notification']].map(([k,lbl,sub])=>(
            <div key={k} onClick={()=>{setLetterType(k);setSelected(new Set());}} style={{padding:'12px 18px',borderRadius:'8px',border:`2px solid ${letterType===k?'#0f172a':'#e2e8f0'}`,background:letterType===k?'#0f172a':'#fff',cursor:'pointer',minWidth:'260px'}}>
              <div style={{fontWeight:700,fontSize:'13px',color:letterType===k?'#fff':'#475569'}}>{lbl}</div>
              <div style={{fontSize:'11px',color:letterType===k?'#94a3b8':'#94a3b8',marginTop:'3px'}}>{sub}</div>
            </div>
          ))}
        </div>
        <Grid cols={4}>
          <Field label="Letter Date"><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={S.input}/></Field>
          <Field label="To (addressee / department)"><input value={subject} onChange={e=>setSubject(e.target.value)} placeholder="e.g. ADNOC HSE Department" style={S.input}/></Field>
          {letterType==='camp'&&<Field label="Arrival Wording"><input value={arrival} onChange={e=>setArrival(e.target.value)} placeholder="tomorrow / on 25 Aug 2025" style={S.input}/></Field>}
          <Field label="Filter Customer"><select value={fCust} onChange={e=>setFCust(e.target.value)} style={S.input}><option value="">All</option>{customers.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
          <Field label="Filter Location"><select value={fLoc} onChange={e=>setFLoc(e.target.value)} style={S.input}><option value="">All</option>{locations.map(l=><option key={l} value={l}>{l}</option>)}</select></Field>
        </Grid>
        <div style={{marginBottom:'8px'}}>
          <input placeholder="Search within list…" value={search} onChange={e=>setSearch(e.target.value)} style={{...S.input,width:'260px',marginBottom:'10px'}}/>
        </div>
        <div style={{...S.card,marginBottom:'12px'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{background:'#f8fafc'}}>
              <th style={{...S.th,width:36}}><input type="checkbox" checked={selected.size===pool.length&&pool.length>0} onChange={toggleAll}/></th>
              {['Name','Designation','Supplier Emp No','Customer / Location','WP','CICPA','EID'].map(h=><th key={h} style={S.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {pool.length===0&&<tr><td colSpan={8} style={{padding:'16px',textAlign:'center',color:'#94a3b8',fontSize:'13px'}}>No personnel match the filters.</td></tr>}
              {pool.map(r=><tr key={r.id} className="hr-row" onClick={()=>toggle(r.id)} style={{cursor:'pointer',background:selected.has(r.id)?'#eff6ff':'#fff'}}>
                <td style={{...S.td,textAlign:'center'}}><input type="checkbox" checked={selected.has(r.id)} onChange={()=>toggle(r.id)} onClick={e=>e.stopPropagation()}/></td>
                <td style={{...S.td,fontWeight:700}}>{r.full_name}</td>
                <td style={S.td}>{r.designation||'—'}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'11px'}}>{r.supplier_emp_no||'—'}</td>
                <td style={S.td}>{r.customer_name} / {r.location}</td>
                <td style={S.td}>{r.wp_approved_date?<span style={{color:'#166534',fontWeight:700,fontSize:'11px'}}>✓</span>:'—'}</td>
                <td style={S.td}>{r.cicpa_pass_no?<span style={{color:'#166534',fontSize:'11px',fontWeight:700}}>✓ {r.cicpa_pass_no}</span>:'—'}</td>
                <td style={{...S.td,fontFamily:'monospace',fontSize:'11px'}}>{r.emirates_id||'—'}</td>
              </tr>)}
            </tbody>
          </table>
        </div>
        <div style={{display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap'}}>
          <button style={S.btnPri} onClick={generateLetter}>🖨️ Generate & Print ({selRows.length} selected)</button>
          <button style={{...S.btnGold,background:'#166534',color:'#fff',fontWeight:700}} onClick={generateClientExcel}>📊 Export Excel ({selRows.length} selected)</button>
          <span style={{fontSize:'12px',color:'#64748b'}}>Excel matches client format — SI No, EID, Visa State, Passport, Medical, CICPA. Email: admin@satcoarabiaengg.com</span>
        </div>
      </div>
    </div>
  );
}

          <thead><tr>{['Location','Required Trainings','Updated',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {locConfigs.length===0&&<tr><td colSpan={4} style={{padding:'16px',textAlign:'center',color:'#94a3b8'}}>No location configs yet.</td></tr>}
            {locConfigs.map(l=><tr key={l.id} className="hr-row">
              <td style={{...S.td,fontWeight:700}}>{l.location}</td>
              <td style={S.td}>{(l.trainings||[]).map((t,i)=><span key={i} style={{display:'inline-block',background:'#eff6ff',color:'#1e40af',fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:10,marginRight:'4px',marginBottom:'3px'}}>{t.name}</span>)}</td>
              <td style={{...S.td,fontSize:'11px',color:'#94a3b8'}}>{fmtDate(l.updated_at)}</td>
              <td style={S.td}><button style={S.btnSm} onClick={()=>setLocDraft({...l,_lines:(l.trainings||[]).map(t=>t.name).join('\n')})}>Edit</button></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}
// ── Setup SQL Screen ──────────────────────────────────────────────────────────
function SetupScreen({onRetry}) {
  const [copied,setCopied]=useState(false);
  return (
    <div style={{padding:'32px',maxWidth:'900px',margin:'0 auto'}}>
      <div style={{fontWeight:800,fontSize:'18px',color:'#0f172a',marginBottom:'6px'}}>🏗️ One-time Setup Required</div>
      <div style={{fontSize:'13px',color:'#64748b',marginBottom:'16px'}}>Run this SQL once in <strong>Supabase → SQL Editor</strong> (project: oaerqjrkdpuhiproppaz), then click Check Again.</div>
      <div style={{display:'flex',gap:'10px',marginBottom:'12px'}}>
        <button onClick={()=>{navigator.clipboard.writeText(ALL_SQL);setCopied(true);setTimeout(()=>setCopied(false),2000);}} style={S.btnGold}>{copied?'✓ Copied!':'Copy SQL'}</button>
        <button onClick={onRetry} style={S.btnPri}>Check Again</button>
      </div>
      <pre style={{background:'#1e293b',color:'#f8fafc',padding:'16px',borderRadius:'8px',fontSize:'11px',overflowX:'auto',whiteSpace:'pre',maxHeight:'500px',overflowY:'auto'}}>{ALL_SQL}</pre>
    </div>
  );
}

// ── Login Screen ──────────────────────────────────────────────────────────────
function LoginScreen({onLogin}) {
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const submit=async()=>{
    setErr('');setLoading(true);
    const{error}=await db.auth.signInWithPassword({email,password:pass});
    if(error)setErr(error.message);else onLogin();
    setLoading(false);
  };
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)'}}>
      <div style={{background:'#fff',borderRadius:'12px',padding:'40px',width:'360px',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{textAlign:'center',marginBottom:'28px'}}>
          <div style={{fontSize:'11px',fontWeight:800,color:'#b8972a',letterSpacing:'3px',textTransform:'uppercase',marginBottom:'4px'}}>SATCO Arabia</div>
          <div style={{fontSize:'22px',fontWeight:800,color:'#0f172a'}}>Mobilisation Portal</div>
          <div style={{fontSize:'12px',color:'#64748b',marginTop:'4px'}}>CICPA · Work Permit · Personnel Deployment</div>
        </div>
        <div style={{marginBottom:'14px'}}><label style={S.label}>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} type="email" style={S.input} autoFocus/></div>
        <div style={{marginBottom:'20px'}}><label style={S.label}>Password</label><input value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} type="password" style={S.input}/></div>
        {err&&<div style={{background:'#fee2e2',color:'#991b1b',padding:'8px 10px',borderRadius:'6px',fontSize:'12px',marginBottom:'14px'}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{...S.btnPri,width:'100%',padding:'10px'}}>{loading?'Signing in…':'Sign In'}</button>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  useDragScroll(); // global drag-to-scroll for all .drag-scroll and .tbl-box elements
  const [session,      setSession]      = useState(null);
  const [authReady,    setAuthReady]    = useState(false);
  const [tab,          setTab]          = useState('dashboard');
  const [tableReady,   setTableReady]   = useState(null);
  const [loading,      setLoading]      = useState(true);
  const [filterStatus, setFilterStatus] = useState('');
  const [globalSearch, setGlobalSearch] = useState('');
  const [tabSearch,    setTabSearch]    = useState('');

  const [data, setData] = useState({candidates:[],suppliers:[],requirements:[],loaList:[],mobList:[],locConfigs:[]});
  const [hrMobActive, setHrMobActive] = useState(new Set()); // SATCO employee IDs currently on site per HR portal

  // Load HR portal mob_demob active records at app level
  // mob_demob.employee_id is the HR employee_number (e.g. "SA1015") stored as supplier_emp_no in mob_candidates
  useEffect(()=>{
    db.from('mob_demob').select('employee_id').is('demobilization_date',null).is('deleted_at',null)
      .then(({data:rows})=>{
        const ids = new Set();
        (rows||[]).forEach(r=>{ if(r.employee_id) ids.add(String(r.employee_id)); });
        setHrMobActive(ids);
      });
  },[]);

  // Warn browser tab close if unsaved draft exists
  useEffect(()=>{
    const handler = e => {
      if (localStorage.getItem('satco_mob_draft_candidate') || localStorage.getItem('satco_mob_draft_mobilisation')) {
        e.preventDefault(); e.returnValue = 'You have an unsaved form. Are you sure you want to leave?';
      }
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, []);

  useEffect(()=>{
    db.auth.getSession().then(({data})=>{setSession(data.session);setAuthReady(true);});
    const{data:l}=db.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>l.subscription.unsubscribe();
  },[]);

  const loadAll = useCallback(async()=>{
    setLoading(true);
    try {
      const[supp,cand,req,loa,mob,loc]=await Promise.all([
        db.from('mob_suppliers').select('*').order('name'),
        db.from('mob_candidates').select('*').order('full_name'),
        db.from('mob_requirements').select('*').order('created_at',{ascending:false}),
        db.from('mob_loa').select('*').order('loa_date',{ascending:false}),
        db.from('mob_register').select('*').order('created_at',{ascending:false}),
        db.from('mob_location_config').select('*').order('location'),
      ]);
      if(cand.error?.code==='42P01'){setTableReady(false);setLoading(false);return;}
      setTableReady(true);
      setData({suppliers:supp.data||[],candidates:cand.data||[],requirements:req.data||[],loaList:loa.data||[],mobList:mob.data||[],locConfigs:loc.data||[]});
    } catch(e){console.error(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{if(session)loadAll();},[session,loadAll]);

  const loaUsed = useMemo(()=>{
    const m={};
    data.mobList.forEach(r=>{if(r.loa_id&&r.status!=='demobilised')m[r.loa_id]=(m[r.loa_id]||0)+1;});
    return m;
  },[data.mobList]);

  // Global search results — search both candidates and mob records
  const searchResults = useMemo(()=>{
    if(!globalSearch.trim())return[];
    const q=globalSearch.trim().toLowerCase();
    const cands=data.candidates.filter(c=>matchSearch(c,q)).slice(0,8).map(c=>({...c,_type:'candidate'}));
    const mobs=data.mobList.filter(m=>matchSearch(m,q)).slice(0,8).map(m=>({...m,_type:'mob'}));
    return [...cands,...mobs].slice(0,12);
  },[globalSearch,data.candidates,data.mobList]);

  const onSearchSelect = result => {
    setGlobalSearch('');
    if(result._type==='candidate'){setTabSearch(result.full_name);setTab('candidates');}
    else{setTabSearch(result.full_name);setTab('mobilisation');}
  };

  const onSave = async(type,draft,onDone)=>{
    const tableMap={candidates:'mob_candidates',suppliers:'mob_suppliers',requirements:'mob_requirements',loa:'mob_loa',mob:'mob_register',locconfig:'mob_location_config'};
    const table=tableMap[type];
    const hasUpdatedAt = ['mob_candidates','mob_register','mob_location_config'].includes(table);
    const clean={...draft};
    if(hasUpdatedAt) clean.updated_at=new Date().toISOString();
    // Strip internal UI state fields (anything starting with _)
    Object.keys(clean).forEach(k=>{ if(k.startsWith('_')) delete clean[k]; });
    // Convert empty strings to null — Postgres rejects "" for date/uuid/numeric columns
    Object.keys(clean).forEach(k=>{ if(clean[k]==='') clean[k]=null; });
    const{error}=draft.id
      ?await db.from(table).update(clean).eq('id',draft.id)
      :await db.from(table).insert(clean);
    if(error){alert(error.message);return;}
    await loadAll();
    onDone?.();
  };

  // Delete handler — only affects mob_candidates in this portal, never touches HR or Finance
  const onDelete = async(type, record) => {
    if (type === 'candidates') {
      // Only block if they have an active (mobilised) record in THIS portal's mob_register
      const hasActiveMob = data.mobList.some(m => m.candidate_id === record.id && m.status === 'mobilised');
      if (hasActiveMob) {
        alert(`Cannot delete "${record.full_name}" — they are currently mobilised on site. Demobilise them first.`);
        return;
      }
      if (!window.confirm(`Delete "${record.full_name}" (${record.supplier_emp_no||'no EMP no'}) from the Mobilisation candidates pool?\n\nThis only removes them from this portal — HR records are not affected.`)) return;
      const { error } = await db.from('mob_candidates').delete().eq('id', record.id);
      if (error) { alert(error.message); return; }
      await loadAll();
    }
  };

  // Demob handler — updates status + demob fields
  const onDemob = async(id, form) => {
    const{error}=await db.from('mob_register').update({
      status:'demobilised',
      demobilisation_date: form.demobilisation_date,
      demob_reason: form.demob_reason,
      demob_remarks: form.demob_remarks,
      wp_action_on_demob: form.wp_action_on_demob,
      cicpa_returned: form.cicpa_returned,
      updated_at: new Date().toISOString(),
    }).eq('id',id);
    if(error){alert(error.message);return;}
    await loadAll();
  };

  const handleMobilise = candidate => {
    sessionStorage.setItem('satco_mob_prefill', JSON.stringify({
      candidate_id:candidate.id, full_name:candidate.full_name,
      designation:candidate.designation, source:candidate.source||'supplier',
      supplier_name:candidate.supplier_name, supplier_emp_no:candidate.supplier_emp_no,
      nationality:candidate.nationality, date_of_birth:candidate.date_of_birth,
      passport_no:candidate.passport_no, passport_expiry:candidate.passport_expiry||'',
      emirates_id:candidate.emirates_id, eid_expiry:candidate.eid_expiry||'',
      visa_no:candidate.visa_no, visa_type:candidate.visa_type||'', visa_location:candidate.visa_location, visa_expiry:candidate.visa_expiry||'',
      phone:candidate.phone||'',
      customer_name:'',location:'',loa_id:'',
      medical_done:false,hse_passport_done:false,h2s_done:false,extra_trainings:[],status:'pending',notes:'',
    }));
    setTab('mobilisation');
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),150);
  };

  if(!authReady)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#64748b'}}>Loading…</div>;
  if(!session)return<LoginScreen onLogin={()=>db.auth.getSession().then(({data})=>setSession(data.session))}/>;
  if(tableReady===false)return<><TopNav tab={tab} setTab={setTab} onSignOut={()=>db.auth.signOut()} globalSearch={globalSearch} setGlobalSearch={setGlobalSearch} searchResults={[]} onSearchSelect={()=>{}}/><SetupScreen onRetry={loadAll}/></>;

  return (
    <div style={S.page}>
      <TopNav tab={tab} setTab={t=>{setTab(t);setTabSearch('');}} onSignOut={()=>db.auth.signOut()} globalSearch={globalSearch} setGlobalSearch={setGlobalSearch} searchResults={searchResults} onSearchSelect={onSearchSelect}/>
      <div style={S.wrap}>
        <div style={{paddingTop:'20px'}}>
          <LoaBanner loaList={data.loaList} usedMap={loaUsed} onManage={()=>setTab('loa')}/>
          {loading&&tableReady===null&&<div style={{padding:'40px',textAlign:'center',color:'#94a3b8'}}>Loading…</div>}
          {!loading&&tableReady&&<>
            {tab==='dashboard'    &&<Dashboard data={data} loaUsed={loaUsed} setTab={t=>{setTab(t);}} setFilterStatus={setFilterStatus} hrMobActive={hrMobActive}/>}
            {tab==='candidates'   &&<CandidatesTab candidates={data.candidates} mobList={data.mobList} onSave={onSave} onDelete={onDelete} onMobilise={handleMobilise} tabSearch={tabSearch} hrMobActive={hrMobActive}/>}
            {tab==='requirements' &&<RequirementsTab requirements={data.requirements} onSave={onSave}/>}
            {tab==='loa'          &&<LoaTab loaList={data.loaList} usedMap={loaUsed} onSave={onSave}/>}
            {tab==='mobilisation' &&<MobilisationTab mobList={data.mobList} candidates={data.candidates} loaList={data.loaList} requirements={data.requirements} usedMap={loaUsed} locConfigs={data.locConfigs} onSave={onSave} onDemob={onDemob} onRefresh={loadAll} initialStatus={filterStatus} tabSearch={tabSearch}/>}
            {tab==='letters'      &&<LettersTab mobList={data.mobList}/>}
            {tab==='config'       &&<ConfigTab locConfigs={data.locConfigs} suppliers={data.suppliers} onSave={onSave}/>}
          </>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
