<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document Vault</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg1: #0b0f1e; --bg2: #141a2e; --card: #161d33; --card2: #1b2340;
    --border: #2a3358; --text: #e7ebf7; --muted: #9aa4c7; --accent: #6d7bff;
    --accent2: #a78bfa; --danger: #f0596a; --ok: #4ade80; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1b2450 0%, var(--bg1) 45%), var(--bg1);
    color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  .narrow { max-width: 720px; margin: 0 auto; }
  .dash-layout { display: flex; gap: 20px; align-items: flex-start; }
  .sidebar { width: 340px; flex-shrink: 0; background: #0f1428; border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .sidebar-title { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .folder-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 4px; }
  .folder-item:hover { background: var(--card2); }
  .folder-item.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
  .folder-item .label { flex: 1; min-width: 0; white-space: normal; word-break: break-word; line-height: 1.35; padding-top: 1px; }
  .folder-item .count-wrap { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding-top: 1px; }
  .folder-item .count { font-size: 12px; opacity: .85; }
  .folder-item .del-folder, .folder-item .edit-folder { opacity: 0; background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .folder-item .del-folder { color: var(--danger); }
  .folder-item .edit-folder { color: var(--muted); }
  .folder-item .edit-folder:hover { color: var(--text); }
  .folder-item:hover .del-folder, .folder-item:hover .edit-folder { opacity: 1; }
  .new-folder-btn { width: 100%; margin-top: 6px; }
  @media (max-width: 760px) {
    .wrap { padding: 18px 14px 40px; }
    .dash-layout { flex-direction: column; }
    .sidebar { width: 100%; padding: 12px; }
    .sidebar-title { display: none; }
    .sidebar > div:not(.sidebar-title) { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
    .folder-item { margin-bottom: 0; flex-shrink: 0; }
    .folder-item .label { max-width: 160px; }
    .folder-item .del-folder, .folder-item .edit-folder { opacity: 1; }
    .new-folder-btn { flex-shrink: 0; width: auto; margin-top: 0; white-space: nowrap; }
    h1 { font-size: 24px; }
    table.doc-table { min-width: 720px; }
  }
  .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-bar input[type=text] { flex: 1; min-width: 180px; }
  .filter-bar select { width: auto; min-width: 140px; }
  .doc-count { color: var(--muted); font-size: 13px; }
  .table-scroll { overflow-x: auto; }
  table.doc-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 880px; }
  table.doc-table th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.doc-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  table.doc-table select.type-select { width: auto; padding: 6px 8px; font-size: 12px; }
  .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; line-height: 1.6; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(5,8,20,.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-card { background: linear-gradient(180deg, var(--card), var(--bg2)); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; }
  table.doc-table tbody tr { cursor: pointer; }
  table.doc-table tbody tr:hover { background: #131a35; }
  header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
  h1 { font-size: 30px; margin: 0; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
  .navbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; }
  .btn { background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; transition: .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: rgba(240,89,106,.4); }
  .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .card { background: linear-gradient(180deg, var(--card), var(--bg2)); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .banner { display: flex; align-items: center; gap: 10px; background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; font-size: 15px; }
  .banner b { color: var(--accent2); }
  .banner .muted { color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  input[type=text], input[type=password], input[type=email], input[type=date], select, textarea {
    width: 100%; background: #0f1428; border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 12px; font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 14px; }
  .dropzone {
    border: 2px dashed var(--border); border-radius: 14px; padding: 48px 20px; text-align: center;
    cursor: pointer; transition: .15s; background: #0f1428;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: #131a35; }
  .dropzone .big { font-weight: 700; font-size: 16px; margin-top: 8px; }
  .dropzone .small { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .progress { height: 6px; background: #0f1428; border-radius: 4px; overflow: hidden; margin: 14px 0; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
  .status-line { font-size: 13px; color: var(--muted); text-align: center; }
  .doc-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: #0f1428; }
  .doc-row .icon { font-size: 22px; width: 34px; text-align: center; }
  .doc-row .info { flex: 1; min-width: 0; }
  .doc-row .info .name { font-weight: 700; font-size: 14px; }
  .doc-row .info .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: rgba(74,222,128,.15); color: var(--ok); }
  .badge.warn { background: rgba(251,191,36,.15); color: var(--warn); }
  .badge.danger { background: rgba(240,89,106,.15); color: var(--danger); }
  .badge.muted { background: rgba(154,164,199,.15); color: var(--muted); }
  .row-actions { display: flex; gap: 6px; align-items: center; }
  .iconbtn { background: transparent; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--muted); }
  .iconbtn:hover { color: var(--text); border-color: var(--accent); }
  .iconbtn.on { color: var(--ok); border-color: rgba(74,222,128,.4); }
  .iconbtn.off { color: var(--muted); }
  .lock-wrap { max-width: 380px; margin: 90px auto; text-align: center; }
  .lock-wrap .icon { font-size: 40px; }
  .lock-wrap .card { text-align: left; margin-top: 20px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .tag { display: flex; align-items: center; gap: 6px; background: var(--card2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13px; }
  .tag button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  .empty { text-align: center; padding: 40px 0; color: var(--muted); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--accent); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 50; }
  .section-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .section-sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  a { color: var(--accent2); }
</style>
</head>
<body>
<div id="app"></div>

<script>
const VAULT_API = "https://osmvxasbmgtnspjcyenb.supabase.co/functions/v1/vault-api";
const CLAUDE_API = "https://osmvxasbmgtnspjcyenb.supabase.co/functions/v1/claude";

const TYPE_ICON = { "Passport": "🛂", "Emirates ID": "🪪", "Driving License": "🚗", "Visa": "📋", "Other": "📎" };
const DOC_TYPES = ["Passport", "Emirates ID", "Driving License", "Visa", "Other"];
const DEFAULT_REMINDER_DAYS = { "Passport": [90,30,7], "Emirates ID": [90,30,7], "Driving License": [90,30,7], "Visa": [90,30,7], "Other": [90,30,7] };

// Returns the standard types plus any custom type names already saved on documents (e.g. "Insurance Policy"),
// so filters and quick-edit dropdowns display custom types correctly instead of silently mismatching.
function typeOptionsList() {
  const extra = [...new Set(state.documents.map(d => d.type).filter(t => t && !DOC_TYPES.includes(t)))].sort();
  return [...DOC_TYPES, ...extra];
}

let state = {
  pin: sessionStorage.getItem("dv_pin") || "",
  tab: "dashboard",
  documents: [],
  folders: [],
  documentDates: [],
  settings: null,
  loading: false,
  toast: null,
  upload: { file: null, status: "", progress: 0, extracted: null, busy: false },
  folderFilter: "all",
  search: "",
  typeFilter: "",
  statusFilter: "",
};

function toast(msg) { state.toast = msg; render(); setTimeout(() => { state.toast = null; render(); }, 3000); }

async function api(action, payload) {
  const res = await fetch(VAULT_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin: state.pin, action, payload }),
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || "Request failed");
  return data;
}

async function loadAll() {
  state.loading = true; render();
  try {
    const [list, settingsRes] = await Promise.all([api("list"), api("get_settings")]);
    state.documents = list.documents || [];
    state.folders = list.folders || [];
    state.documentDates = list.document_dates || [];
    state.settings = settingsRes.settings;
  } catch (e) {
    toast("Couldn't load vault: " + e.message);
  }
  state.loading = false; render();
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

// For a recurring-annual extra date, only the stored month/day matter -- this returns the
// next upcoming occurrence (this year, or next year if this year's has passed) so a single
// row like "28 Nov" keeps working every year without ever being re-added.
function nextAnnualOccurrence(dateStr) {
  const stored = new Date(dateStr + "T00:00:00");
  const month = stored.getMonth(), day = stored.getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  let year = today.getFullYear();
  let candidate = new Date(year, month, day);
  if (candidate < today) candidate = new Date(year + 1, month, day);
  const mm = String(candidate.getMonth() + 1).padStart(2, "0");
  const dd = String(candidate.getDate()).padStart(2, "0");
  return `${candidate.getFullYear()}-${mm}-${dd}`;
}
function effectiveDateStr(x) { return x.recurring_annual ? nextAnnualOccurrence(x.date) : x.date; }

function statusBadge(days) {
  if (days < 0) return `<span class="badge danger">EXPIRED ${Math.abs(days)}d ago</span>`;
  if (days === 0) return `<span class="badge danger">Expires today</span>`;
  if (days <= 30) return `<span class="badge warn">${days}d left</span>`;
  return `<span class="badge ok">${days}d left</span>`;
}

function statusOf(days) {
  if (days < 0) return "expired";
  if (days <= 30) return "expiring";
  return "valid";
}
function statusLabel(days) {
  if (days < 0) return `<span class="badge danger">Expired</span>`;
  if (days <= 30) return `<span class="badge warn">Expiring</span>`;
  return `<span class="badge ok">Valid</span>`;
}

function extToMime(mime) {
  if (mime === "application/pdf") return "pdf";
  if (mime && mime.includes("png")) return "png";
  return "jpg";
}

// File bytes are no longer included in the initial "list" load (they made the vault slow to
// open — 34MB+ across a real vault). We fetch a document's file_data_url on demand the first
// time it's viewed/downloaded, then cache it on the in-memory doc object for subsequent clicks.
async function ensureFileData(d) {
  if (!d) return null;
  if (d.file_data_url) return d.file_data_url;
  try {
    const res = await api("get_file", { id: d.id });
    d.file_data_url = res.file_data_url;
    return d.file_data_url;
  } catch (e) {
    toast("Couldn't load file: " + e.message);
    return null;
  }
}

async function viewFile(d) {
  if (!d) return;
  toast("Loading file…");
  const dataUrl = await ensureFileData(d);
  if (!dataUrl) { toast("No file stored for this document."); return; }
  fetch(dataUrl).then(r => r.blob()).then(blob => {
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }).catch(() => toast("Couldn't open file."));
}

async function downloadFile(d) {
  if (!d) return;
  toast("Loading file…");
  const dataUrl = await ensureFileData(d);
  if (!dataUrl) { toast("No file stored for this document."); return; }
  fetch(dataUrl).then(r => r.blob()).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${(d.name || d.type || "document").replace(/\s+/g, "_")}.${extToMime(d.mime)}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }).catch(() => toast("Couldn't download file."));
}

function addToCalendar(d) {
  if (!d || !d.expiry_date) return;
  const dt = d.expiry_date.replace(/-/g, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Document Vault//EN", "BEGIN:VEVENT",
    `UID:${d.id}@document-vault`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `SUMMARY:${d.type} expires — ${d.name || ""}`,
    `DESCRIPTION:${d.type} ${d.number || ""} expires on ${d.expiry_date}.`,
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${(d.name || d.type || "document").replace(/\s+/g, "_")}_expiry.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ---------- Extraction (Claude AI) ----------

// Image compressor — keeps payload under proxy limit
function compressImage(file) {
  return new Promise(resolve => {
    const MAX = 1400, Q = 0.78;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => resolve(b ? new File([b], file.name.replace(/\.[^.]+$/, ".jpg"), { type: "image/jpeg" }) : file), "image/jpeg", Q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

// Detect real MIME from magic bytes
async function detectMime(file) {
  const hdr = await new Promise(res => { const r = new FileReader(); r.onload = e => res(new Uint8Array(e.target.result)); r.readAsArrayBuffer(file.slice(0, 8)); });
  if (hdr[0] === 0x25 && hdr[1] === 0x50 && hdr[2] === 0x44 && hdr[3] === 0x46) return "application/pdf";
  if (hdr[0] === 0xFF && hdr[1] === 0xD8) return "image/jpeg";
  if (hdr[0] === 0x89 && hdr[1] === 0x50 && hdr[2] === 0x4E && hdr[3] === 0x47) return "image/png";
  const ext = (file.name || "").split(".").pop().toLowerCase();
  if (ext === "pdf") return "application/pdf";
  if (ext === "jpg" || ext === "jpeg") return "image/jpeg";
  if (ext === "png") return "image/png";
  return file.type || "image/jpeg";
}

// Rasterise page 1 of a PDF → JPEG (avoids sending large PDF bytes)
async function pdfToJpeg(file) {
  if (!window.pdfjsLib) throw new Error("PDF.js not loaded");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  const page = await pdf.getPage(1);
  const vp0 = page.getViewport({ scale: 1 });
  const scale = Math.min(1400 / Math.max(vp0.width, vp0.height), 2);
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  return new Promise((res, rej) => canvas.toBlob(b => b ? res(new File([b], file.name.replace(/\.pdf$/i, "_p1.jpg"), { type: "image/jpeg" })) : rej(new Error("Raster failed")), "image/jpeg", 0.82));
}

function fileToB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = () => rej(new Error("Read failed")); r.readAsDataURL(file); });
}

async function prepareForAI(file) {
  const mime = await detectMime(file);
  if (mime === "application/pdf") {
    const jpeg = await pdfToJpeg(file);
    return { b64: await fileToB64(jpeg), mimeType: "image/jpeg" };
  }
  const compressed = await compressImage(file);
  const safeType = ["image/jpeg", "image/png", "image/gif", "image/webp"].includes(mime) ? mime : "image/jpeg";
  return { b64: await fileToB64(compressed), mimeType: safeType };
}

async function extractFromFile(file, onProgress) {
  onProgress("Preparing file for AI…", 10);
  const { b64, mimeType } = await prepareForAI(file);
  onProgress("Sending to AI…", 30);

  const prompt = `You are reading an official UAE identity or travel document: passport, Emirates ID, driving licence, visa, residence permit, or similar.

CRITICAL NAME RULE — for passports: extract the holder's name from the MRZ (bottom two lines) or the photo page. Do NOT use names from "Name of Father", "Name of Mother", or "Name of Spouse" fields — those are family members, not the holder.

Return ONLY a valid JSON object, no markdown, no backticks:
{
  "type": "Passport|Emirates ID|Driving License|Visa|Other",
  "name": "full name of the document HOLDER only",
  "number": "document number, EID number, or passport number",
  "nationality": "nationality shown",
  "issue_date": "YYYY-MM-DD or empty string",
  "expiry_date": "YYYY-MM-DD — read this carefully from the Expiry/Valid Until field, this is the most important field"
}`;

  const res = await fetch(CLAUDE_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: 500,
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: mimeType, data: b64 } },
        { type: "text", text: prompt }
      ]}]
    })
  });

  onProgress("Parsing AI response…", 85);

  if (!res.ok) {
    let msg = `AI API error ${res.status}`;
    try { const e = await res.json(); msg += ": " + (e?.error?.message || JSON.stringify(e)); } catch {}
    throw new Error(msg);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

  const text = (data.content || []).map(c => c.text || "").join("").trim();
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error("AI returned no JSON. Response: " + text.slice(0, 200));
  const fields = JSON.parse(match[0]);

  onProgress("Done", 100);
  // rawText kept for compatibility; we pass the AI JSON summary
  return { text: JSON.stringify(fields), fields };
}

// ---- dead code kept as stubs so nothing below breaks ----
function normalizeDate(raw) {
  if (!raw) return "";
  raw = raw.trim();
  let m;
  if ((m = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return raw;
  if ((m = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) {
    const [, d, mo, y] = m; return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  const months = {jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
  if ((m = raw.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?\s+(\d{4})$/))) {
    const mo = months[m[2].slice(0,3).toLowerCase()];
    if (mo) return `${m[3]}-${mo}-${m[1].padStart(2,"0")}`;
  }
  if ((m = raw.match(/^([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{4})$/))) {
    const mo = months[m[1].slice(0,3).toLowerCase()];
    if (mo) return `${m[3]}-${mo}-${m[2].padStart(2,"0")}`;
  }
  return "";
}

function findDates(text) {
  const patterns = [
    /\b\d{4}-\d{2}-\d{2}\b/g,
    /\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{4}\b/g,
    /\b\d{1,2}\s+[A-Za-z]{3,9}\.?\s+\d{4}\b/g,
    /\b[A-Za-z]{3,9}\s+\d{1,2},?\s+\d{4}\b/g,
  ];
  let found = [];
  for (const p of patterns) {
    const matches = text.match(p) || [];
    for (const raw of matches) {
      const iso = normalizeDate(raw);
      if (iso) found.push({ raw, iso, index: text.indexOf(raw) });
    }
  }
  found.sort((a, b) => a.index - b.index);
  return found;
}

function labelNear(text, labels, dates) {
  const lower = text.toLowerCase();
  for (const label of labels) {
    const idx = lower.indexOf(label);
    if (idx === -1) continue;
    let best = null, bestDist = Infinity;
    for (const d of dates) {
      const dist = Math.abs(d.index - idx);
      if (d.index >= idx - 5 && dist < bestDist) { best = d; bestDist = dist; }
    }
    if (best) return best.iso;
  }
  return "";
}

function detectType(text) {
  const t = text.toUpperCase();
  if (t.includes("PASSPORT")) return "Passport";
  if (/784[\s-]?\d{4}[\s-]?\d{7}[\s-]?\d/.test(t) || t.includes("EMIRATES ID") || t.includes("IDENTITY CARD") || t.includes("RESIDENT IDENTITY")) return "Emirates ID";
  if (t.includes("DRIVING LICEN")) return "Driving License";
  if (t.includes("VISA") || t.includes("RESIDENCE PERMIT") || t.includes("ENTRY PERMIT")) return "Visa";
  return "Other";
}

function parseMRZ(text) {
  const lines = text.split(/\n/).map(l => l.replace(/[^A-Z0-9<]/gi, "").toUpperCase()).filter(l => l.length >= 30);
  for (let i = 0; i < lines.length - 1; i++) {
    const l1 = lines[i], l2 = lines[i + 1];
    if (l1.startsWith("P<") && l2.length >= 28) {
      const namePart = l1.slice(5).split("<<");
      const surname = (namePart[0] || "").replace(/</g, " ").trim();
      const given = (namePart[1] || "").replace(/</g, " ").trim();
      const number = l2.slice(0, 9).replace(/</g, "").trim();
      const nationality = l2.slice(10, 13).replace(/</g, "").trim();
      const dob = l2.slice(13, 19);
      const expiry = l2.slice(21, 27);
      const toIso = (yymmdd) => {
        if (!/^\d{6}$/.test(yymmdd)) return "";
        const yy = parseInt(yymmdd.slice(0,2), 10);
        const year = yy > 30 ? 1900 + yy : 2000 + yy;
        return `${year}-${yymmdd.slice(2,4)}-${yymmdd.slice(4,6)}`;
      };
      return {
        name: [given, surname].filter(Boolean).join(" ").trim(),
        number, nationality,
        expiry_date: toIso(expiry),
      };
    }
  }
  return null;
}

function extractFields(text) {
  const mrz = parseMRZ(text);
  const type = detectType(text);
  const dates = findDates(text);
  let expiry = labelNear(text, ["date of expiry", "expiry date", "expiration date", "valid until", "valid thru", "exp:", "exp.", "expiry"], dates);
  let issue = labelNear(text, ["date of issue", "issue date", "issued on", "issued:"], dates);
  if (!expiry && dates.length) expiry = dates[dates.length - 1].iso;
  if (!issue && dates.length > 1) issue = dates[0].iso;

  let number = "";
  const eidMatch = text.match(/784[\s-]?\d{4}[\s-]?\d{7}[\s-]?\d/);
  if (eidMatch) number = eidMatch[0].replace(/\s/g, "");
  if (!number) {
    const passMatch = text.match(/\b[A-Z][0-9]{7,8}\b/);
    if (passMatch) number = passMatch[0];
  }

  let name = "";
  const nameMatch = text.match(/name[:\s]+([A-Za-z .'-]{3,60})/i);
  if (nameMatch) name = nameMatch[1].trim();

  let nationality = "";
  const natMatch = text.match(/nationality[:\s]+([A-Za-z .'-]{3,40})/i);
  if (natMatch) nationality = natMatch[1].trim();

  const result = {
    type,
    name: (mrz && mrz.name) || name || "",
    number: (mrz && mrz.number) || number || "",
    nationality: (mrz && mrz.nationality) || nationality || "",
    issue_date: issue || "",
    expiry_date: (mrz && mrz.expiry_date) || expiry || "",
  };
  return result;
}



function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ---------- Rendering ----------

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function render() {
  const root = document.getElementById("app");
  if (!state.pin) { root.innerHTML = ""; root.appendChild(renderLock()); return; }
  root.innerHTML = "";
  root.appendChild(renderShell());
  if (state.toast) root.appendChild(el(`<div class="toast">${state.toast}</div>`));
}

function renderLock() {
  const wrap = el(`
    <div class="lock-wrap">
      <div class="icon">🔒</div>
      <h1><span>Document</span> Vault</h1>
      <p style="color:var(--muted)">Enter your PIN to unlock your vault.</p>
      <div class="card">
        <div class="field">
          <label>Vault PIN</label>
          <input type="password" id="pin-input" placeholder="Enter your PIN (min 4 characters)" />
        </div>
        <button class="btn active" id="unlock-btn" style="width:100%">Unlock Vault</button>
        <p class="hint">Use the same PIN you already use in your Document Vault app — your existing documents will load automatically. New PINs start a fresh, empty vault.</p>
      </div>
    </div>
  `);
  const input = wrap.querySelector("#pin-input");
  const doUnlock = async () => {
    const val = input.value.trim();
    if (val.replace(/\s+/g,"").length < 4) { toast("PIN must be at least 4 characters."); render(); return; }
    state.pin = val;
    sessionStorage.setItem("dv_pin", val);
    render();
    await loadAll();
  };
  wrap.querySelector("#unlock-btn").addEventListener("click", doUnlock);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") doUnlock(); });
  setTimeout(() => input.focus(), 50);
  return wrap;
}

function renderShell() {
  const shell = el(`<div class="wrap"></div>`);
  shell.appendChild(el(`
    <header>
      <div>
        <h1>📁 <span>Document</span> Vault</h1>
        <p>Upload passports, Emirates IDs, driving licenses & more — real on-device extraction reads them, tracks expiry, and reminds you.</p>
      </div>
      <div class="navbtns">
        <button class="btn ghost" id="lock-btn">🔒 Lock vault</button>
        <button class="btn ${state.tab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button>
        <button class="btn ${state.tab==='upload'?'active':''}" data-tab="upload">Upload</button>
        <button class="btn ${state.tab==='settings'?'active':''}" data-tab="settings">Alert Settings</button>
      </div>
    </header>
  `));
  shell.querySelector("#lock-btn").addEventListener("click", () => {
    state.pin = ""; sessionStorage.removeItem("dv_pin"); state.documents = []; state.folders = []; render();
  });
  shell.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => { state.tab = btn.dataset.tab; render(); }));

  if (state.loading) {
    shell.appendChild(el(`<div class="card empty">Loading your vault…</div>`));
    return shell;
  }

  const nextUpCandidates = [
    ...state.documents.filter(d => d.alerts_enabled !== false).map(d => ({ name: d.name, type: d.type, days: daysUntil(d.expiry_date), date: d.expiry_date })),
    ...state.documentDates.filter(x => x.alerts_enabled !== false).map(x => {
      const parent = state.documents.find(pd => pd.id === x.document_id);
      if (!parent || parent.alerts_enabled === false) return null;
      const label = x.label ? ` — ${x.label}` : "";
      const eff = effectiveDateStr(x);
      return { name: `${parent.name || "(unnamed)"}${label}`, type: parent.type, days: daysUntil(eff), date: eff };
    }).filter(Boolean),
  ];
  const nextUp = nextUpCandidates.sort((a, b) => a.days - b.days)[0];
  if (nextUp) {
    shell.appendChild(el(`
      <div class="banner">
        📅 <span>Next up: <b>${escapeHtml(nextUp.name || "(unnamed)")}</b> (${nextUp.type}) — ${nextUp.days < 0 ? `expired ${Math.abs(nextUp.days)}d ago` : nextUp.days === 0 ? "expires today" : `expires in ${nextUp.days}d`} <span class="muted">(${nextUp.date})</span></span>
      </div>
    `));
  }

  if (state.tab === "dashboard") {
    shell.appendChild(renderDashboard());
    shell.appendChild(el(`
      <div class="footer-note">
        Documents and alert settings are stored in your shared family vault (Supabase), synced across every device signed in with the same PIN.<br/>
        Reminder emails are sent automatically once a day when something's due — no manual sending needed.
      </div>
    `));
  }
  if (state.tab === "upload") { const n = el(`<div class="narrow"></div>`); n.appendChild(renderUpload()); shell.appendChild(n); }
  if (state.tab === "settings") { const n = el(`<div class="narrow"></div>`); n.appendChild(renderSettings()); shell.appendChild(n); }
  return shell;
}

function escapeHtml(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderDashboard() {
  const wrap = el(`<div class="dash-layout"></div>`);

  // ---- Sidebar: folders ----
  const sidebar = el(`<div class="sidebar"></div>`);
  sidebar.appendChild(el(`<div class="sidebar-title">Folders</div>`));
  const allCount = state.documents.length;
  const uncatCount = state.documents.filter(d => !d.folder_id).length;
  const allItem = el(`<div class="folder-item ${state.folderFilter==='all'?'active':''}"><span class="label">📁 All documents</span><span class="count-wrap"><span class="count">${allCount}</span></span></div>`);
  allItem.addEventListener("click", () => { state.folderFilter = "all"; render(); });
  sidebar.appendChild(allItem);
  const uncatItem = el(`<div class="folder-item ${state.folderFilter==='uncategorized'?'active':''}"><span class="label">📎 Uncategorized</span><span class="count-wrap"><span class="count">${uncatCount}</span></span></div>`);
  uncatItem.addEventListener("click", () => { state.folderFilter = "uncategorized"; render(); });
  sidebar.appendChild(uncatItem);
  for (const f of state.folders) {
    const cnt = state.documents.filter(d => d.folder_id === f.id).length;
    const item = el(`
      <div class="folder-item ${state.folderFilter===f.id?'active':''}" title="${escapeHtml(f.name)}">
        <span class="label">📁 ${escapeHtml(f.name)}</span>
        <span class="count-wrap"><span class="count">${cnt}</span><button class="edit-folder" title="Rename folder">✎</button><button class="del-folder" title="Delete folder">✕</button></span>
      </div>
    `);
    item.addEventListener("click", (e) => { if (e.target.closest(".del-folder, .edit-folder")) return; state.folderFilter = f.id; render(); });
    item.querySelector(".edit-folder").addEventListener("click", async (e) => {
      e.stopPropagation();
      const newName = prompt("Rename folder:", f.name);
      if (newName === null) return;
      const trimmed = newName.trim();
      if (!trimmed || trimmed === f.name) return;
      try {
        const res = await api("upsert_folder", { id: f.id, name: trimmed });
        const idx = state.folders.findIndex(x => x.id === f.id);
        if (idx !== -1) state.folders[idx] = res.folder;
        toast("Folder renamed.");
        render();
      } catch (err) { toast("Failed: " + err.message); }
    });
    item.querySelector(".del-folder").addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm(`Delete folder "${f.name}"? Documents inside become uncategorized.`)) return;
      try {
        await api("delete_folder", { id: f.id });
        state.folders = state.folders.filter(x => x.id !== f.id);
        state.documents.forEach(d => { if (d.folder_id === f.id) d.folder_id = null; });
        if (state.folderFilter === f.id) state.folderFilter = "all";
        render();
      } catch (err) { toast("Failed: " + err.message); }
    });
    sidebar.appendChild(item);
  }
  const newFolderBtn = el(`<button class="btn small new-folder-btn">+ New folder</button>`);
  newFolderBtn.addEventListener("click", async () => {
    const name = prompt("Folder name:");
    if (!name || !name.trim()) return;
    try {
      const res = await api("upsert_folder", { name: name.trim() });
      state.folders.push(res.folder);
      render();
    } catch (e) { toast("Failed: " + e.message); }
  });
  sidebar.appendChild(newFolderBtn);
  wrap.appendChild(sidebar);

  // ---- Main: filters + table ----
  const main = el(`<div class="card" style="flex:1;min-width:0"></div>`);
  const filterBar = el(`
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search by name or number…" value="${escapeHtml(state.search)}" />
      <select id="type-filter">
        <option value="">All types</option>
        ${typeOptionsList().map(t => `<option value="${t}" ${state.typeFilter===t?'selected':''}>${t}</option>`).join("")}
      </select>
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="valid" ${state.statusFilter==='valid'?'selected':''}>Valid</option>
        <option value="expiring" ${state.statusFilter==='expiring'?'selected':''}>Expiring soon</option>
        <option value="expired" ${state.statusFilter==='expired'?'selected':''}>Expired</option>
      </select>
    </div>
  `);
  main.appendChild(filterBar);
  main.appendChild(el(`<div class="hint" style="margin:-8px 0 14px">Tip: double-click a row to edit its details.</div>`));
  const listContainer = el(`<div></div>`);
  main.appendChild(listContainer);

  function computeFiltered() {
    return state.documents.filter(d => {
      if (state.folderFilter === "uncategorized" && d.folder_id) return false;
      if (state.folderFilter !== "all" && state.folderFilter !== "uncategorized" && d.folder_id !== state.folderFilter) return false;
      if (state.typeFilter && d.type !== state.typeFilter) return false;
      if (state.statusFilter && statusOf(daysUntil(d.expiry_date)) !== state.statusFilter) return false;
      if (state.search) {
        const q = state.search.trim().toLowerCase();
        if (q) {
          const qDigits = q.replace(/[^a-z0-9]/g, "");
          const name = (d.name || "").toLowerCase();
          const number = (d.number || "").toLowerCase();
          const numberDigits = number.replace(/[^a-z0-9]/g, "");
          const type = (d.type || "").toLowerCase();
          const matches = name.includes(q) || number.includes(q) || type.includes(q) || (qDigits.length > 0 && numberDigits.includes(qDigits));
          if (!matches) return false;
        }
      }
      return true;
    }).sort((a, b) => new Date(a.expiry_date) - new Date(b.expiry_date));
  }

  function updateList() {
    const filtered = computeFiltered();
    listContainer.innerHTML = "";
    listContainer.appendChild(el(`<div class="doc-count" style="margin-bottom:10px">${filtered.length} document${filtered.length===1?"":"s"}</div>`));
    if (!filtered.length) {
      listContainer.appendChild(el(`<div class="empty">${state.documents.length ? "No documents match your filters." : "No documents yet. Go to Upload to add your first one."}</div>`));
      return;
    }
    const scrollWrap = el(`<div class="table-scroll"></div>`);
    const table = el(`
      <table class="doc-table">
        <thead><tr>
          <th>Document</th><th>Type</th><th>Number</th><th>Issue</th><th>Expiry</th><th>Status</th>

        </tr></thead>
        <tbody></tbody>
      </table>
    `);
    const tbody = table.querySelector("tbody");
    for (const d of filtered) {
      const days = daysUntil(d.expiry_date);
      const muted = d.alerts_enabled === false;
      const rowTypeOptions = DOC_TYPES.includes(d.type) ? DOC_TYPES : [d.type, ...DOC_TYPES];
      const tr = el(`
        <tr>
          <td>${TYPE_ICON[d.type] || "📎"} <strong>${escapeHtml(d.name || "(unnamed)")}</strong></td>
          <td><select class="type-select" data-typechange="${d.id}">${rowTypeOptions.map(t => `<option value="${escapeHtml(t)}" ${t===d.type?'selected':''}>${escapeHtml(t)}</option>`).join("")}</select></td>

          <td>${d.issue_date || "—"}</td>
          <td>${d.expiry_date} <span style="color:var(--muted)">(${days < 0 ? `${Math.abs(days)}d ago` : `in ${days}d`})</span>${(() => { const n = state.documentDates.filter(x => x.document_id === d.id).length; return n ? ` <span class="badge muted" title="${n} additional alert date${n>1?'s':''}">+${n}</span>` : ""; })()}</td>
          <td>${statusLabel(days)}</td>
          <td><button class="btn small" data-view="${d.id}">View</button></td>
          <td><button class="btn small" data-download="${d.id}">Download</button></td>
          <td><button class="btn small" data-cal="${d.id}">📅 Calendar</button></td>
          <td><button class="iconbtn ${muted?'off':'on'}" data-mute="${d.id}" title="${muted?'Alerts muted — click to re-enable':'Alerts on — click to mute for this document'}">${muted?"🔕":"🔔"}</button></td>
          <td><button class="iconbtn" data-del="${d.id}" title="Delete document">🗑️</button></td>
        </tr>
      `);
      tr.addEventListener("dblclick", (e) => {
        if (e.target.closest("button, select")) return;
        openEditModal(d);
      });
      tbody.appendChild(tr);
    }
    scrollWrap.appendChild(table);
    listContainer.appendChild(scrollWrap);

    scrollWrap.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => viewFile(state.documents.find(x => x.id === b.dataset.view))));
    scrollWrap.querySelectorAll("[data-download]").forEach(b => b.addEventListener("click", () => downloadFile(state.documents.find(x => x.id === b.dataset.download))));
    scrollWrap.querySelectorAll("[data-cal]").forEach(b => b.addEventListener("click", () => addToCalendar(state.documents.find(x => x.id === b.dataset.cal))));
    scrollWrap.querySelectorAll("[data-typechange]").forEach(sel => sel.addEventListener("change", async () => {
      const id = sel.dataset.typechange;
      try {
        await api("upsert_document", { id, type: sel.value });
        const doc = state.documents.find(x => x.id === id);
        doc.type = sel.value;
        toast("Type updated.");
        render();
      } catch (e) { toast("Failed: " + e.message); }
    }));
    scrollWrap.querySelectorAll("[data-mute]").forEach(btn => btn.addEventListener("click", async () => {
      const id = btn.dataset.mute;
      const doc = state.documents.find(x => x.id === id);
      const newMuted = !(doc.alerts_enabled === false);
      try {
        await api("upsert_document", { id, alerts_enabled: !newMuted });
        doc.alerts_enabled = !newMuted;
        toast(doc.alerts_enabled === false ? "Alerts muted for this document." : "Alerts re-enabled for this document.");

  filterBar.querySelector("#status-filter").addEventListener("change", (e) => { state.statusFilter = e.target.value; updateList(); });

  updateList();

          <p class="hint" style="margin-top:0">For documents with more than one recurring due date (e.g. quarterly VAT returns), add each one here instead of uploading a new document. They use this document's reminder schedule from Alert Settings.</p>
          <div id="e-dates-list"></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
            <input type="text" id="e-date-new-label" placeholder="Label, e.g. Q2 return" style="flex:1;min-width:140px" />
            <input type="date" id="e-date-new-date" style="width:160px" />
            <button class="btn small" id="e-date-add-btn">+ Add date</button>
          </div>
          <label style="display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:12px;font-weight:400;text-transform:none;letter-spacing:normal;color:var(--muted)">
            <input type="checkbox" id="e-date-new-recurring" style="width:auto" />
            Repeats every year (same month &amp; day forever — e.g. VAT quarterly due dates). Pick any year for the date above; only the month &amp; day are used.
          </label>
        </div>
        <div style="display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap">
          <button class="btn danger" id="e-delete">Delete document</button>
          <div style="display:flex;gap:10px">
            <button class="btn ghost" id="e-cancel">Cancel</button>
            <button class="btn active" id="e-save">Save changes</button>
          </div>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector("#e-cancel").addEventListener("click", close);

  function renderDatesList() {
    const listEl = overlay.querySelector("#e-dates-list");
    const rows = state.documentDates.filter(x => x.document_id === d.id);
    listEl.innerHTML = "";
    if (!rows.length) {
      listEl.appendChild(el(`<div class="hint" style="margin:4px 0">No additional dates yet.</div>`));
    }
    for (const x of rows) {
      const muted = x.alerts_enabled === false;
      const row = el(`
        <div style="margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px">
            <input type="text" class="dr-label" value="${escapeHtml(x.label||"")}" placeholder="Label" style="flex:1;min-width:100px" />
            <input type="date" class="dr-date" value="${x.date}" style="width:160px" />
            <button class="iconbtn ${muted?'off':'on'}" title="${muted?'Alerts muted for this date — click to re-enable':'Alerts on — click to mute this date'}" data-dr-mute>${muted?"🔕":"🔔"}</button>
            <button class="btn small" data-dr-save>Save</button>
            <button class="iconbtn" title="Remove date" data-dr-del>🗑️</button>
          </div>
          <label style="display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:12px;font-weight:400;text-transform:none;letter-spacing:normal;color:var(--muted)">
            <input type="checkbox" class="dr-recurring" ${x.recurring_annual?"checked":""} style="width:auto" />
            Repeats every year (same month &amp; day — pick any year above)${x.recurring_annual ? ` · next: ${effectiveDateStr(x)}` : ""}
          </label>
        </div>
      `);
      row.querySelector("[data-dr-save]").addEventListener("click", async () => {
        const label = row.querySelector(".dr-label").value;
        const dateVal = row.querySelector(".dr-date").value;
        const recurring = row.querySelector(".dr-recurring").checked;
        if (!dateVal) { toast("Pick a date first."); return; }
        try {
          const res = await api("upsert_document_date", { id: x.id, document_id: d.id, label, date: dateVal, recurring_annual: recurring });
          const idx = state.documentDates.findIndex(y => y.id === x.id);
          if (idx !== -1) state.documentDates[idx] = res.date;
          toast("Date updated.");
        } catch (err) { toast("Save failed: " + err.message); }
      });
      row.querySelector("[data-dr-mute]").addEventListener("click", async () => {
        try {
          const res = await api("upsert_document_date", { id: x.id, document_id: d.id, alerts_enabled: muted });
          const idx = state.documentDates.findIndex(y => y.id === x.id);
          if (idx !== -1) state.documentDates[idx] = res.date;
          renderDatesList();
        } catch (err) { toast("Failed: " + err.message); }
      });
      row.querySelector("[data-dr-del]").addEventListener("click", async () => {
        if (!confirm("Remove this date?")) return;
        try {
          await api("delete_document_date", { id: x.id, document_id: d.id });
          state.documentDates = state.documentDates.filter(y => y.id !== x.id);
          renderDatesList();
          toast("Date removed.");
        } catch (err) { toast("Failed: " + err.message); }
      });
      listEl.appendChild(row);
    }
  }
  renderDatesList();
  overlay.querySelector("#e-date-add-btn").addEventListener("click", async () => {
    const labelInput = overlay.querySelector("#e-date-new-label");
    const dateInput = overlay.querySelector("#e-date-new-date");
    const recurringInput = overlay.querySelector("#e-date-new-recurring");
    const dateVal = dateInput.value;
    if (!dateVal) { toast("Pick a date first."); return; }
    try {
      const res = await api("upsert_document_date", { document_id: d.id, label: labelInput.value, date: dateVal, recurring_annual: recurringInput.checked });
      state.documentDates.push(res.date);
      labelInput.value = ""; dateInput.value = ""; recurringInput.checked = false;
      renderDatesList();
      toast("Date added.");
    } catch (err) { toast("Failed: " + err.message); }
  });
  overlay.querySelector("#e-type").addEventListener("change", (e) => {
    overlay.querySelector("#e-type-custom-wrap").style.display = e.target.value === "Other" ? "block" : "none";
  });
  overlay.querySelector("#e-save").addEventListener("click", async () => {
    const typeSelectVal = overlay.querySelector("#e-type").value;
    const typeCustomVal = overlay.querySelector("#e-type-custom").value.trim();
    const finalType = (typeSelectVal === "Other" && typeCustomVal) ? typeCustomVal : typeSelectVal;
    const payload = {
      id: d.id,
      type: finalType,
      folder_id: overlay.querySelector("#e-folder").value || null,
      name: overlay.querySelector("#e-name").value,
      number: overlay.querySelector("#e-number").value,
      nationality: overlay.querySelector("#e-nat").value,
      issue_date: overlay.querySelector("#e-issue").value || null,
      expiry_date: overlay.querySelector("#e-expiry").value,
      notes: overlay.querySelector("#e-notes").value,
    };
    if (!payload.expiry_date) { toast("Expiry date is required."); return; }
    try {
      const res = await api("upsert_document", payload);
      const idx = state.documents.findIndex(x => x.id === d.id);
      if (idx !== -1) state.documents[idx] = res.document;
      close();
      toast("Document updated.");
      render();
    } catch (err) { toast("Save failed: " + err.message); }
  });
  overlay.querySelector("#e-delete").addEventListener("click", async () => {
    if (!confirm("Delete this document permanently?")) return;
    try {
      await api("delete_document", { id: d.id });
      state.documents = state.documents.filter(x => x.id !== d.id);
      close();
      toast("Document deleted.");
      render();
    } catch (err) { toast("Failed: " + err.message); }
  });
}

function renderUpload() {
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<div class="section-title">Upload a document</div><div class="section-sub">PDF, JPG or PNG — passport, Emirates ID, driving license, visa, etc. Claude AI reads the document and fills in the fields automatically.</div>`));

  const dz = el(`
    <div class="dropzone" id="dz">
      <div style="font-size:32px">📄</div>
      <div class="big">Click to upload or drag a document here</div>
      <div class="small">JPG, PNG or PDF — passport, Emirates ID, driving license, visa, etc.</div>
      <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png" style="display:none" />
    </div>
  `);
  card.appendChild(dz);
  const progWrap = el(`<div id="prog-wrap" style="display:none"><div class="progress"><div id="prog-bar" style="width:0%"></div></div><div class="status-line" id="prog-status"></div></div>`);
  card.appendChild(progWrap);

  const formWrap = el(`<div id="form-wrap"></div>`);
  card.appendChild(formWrap);
  if (state.upload.extracted) formWrap.appendChild(renderReviewForm());

  const input = dz.querySelector("#file-input");
  dz.addEventListener("click", () => input.click());
  dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
  dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag"); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  input.addEventListener("change", () => { if (input.files[0]) handleFile(input.files[0]); });

  return card;
}

async function handleFile(file) {
  state.upload.file = file;
  state.upload.extracted = null;
  state.upload.busy = true;
  render();
  const progWrap = document.getElementById("prog-wrap");
  const bar = document.getElementById("prog-bar");
  const statusLine = document.getElementById("prog-status");
  if (progWrap) progWrap.style.display = "block";
  const onProgress = (msg, pct) => {
    if (bar) bar.style.width = Math.min(100, pct) + "%";
    if (statusLine) statusLine.textContent = msg;
  };
  try {
    onProgress("Starting…", 2);
    const dataUrl = await fileToDataUrl(file);
    const { text, fields } = await extractFromFile(file, onProgress);
    onProgress("Done", 100);
    state.upload.extracted = { ...fields, file_data_url: dataUrl, mime: file.type, rawText: text.slice(0, 2000) };
    if (!text || text.trim().length < 5) {
      toast("Couldn't find readable text in this file — fill in the fields manually below.");
    } else {
      toast("Extracted details below — please double-check before saving.");
    }
  } catch (e) {
    toast("Extraction failed: " + e.message + " — you can still fill fields in manually.");
    const dataUrl = await fileToDataUrl(file).catch(() => "");
    state.upload.extracted = { type: "Other", name: "", number: "", nationality: "", issue_date: "", expiry_date: "", file_data_url: dataUrl, mime: file.type };
  }
  state.upload.busy = false;
  render();
}

function renderReviewForm() {
  const ex = state.upload.extracted;
  const wrap = el(`
    <div style="margin-top:20px">
      <div class="section-title" style="font-size:16px">Review extracted details</div>
      <div class="section-sub">Double-check the fields below — especially dates — before saving.</div>
      <div class="grid2">
        <div class="field">
          <label>Document type</label>
          <select id="f-type">${DOC_TYPES.map(t => `<option value="${t}" ${t===ex.type?'selected':''}>${t}</option>`).join("")}</select>
        </div>
        <div class="field">
          <label>Folder</label>
          <select id="f-folder"><option value="">No folder</option>${state.folders.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join("")}</select>
        </div>
        <div class="field">
          <label>Full name</label>
          <input type="text" id="f-name" value="${escapeHtml(ex.name||"")}" placeholder="As shown on document" />
        </div>
        <div class="field">
          <label>Document number</label>
          <input type="text" id="f-number" value="${escapeHtml(ex.number||"")}" />
        </div>
        <div class="field">
          <label>Nationality</label>
          <input type="text" id="f-nat" value="${escapeHtml(ex.nationality||"")}" />
        </div>
        <div class="field"></div>
        <div class="field">
          <label>Issue date</label>
          <input type="date" id="f-issue" value="${ex.issue_date||""}" />
        </div>
        <div class="field">
          <label>Expiry date</label>
          <input type="date" id="f-expiry" value="${ex.expiry_date||""}" />
        </div>
      </div>
      <div class="field" id="f-type-custom-wrap" style="display:${ex.type==='Other'?'block':'none'}">
        <label>Custom type name</label>
        <input type="text" id="f-type-custom" value="" placeholder="e.g. Insurance Policy, Bank Statement" />
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" rows="2" placeholder="Optional"></textarea>
      </div>
      <button class="btn active" id="save-doc-btn">💾 Save document</button>
    </div>
  `);
  wrap.querySelector("#f-type").addEventListener("change", (e) => {
    wrap.querySelector("#f-type-custom-wrap").style.display = e.target.value === "Other" ? "block" : "none";
  });
  wrap.querySelector("#save-doc-btn").addEventListener("click", async () => {
    const typeSelectVal = wrap.querySelector("#f-type").value;
    const typeCustomVal = wrap.querySelector("#f-type-custom").value.trim();
    const finalType = (typeSelectVal === "Other" && typeCustomVal) ? typeCustomVal : typeSelectVal;
    const payload = {
      type: finalType,
      folder_id: wrap.querySelector("#f-folder").value || null,
      name: wrap.querySelector("#f-name").value,
      number: wrap.querySelector("#f-number").value,
      nationality: wrap.querySelector("#f-nat").value,
      issue_date: wrap.querySelector("#f-issue").value || null,
      expiry_date: wrap.querySelector("#f-expiry").value,
      notes: wrap.querySelector("#f-notes").value,
      file_data_url: ex.file_data_url,
      mime: ex.mime,
      alerts_enabled: true,
    };
    if (!payload.expiry_date) { toast("Expiry date is required."); return; }
    try {
      const res = await api("upsert_document", payload);
      state.documents.push(res.document);
      state.upload.extracted = null;
      state.upload.file = null;
      toast("Document saved.");
      state.tab = "dashboard";
      render();
    } catch (e) { toast("Save failed: " + e.message); }
  });
  return wrap;
}

function renderSettings() {
  const s = state.settings || { email_enabled: true, email_addrs: [], reminder_days_by_type: DEFAULT_REMINDER_DAYS };
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<div class="section-title">Alert Settings</div><div class="section-sub">Daily reminder emails are checked every day automatically. Documents inside their reminder window get a daily nudge until renewed or muted.</div>`));

  const enabledField = el(`
    <div class="field" style="display:flex;align-items:center;gap:10px">
      <input type="checkbox" id="email-enabled" ${s.email_enabled ? "checked" : ""} style="width:auto" />
      <label style="margin:0">Send daily reminder emails</label>
    </div>
  `);
  card.appendChild(enabledField);

  const emailsField = el(`
    <div class="field">
      <label>Recipient emails</label>
      <div class="tag-list" id="email-tags"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="email" id="new-email" placeholder="add an email address" />
        <button class="btn small" id="add-email-btn">Add</button>
      </div>
    </div>
  `);
  card.appendChild(emailsField);
  let emails = [...(s.email_addrs || [])];
  const renderTags = () => {
    const tagList = emailsField.querySelector("#email-tags");
    tagList.innerHTML = "";
    emails.forEach((em, i) => {
      const tag = el(`<div class="tag">${escapeHtml(em)}<button data-i="${i}">✕</button></div>`);
      tag.querySelector("button").addEventListener("click", () => { emails.splice(i,1); renderTags(); });
      tagList.appendChild(tag);
    });
  };
  renderTags();
  emailsField.querySelector("#add-email-btn").addEventListener("click", () => {
    const inp = emailsField.querySelector("#new-email");
    const val = inp.value.trim();
    if (val) { emails.push(val); inp.value = ""; renderTags(); }
  });

  const thresholdsField = el(`<div class="field"><label>Reminder days before expiry (comma separated, per type)</label></div>`);
  const byType = s.reminder_days_by_type || DEFAULT_REMINDER_DAYS;
  const thresholdInputs = {};
  const rowsContainer = el(`<div id="threshold-rows"></div>`);
  thresholdsField.appendChild(rowsContainer);

  function addTypeRow(typeName, initialValue) {
    if (thresholdInputs[typeName]) return; // already has a row
    const isCustom = !DOC_TYPES.includes(typeName);
    const row = el(`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div style="width:150px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${escapeHtml(typeName)}">${TYPE_ICON[typeName] || "📎"} ${escapeHtml(typeName)}</div>
        <input type="text" value="${escapeHtml(initialValue)}" />
        ${isCustom ? `<button class="iconbtn" title="Remove this type's custom schedule">✕</button>` : `<span style="width:32px"></span>`}
      </div>
    `);
    if (isCustom) {
      row.querySelector("button").addEventListener("click", () => {
        delete thresholdInputs[typeName];
        row.remove();
      });
    }
    rowsContainer.appendChild(row);
    thresholdInputs[typeName] = row.querySelector("input");
  }

  // Show a row for every standard type, plus any custom type already configured
  // or currently used on a saved document (e.g. "Insurance UAE"), so existing
  // custom types aren't hidden, and duplicates are avoided via the guard above.
  const initialTypeRows = [...new Set([...DOC_TYPES, ...Object.keys(byType), ...state.documents.map(d => d.type).filter(Boolean)])];
  initialTypeRows.forEach(t => addTypeRow(t, (byType[t] || [90, 30, 7]).join(', ')));
  card.appendChild(thresholdsField);

  const addTypeField = el(`
    <div class="field" style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <label>Add a custom document type</label>
        <input type="text" id="new-type-name" placeholder="e.g. Insurance UAE, Insurance India" />
      </div>
      <button class="btn small" id="add-type-btn">+ Add type</button>
    </div>
  `);
  card.appendChild(addTypeField);
  addTypeField.querySelector("#add-type-btn").addEventListener("click", () => {
    const nameInput = addTypeField.querySelector("#new-type-name");
    const name = nameInput.value.trim();
    if (!name) return;
    if (thresholdInputs[name]) { toast("That type already has a reminder schedule below."); return; }
    addTypeRow(name, "90, 30, 7");
    nameInput.value = "";
  });
  card.appendChild(el(`<p class="hint" style="margin-top:-6px">To receive alerts under a custom type like "Insurance UAE", set that document's Document Type to "Other" and type the same name in the Custom type name field when uploading or editing it.</p>`));

  const saveBtn = el(`<button class="btn active">💾 Save settings</button>`);
  saveBtn.addEventListener("click", async () => {
    const reminder_days_by_type = {};
    Object.keys(thresholdInputs).forEach(t => {
      reminder_days_by_type[t] = thresholdInputs[t].value.split(",").map(x => parseInt(x.trim(), 10)).filter(x => !isNaN(x));
    });
    try {
      const res = await api("upsert_settings", {
        email_enabled: enabledField.querySelector("#email-enabled").checked,
        email_addrs: emails,
        wa_enabled: s.wa_enabled || false,
        wa_number: s.wa_number || "",
        reminder_days_by_type,
      });
      state.settings = res.settings;
      toast("Settings saved.");
    } catch (e) { toast("Save failed: " + e.message); }
  });
  card.appendChild(saveBtn);
  if (s.last_reminder_sent_at) {
    card.appendChild(el(`<p class="hint">Last reminder email sent: ${new Date(s.last_reminder_sent_at).toLocaleString()}</p>`));
  } else {
    card.appendChild(el(`<p class="hint">No reminder email has been sent yet — none of your documents are inside their reminder window.</p>`));
  }
  return card;
}

render();
if (state.pin) loadAll();
</script>
