// ── Sticky header measurement ─────────────────────────────────────────────────
// Measures each sticky layer's real rendered height and publishes it as a CSS
// variable, so the next layer knows exactly where to stick. Same pattern as HR/Finance portals.
function readStkVar(n) { const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)); return isNaN(v)?0:v; }
function setStkVar(n,px) { document.documentElement.style.setProperty(n,Math.round(px)+'px'); }

// Callback ref for toolbar divs — call as ref={measureToStk2} on the toolbar element
function measureToStk2(el) {
  if (!el) return;
  const compute = () => setStkVar('--stk-2', readStkVar('--stk-1') + el.offsetHeight);
  compute();
  if (!el.__stkRO) {
    el.__stkRO = new ResizeObserver(compute);
    el.__stkRO.observe(el);
    window.addEventListener('resize', compute);
    let ticks=0;
    const iv=setInterval(()=>{ if(!el.isConnected||++ticks>20){clearInterval(iv);return;} compute(); },250);
  }
}

// Callback ref for filter bars — call as ref={measureToStk3}
function measureToStk3(el) {
  if (!el) return;
  const compute = () => setStkVar('--stk-3', readStkVar('--stk-2') + el.offsetHeight);
  compute();
  if (!el.__stkRO) {
    el.__stkRO = new ResizeObserver(compute);
    el.__stkRO.observe(el);
    window.addEventListener('resize', compute);
    let ticks=0;
    const iv=setInterval(()=>{ if(!el.isConnected||++ticks>20){clearInterval(iv);return;} compute(); },250);
  }
}

// Hook for the top nav — publishes --stk-1
function useStkPublish(varName, baseVarName) {
  const [node,setNode] = useState(null);
  const ref = useCallback(n=>setNode(n),[]);
  useLayoutEffect(()=>{
    if(!node)return;
    const compute=()=>setStkVar(varName,(baseVarName?readStkVar(baseVarName):0)+node.offsetHeight);
    compute();
    const ro=new ResizeObserver(compute);
    ro.observe(node);
    window.addEventListener('resize',compute);
    let ticks=0;
    const iv=setInterval(()=>{if(++ticks>20){clearInterval(iv);return;}compute();},250);
    return()=>{ro.disconnect();window.removeEventListener('resize',compute);clearInterval(iv);};
  },[node]);
  return ref;
}

// ── Drag-to-scroll ────────────────────────────────────────────────────────────
// Global handler: any element with class "drag-scroll" or "tbl-box" becomes
// draggable with mouse/pointer. Matches HR/Finance portal behaviour exactly.
function useDragScroll() {
  useEffect(()=>{
    let active=null;
    const stop=()=>{ if(active?.el) active.el.classList.remove('dragging'); active=null; };
    const onDown=e=>{
      if(e.button!==0)return;
      const el=e.target.closest&&e.target.closest('.drag-scroll,.tbl-box');
      if(!el)return;
      if(e.target.closest('button,input,select,textarea,a,label,[contenteditable="true"]'))return;
      if(el.scrollWidth<=el.clientWidth&&el.scrollHeight<=el.clientHeight)return;
      active={el,startX:e.clientX,startY:e.clientY,left:el.scrollLeft,top:el.scrollTop,moved:false};
      el.classList.add('dragging');
    };
    const onMove=e=>{
      if(!active)return;
      const dx=e.clientX-active.startX, dy=e.clientY-active.startY;
      if(Math.abs(dx)>3||Math.abs(dy)>3) active.moved=true;
      active.el.scrollLeft=active.left-dx;
      active.el.scrollTop=active.top-dy;
      e.preventDefault();
    };
    const onClick=e=>{ if(active?.moved){e.preventDefault();e.stopPropagation();} };
    document.addEventListener('mousedown',onDown);
    document.addEventListener('mousemove',onMove,{passive:false});
    document.addEventListener('mouseup',stop);
    document.addEventListener('mouseleave',stop);
    document.addEventListener('click',onClick,true);
    return()=>{
      document.removeEventListener('mousedown',onDown);
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',stop);
      document.removeEventListener('mouseleave',stop);
      document.removeEventListener('click',onClick,true);
    };
  },[]);
}

};

function exportCSV(rows, filename, cols) {
  const hdr = cols.map(c => c.label);
  const data = rows.map(r => cols.map(c => {
    const v = c.key.split('.').reduce((o,k) => o?.[k], r);
    if (c.bool) return v ? 'Yes' : 'No';
    if (c.date) return v ? fmtDOB(v) : '';
    return v ?? '';
  }));
  const csv = [hdr,...data].map(row => row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), {href:url, download:`${filename}_${todayStr()}.csv`}).click();
  URL.revokeObjectURL(url);
}

// ── Draft persistence — survives tab switching ────────────────────────────────
function usePersistentDraft(key) {
  const stored = React.useMemo(() => {
    try { const v = localStorage.getItem('satco_mob_draft_' + key); return v ? JSON.parse(v) : null; } catch { return null; }
  }, [key]);
  const [draft, setDraftRaw] = useState(stored);
  const setDraft = useCallback((valOrFn) => {
    setDraftRaw(prev => {
      const next = typeof valOrFn === 'function' ? valOrFn(prev) : valOrFn;
      try {
        // Only persist NEW drafts (no id) — editing existing records should never be stored
        if (next === null) localStorage.removeItem('satco_mob_draft_' + key);
        else if (!next.id) localStorage.setItem('satco_mob_draft_' + key, JSON.stringify(next));
        else localStorage.removeItem('satco_mob_draft_' + key); // clear any stale draft when editing existing
      } catch {}
      return next;
    });
  }, [key]);
  return [draft, setDraft];
}

const fileToBase64 = file => new Promise((res,rej)=>{
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]);
  r.onerror = () => rej(new Error('File read failed'));
  r.readAsDataURL(file);
});

// Upload a file to Supabase Storage and record in mob_documents
async function uploadDocument(file, entityType, entityId, docType, docLabel) {
  const ext   = file.name.split('.').pop().toLowerCase();
  const path  = `${entityType}/${entityId}/${docType}_${Date.now()}.${ext}`;
  const { error: upErr } = await db.storage.from(DOC_BUCKET).upload(path, file, { upsert: false });
  if (upErr) throw new Error('Upload failed: ' + upErr.message);
  const { error: dbErr } = await db.from('mob_documents').insert({
    entity_type: entityType, entity_id: entityId,
    doc_type: docType, doc_label: docLabel || file.name,
    file_path: path, file_name: file.name,
    file_size: file.size, mime_type: file.type,
  });
  if (dbErr) throw new Error('Record failed: ' + dbErr.message);
  return path;
}

// Get a signed URL for viewing (60-minute expiry)
async function getSignedUrl(filePath) {
  const { data, error } = await db.storage.from(DOC_BUCKET).createSignedUrl(filePath, 3600);
  if (error) throw new Error(error.message);
  return data.signedUrl;
}

  "wp_expiry": "YYYY-MM-DD work permit expiry",
  "issue_date": "YYYY-MM-DD issue or approval date",
  "issuing_authority": "name of issuing body or sponsor",
  "designation": "job title or occupation if shown",
  "certificate_no": "any certificate or reference number"
}

Return ONLY the JSON. No explanation, no markdown, no backticks.`;

  const contentType = mimeType.startsWith('image/') ? 'image' : 'document';
  const res = await fetch(CLAUDE_PROXY, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:1000,
      messages:[{ role:'user', content:[
        { type: contentType, source:{ type:'base64', media_type:mimeType, data:b64 } },
        { type:'text', text: prompt },
      ]}]
    })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  const text = (data.content||[]).map(c=>c.text||'').join('').trim();
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('AI did not return JSON. Response: ' + text.slice(0,200));
  return JSON.parse(match[0]);
}

// Slide-out right panel: shows candidate/mob record details, documents, AI scan
function DocumentPanel({entity, entityType, onClose, onApplyAiData}) {
  const [docs,       setDocs]       = useState([]);
  const [loading,    setLoading]    = useState(true);
  const [uploading,  setUploading]  = useState(false);
  const [scanning,   setScanning]   = useState(null); // doc id being scanned
  const [scanResult, setScanResult] = useState(null);
  const [err,        setErr]        = useState('');
  const [docType,    setDocType]    = useState('passport');
  const fileRef = useRef(null);

  const DOC_TYPES = [
    {v:'passport',    l:'Passport'},
    {v:'eid',         l:'Emirates ID'},
    {v:'visa',        l:'UAE Visa'},
    {v:'medical',     l:'Medical Certificate'},
    {v:'work_permit', l:'Work Permit'},
    {v:'cicpa',       l:'CICPA Gate Pass'},
    {v:'other',       l:'Other'},
  ];

  const loadDocs = useCallback(async () => {
    setLoading(true);
    const { data } = await db.from('mob_documents')
      .select('*')
      .eq('entity_type', entityType)
      .eq('entity_id', entity.id)
      .order('uploaded_at', {ascending:false});
    setDocs(data || []);
    setLoading(false);
  }, [entity.id, entityType]);

  useEffect(() => { loadDocs(); }, [loadDocs]);

  const handleUpload = async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    setErr(''); setUploading(true);
    try {
      await uploadDocument(file, entityType, entity.id, docType, DOC_TYPES.find(d=>d.v===docType)?.l || docType);
      await loadDocs();
    } catch(ex) { setErr(ex.message); }
    setUploading(false);
    e.target.value = '';
  };

  const viewDoc = async doc => {
    try {
      const url = await getSignedUrl(doc.file_path);
      window.open(url, '_blank');
    } catch(ex) { setErr(ex.message); }
  };

  const deleteDoc = async doc => {
    if (!window.confirm(`Delete "${doc.doc_label}"?`)) return;
    await db.storage.from(DOC_BUCKET).remove([doc.file_path]);
    await db.from('mob_documents').delete().eq('id', doc.id);
    await loadDocs();
  };

  const scanDoc = async doc => {
    setErr(''); setScanning(doc.id); setScanResult(null);
    try {
      // Download file content for scanning
      const { data: blob } = await db.storage.from(DOC_BUCKET).download(doc.file_path);
      const file = new File([blob], doc.file_name || 'doc', { type: doc.mime_type || 'image/jpeg' });
      const result = await aiScanDocument(file, doc.doc_type || 'other');
      setScanResult({ docId: doc.id, data: result, docType: doc.doc_type });
      // Mark as scanned in DB
      await db.from('mob_documents').update({ ai_scanned: true, ai_data: result }).eq('id', doc.id);
      await loadDocs();
    } catch(ex) { setErr('AI scan failed: ' + ex.message); }
    setScanning(null);
  };

  const applyToRecord = data => {
    if (onApplyAiData) onApplyAiData(data, scanResult?.docType);
    setScanResult(null);
  };

  // Field mapping from AI scan result to record fields
  const getSuggestedFields = (aiData, docType) => {
    // Build list of fields that will actually be updated
    const fields = [];
    const dt = aiData.doc_type || docType || '';
    if (aiData.full_name)         fields.push('Full Name');
    if (aiData.passport_no)       fields.push('Passport No');
    if (aiData.nationality)       fields.push('Nationality');
    if (aiData.date_of_birth)     fields.push('Date of Birth');
    if (aiData.passport_expiry)   fields.push('Passport Expiry');
    if (aiData.emirates_id)       fields.push('Emirates ID');
    if (aiData.eid_expiry)        fields.push('EID Expiry');
    if (aiData.visa_no)           fields.push('Visa No');
    if (aiData.visa_type)         fields.push('Visa Type');
    if (aiData.visa_expiry)       fields.push('Visa Expiry');
    if (aiData.wp_no)             fields.push('Work Permit No');
    if (aiData.cicpa_pass_no)     fields.push('CICPA Pass No');
    if (aiData.cicpa_expiry)      fields.push('CICPA Expiry');
    if (dt.includes('medical') || aiData.medical_result) fields.push('Medical Done ✓', aiData.medical_result||'');
    if (dt.includes('medical') && aiData.medical_date)   fields.push('Medical Date');
    if (dt==='hse_passport'||(aiData.training_name||'').toLowerCase().includes('hse')) fields.push('HSE Passport ✓');
    if (dt==='h2s_certificate'||(aiData.training_name||'').toLowerCase().includes('h2s')) fields.push('H2S Training ✓');
    if (aiData.training_name)     fields.push(`Training: ${aiData.training_name}`);
    if (aiData.training_date)     fields.push('Training Date');
    if (aiData.training_expiry)   fields.push('Training Expiry');
    return fields.filter(Boolean).map(f => [f, f]); // return in expected [[key,label]] format
  };

  const typeColor = { passport:'#2563eb',eid:'#7c3aed',visa:'#0369a1',medical:'#166534',work_permit:'#b45309',cicpa:'#991b1b',other:'#475569' };

  return (
    <div style={{position:'fixed',inset:0,zIndex:400,display:'flex'}}>
      {/* Backdrop */}
      <div style={{flex:1,background:'rgba(0,0,0,0.4)'}} onClick={onClose}/>
      {/* Panel */}
      <div style={{width:'480px',background:'#fff',height:'100%',overflowY:'auto',boxShadow:'-8px 0 32px rgba(0,0,0,0.2)',display:'flex',flexDirection:'column'}}>
        {/* Header */}
        <div style={{padding:'16px 20px',background:'#0f172a',color:'#fff',flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <div style={{fontSize:'11px',fontWeight:700,color:'#b8972a',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'2px'}}>
                {entityType === 'candidate' ? 'Candidate' : 'Mobilisation Record'}
              </div>
              <div style={{fontWeight:800,fontSize:'16px'}}>{entity.full_name}</div>
              <div style={{fontSize:'12px',color:'#94a3b8',marginTop:'2px'}}>
                {entity.designation||'—'}
                {entityType==='mobilisation' && ` · ${entity.customer_name} / ${entity.location}`}
              </div>
            </div>
            <button onClick={onClose} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',width:32,height:32,borderRadius:'50%',cursor:'pointer',fontSize:'18px',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
          </div>
        </div>

        {/* Key details strip */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1px',background:'#e2e8f0',borderBottom:'1px solid #e2e8f0',flexShrink:0}}>
          {[
            ['Passport No', entity.passport_no],
            ['Emirates ID', entity.emirates_id],
            ['Nationality', entity.nationality],
            ['DOB', entity.date_of_birth ? fmtDOB(entity.date_of_birth) : null],
            ['Visa Location', entity.visa_location],
            ['Supplier / EmpNo', entity.supplier_name ? `${entity.supplier_name}${entity.supplier_emp_no?' #'+entity.supplier_emp_no:''}` : null],
          ].map(([l,v])=> v ? (
            <div key={l} style={{padding:'8px 14px',background:'#fff'}}>
              <div style={{fontSize:'10px',fontWeight:700,color:'#94a3b8',textTransform:'uppercase'}}>{l}</div>
              <div style={{fontSize:'12.5px',fontWeight:600,fontFamily:l.includes('No')||l.includes('ID')?'monospace':undefined}}>{v}</div>
            </div>
          ) : null)}
        </div>

        {/* Upload section */}
        <div style={{padding:'14px 20px',borderBottom:'1px solid #e2e8f0',background:'#f8fafc',flexShrink:0}}>
          <div style={{fontWeight:700,fontSize:'12px',color:'#0f172a',marginBottom:'8px'}}>📎 Upload Document</div>
          <div style={{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}}>
            <select value={docType} onChange={e=>setDocType(e.target.value)} style={{...S.input,width:'150px',fontSize:'12px',padding:'6px 8px'}}>
              {DOC_TYPES.map(d=><option key={d.v} value={d.v}>{d.l}</option>)}
            </select>
            <button onClick={()=>fileRef.current?.click()} disabled={uploading}
              style={{...S.btnGold,padding:'6px 14px',fontSize:'12px'}}>
              {uploading ? 'Uploading…' : '⬆ Choose File'}
            </button>
            <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={handleUpload}/>
          </div>
          <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>Accepts PDF, JPG, PNG · After upload, click Scan with AI to extract data</div>
        </div>

        {/* AI scan result */}
        {scanResult && (
          <div style={{padding:'14px 20px',background:'#f0fdf4',borderBottom:'1px solid #bbf7d0',flexShrink:0}}>
            <div style={{fontWeight:700,fontSize:'12px',color:'#166534',marginBottom:'8px'}}>✨ AI Scan Result</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginBottom:'10px'}}>
              {Object.entries(scanResult.data).map(([k,v])=> v ? (
                <div key={k} style={{background:'#fff',borderRadius:6,padding:'6px 10px',border:'1px solid #bbf7d0'}}>
                  <div style={{fontSize:'10px',fontWeight:700,color:'#94a3b8',textTransform:'uppercase'}}>{k.replace(/_/g,' ')}</div>
                  <div style={{fontSize:'12px',fontWeight:600}}>{String(v)}</div>
                </div>

            <div style={{display:'flex',gap:'8px'}}>
              <button style={{...S.btnGrn,padding:'6px 14px',fontSize:'12px'}} onClick={()=>applyToRecord(scanResult.data)}>
                Apply to Record

              <button style={{...S.btnSec,padding:'6px 14px',fontSize:'12px'}} onClick={()=>setScanResult(null)}>Dismiss</button>
            </div>
            {getSuggestedFields(scanResult.data, scanResult.docType).length > 0 && (
              <div style={{fontSize:'11px',color:'#166534',marginTop:'6px'}}>
                Will update: {getSuggestedFields(scanResult.data, scanResult.docType).map(([,l])=>l).join(', ')}

            )}

        {err && <div style={{margin:'10px 20px',padding:'8px 12px',background:'#fee2e2',color:'#991b1b',borderRadius:6,fontSize:'12px'}}>{err}<button onClick={()=>setErr('')} style={{marginLeft:'8px',background:'none',border:'none',cursor:'pointer',color:'#991b1b'}}>×</button></div>}

                    {doc.ai_scanned && <span style={{fontSize:'10px',color:'#166534',fontWeight:700}}>✨ AI scanned</span>}
                  </div>
                  <div style={{fontSize:'12.5px',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.doc_label||doc.file_name}</div>
                  <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>
                    {doc.file_size ? Math.round(doc.file_size/1024)+'KB' : ''} · {fmtDate(doc.uploaded_at)}
                  </div>
                </div>
                <div style={{display:'flex',gap:'4px',flexShrink:0,marginLeft:'8px'}}>
                  <button style={{...S.btnSm,padding:'4px 8px'}} onClick={()=>viewDoc(doc)} title="Open">👁</button>
                  <button style={{...S.btnSm,padding:'4px 8px',background:scanning===doc.id?'#f0fdf4':'#fff'}} onClick={()=>scanDoc(doc)} disabled={scanning===doc.id} title="Scan with AI">
                    {scanning===doc.id ? '⏳' : '✨'}
                  </button>
                  <button style={{...S.btnSm,padding:'4px 8px',color:'#dc2626'}} onClick={()=>deleteDoc(doc)} title="Delete">🗑</button>
                </div>
              </div>
              {doc.ai_data && (
                <div style={{marginTop:'6px',padding:'6px 8px',background:'#f8fafc',borderRadius:5,fontSize:'11px',color:'#475569'}}>
                  {Object.entries(doc.ai_data).filter(([,v])=>v).slice(0,3).map(([k,v])=>`${k.replace(/_/g,' ')}: ${v}`).join(' · ')}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({data, loaUsed, setTab, setFilterStatus, hrMobActive=new Set()}) {
  const {candidates, loaList, mobList} = data;
  const active     = mobList.filter(m=>m.status==='mobilised').length;
  const pending    = mobList.filter(m=>m.status==='pending').length;
  const demobbed   = mobList.filter(m=>m.status==='demobilised').length;
  const noWP       = mobList.filter(m=>!m.wp_approved_date&&!['rejected','demobilised'].includes(m.status)).length;
  const noCICPA    = mobList.filter(m=>!m.cicpa_pass_no&&!['rejected','demobilised'].includes(m.status)).length;
  const medPending = mobList.filter(m=>!m.medical_done&&!['rejected','demobilised'].includes(m.status)).length;

  // Available candidates — check mob_register, name fallback AND HR portal mob_demob
  const activeCandIds  = new Set(mobList.filter(m=>m.status==='mobilised').map(m=>m.candidate_id).filter(Boolean));
  const activeNames    = new Set(mobList.filter(m=>m.status==='mobilised'&&!m.candidate_id).map(m=>(m.full_name||'').toLowerCase().trim()));
  const availCands = candidates.filter(c=>{
    if(!c.active) return false;
    if(activeCandIds.has(c.id)) return false;
    if(activeNames.has((c.full_name||'').toLowerCase().trim())) return false;
    if(c.source==='satco_own'&&c.supplier_emp_no&&hrMobActive.has(c.supplier_emp_no)) return false;
    return true;
  });

  // ── Comprehensive expiry collection ────────────────────────────────────────
  // Collect ALL expiry dates across all document types for all active people
  const ALERT_DAYS = 60; // show alert if expiring within 60 days
  const allExpiries = [];

  mobList.filter(m=>!['rejected','demobilised'].includes(m.status)).forEach(r => {
    const add = (type, date, label, critical) => {
      const d = daysUntil(date);
      if (date && d !== null && d <= ALERT_DAYS) {
        allExpiries.push({ person: r.full_name, type, label, date, daysLeft: d, expired: d < 0, critical: !!critical, record: r });
      }
    };
    add('CICPA Gate Pass',   r.cicpa_expiry_date,   'CICPA Gate Pass',      true);
    add('Work Permit',       r.wp_expiry,            'Work Permit',          true);
    add('Medical',           r.medical_expiry,       'Medical Certificate',  true);
    add('HSE Passport',      r.hse_passport_expiry,  'HSE Passport',         false);
    add('H2S Training',      r.h2s_expiry,           'H2S Certificate',      false);
    // Extra trainings
    (r.extra_trainings||[]).forEach(t => {
      if (t.expiry) add(t.name, t.expiry, t.name + ' Certificate', false);
    });
  });

  // Candidate document expiries
  candidates.filter(c=>c.active).forEach(c => {
    const add = (type, date) => {
      const d = daysUntil(date);
      if (date && d !== null && d <= ALERT_DAYS) {
        allExpiries.push({ person: c.full_name, type, label: type, date, daysLeft: d, expired: d < 0, critical: d < 0 || type==='Visa', candidate: c });
      }
    };
    add('Passport',    c.passport_expiry);
    add('Emirates ID', c.eid_expiry);
    add('Visa',        c.visa_expiry);
  });

  // Sort: expired first, then by days ascending
  allExpiries.sort((a,b) => a.daysLeft - b.daysLeft);

  const expired   = allExpiries.filter(x => x.expired);
  const expiring7 = allExpiries.filter(x => !x.expired && x.daysLeft <= 7);
  const expiring30= allExpiries.filter(x => !x.expired && x.daysLeft > 7 && x.daysLeft <= 30);
  const expiring60= allExpiries.filter(x => !x.expired && x.daysLeft > 30 && x.daysLeft <= 60);

  const Stat=({label,value,color,sub,onClick})=>(
    <div onClick={onClick} style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:'10px',padding:'18px 20px',cursor:onClick?'pointer':'default',transition:'border-color 0.15s'}}
      onMouseEnter={e=>onClick&&(e.currentTarget.style.borderColor='#b8972a')}
      onMouseLeave={e=>e.currentTarget.style.borderColor='#e2e8f0'}>
      <div style={{fontSize:'11px',fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>{label}</div>
      <div style={{fontSize:'32px',fontWeight:800,color,lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>{sub}</div>}
    </div>
  );

  const ExpiryTable = ({items, title, bg, border, headColor}) => items.length === 0 ? null : (
    <div style={{...S.card,border:`1px solid ${border}`}}>
      <div style={{padding:'10px 16px',borderBottom:`1px solid ${border}`,background:bg}}>
        <div style={{fontWeight:800,fontSize:'13px',color:headColor}}>{title} ({items.length})</div>
      </div>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr style={{background:'#f8fafc'}}>
          {['Person','Document / Certificate','Expiry Date','Days Left'].map(h=><th key={h} style={S.th}>{h}</th>)}
        </tr></thead>
        <tbody>
          {items.map((x,i)=>(
            <tr key={i} style={{borderTop:'1px solid #f1f5f9',background:x.expired?'#fef2f2':x.daysLeft<=7?'#fff7f0':'#fffbeb'}}>
              <td style={{...S.td,fontWeight:600}}>{x.person}</td>
              <td style={S.td}>
                <span style={{background:x.critical?'#fee2e2':'#fef3c7',color:x.critical?'#991b1b':'#92400e',fontSize:'10px',fontWeight:700,padding:'2px 6px',borderRadius:8,marginRight:'6px'}}>{x.type}</span>
                {x.label}
              </td>
              <td style={{...S.td,fontFamily:'monospace',fontSize:'12px'}}>{fmtDate(x.date)}</td>
              <td style={{...S.td,fontWeight:800,color:x.expired?'#dc2626':x.daysLeft<=7?'#b45309':'#92400e'}}>
                {x.expired ? `EXPIRED ${Math.abs(x.daysLeft)}d ago` : `${x.daysLeft}d`}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );

  return (
    <div>
      {/* Stat cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(155px,1fr))',gap:'12px',marginBottom:'20px'}}>
        <Stat label="Candidates Pool"    value={candidates.length}  color="#2563eb"  onClick={()=>setTab('candidates')} />
        <Stat label="Available"          value={availCands.length}  color="#0369a1"  sub="not on site" onClick={()=>setTab('candidates')} />
        <Stat label="Active On Site"     value={active}             color="#166534"  onClick={()=>{setFilterStatus('mobilised');setTab('mobilisation');}} />
        <Stat label="Pending"            value={pending}            color="#b45309"  onClick={()=>{setFilterStatus('pending');setTab('mobilisation');}} />
        <Stat label="No Work Permit"     value={noWP}               color="#dc2626"  sub="approved" />
        <Stat label="No CICPA Pass"      value={noCICPA}            color="#7c3aed" />
        <Stat label="Medical Pending"    value={medPending}         color="#0369a1" />
        <Stat label="Expiry Alerts"      value={allExpiries.length} color={expired.length>0?'#dc2626':'#b45309'} sub={`${expired.length} expired · ${expiring7.length} critical`} />
      </div>

      {/* Expiry Alert Banner */}
      {(expired.length > 0 || expiring7.length > 0) && (
        <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'8px',padding:'10px 16px',marginBottom:'16px',display:'flex',gap:'12px',alignItems:'flex-start'}}>
          <span style={{fontSize:'22px',flexShrink:0}}>🚨</span>
          <div>
            <div style={{fontWeight:800,fontSize:'13px',color:'#991b1b',marginBottom:'4px'}}>
              Urgent: {expired.length} expired + {expiring7.length} expiring within 7 days
            </div>
            <div style={{fontSize:'12px',color:'#991b1b'}}>
              {[...expired,...expiring7].slice(0,5).map((x,i)=>(
                <span key={i} style={{marginRight:'12px'}}>
                  <strong>{x.person}</strong> — {x.label} {x.expired?`expired ${Math.abs(x.daysLeft)}d ago`:`(${x.daysLeft}d)`}
                </span>
              ))}
              {(expired.length+expiring7.length)>5 && <span>+ {(expired.length+expiring7.length)-5} more below</span>}
            </div>
          </div>
        </div>
      )}

      {/* Expiry tables */}
      <ExpiryTable items={expired}    title="🚨 EXPIRED — Immediate Action Required" bg="#fef2f2" border="#fecaca" headColor="#991b1b"/>
      <ExpiryTable items={expiring7}  title="⚠️ Expiring within 7 days — Critical"    bg="#fff7f0" border="#fed7aa" headColor="#c2410c"/>
      <ExpiryTable items={expiring30} title="⏰ Expiring within 30 days"               bg="#fffbeb" border="#fde68a" headColor="#92400e"/>
      <ExpiryTable items={expiring60} title="📅 Expiring within 60 days"               bg="#f8fafc" border="#e2e8f0" headColor="#475569"/>

      {allExpiries.length === 0 && (
        <div style={{...S.card,padding:'20px',textAlign:'center',color:'#166534',fontWeight:700,fontSize:'14px',background:'#f0fdf4',border:'1px solid #bbf7d0'}}>
          ✅ All certificates and documents are valid — no expiry alerts
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginTop:'16px'}}>
        {/* LOA Status */}
        <div style={S.card}>
          <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f8fafc'}}>
            <div style={{fontWeight:800,fontSize:'13px'}}>📄 LOA Status</div>
            <button style={S.btnSm} onClick={()=>setTab('loa')}>Manage →</button>
          </div>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>{['Customer','Location','Remaining','Used','Total'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {loaList.length===0&&<tr><td colSpan={5} style={{padding:'16px',textAlign:'center',color:'#94a3b8',fontSize:'13px'}}>No LOA registered</td></tr>}
              {loaList.map(l=>{
                const used=loaUsed[l.id]||0, rem=l.total_count-used, low=rem<(l.alert_threshold||10);
                return <tr key={l.id} style={{background:low?'#fffbeb':'#fff'}}>
                  <td style={{...S.td,fontWeight:700}}>{l.customer_name}</td>
                  <td style={S.td}>{l.location}</td>
                  <td style={{...S.td,fontWeight:800,color:rem<=5?'#dc2626':low?'#b45309':'#166534'}}>{rem}</td>
                  <td style={{...S.td,color:'#0369a1'}}>{used}</td>
                  <td style={{...S.td,color:'#64748b'}}>{l.total_count}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>

        {/* Recent mob */}
        <div style={S.card}>
          <div style={{padding:'10px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',justifyContent:'space-between',background:'#f8fafc'}}>
            <div style={{fontWeight:800,fontSize:'13px'}}>🏗️ Recent Activity</div>
            <button style={S.btnSm} onClick={()=>setTab('mobilisation')}>View All →</button>
          </div>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>{['Name','Designation','Customer / Location','Status'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {mobList.slice(0,8).map(r=><tr key={r.id} className="hr-row">
                <td style={{...S.td,fontWeight:600}}>{r.full_name}</td>
                <td style={S.td}>{r.designation||'—'}</td>
                <td style={S.td}>{r.customer_name} / {r.location}</td>
                <td style={S.td}><StatusBadge status={r.status}/></td>
              </tr>)}
              {mobList.length===0&&<tr><td colSpan={4} style={{padding:'16px',textAlign:'center',color:'#94a3b8'}}>No records yet</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function CandidatesTab({candidates, mobList, onSave, onDelete, onMobilise, tabSearch, hrMobActive=new Set()}) {

  const [savedDraft, setSavedDraft] = useState(() => { try { const v=localStorage.getItem('satco_mob_draft_candidate'); return v?JSON.parse(v):null; } catch{return null;} });
  const [search,setSearch] = useState(tabSearch||'');
  const [suppF,setSuppF]   = useState('');
  const [histPerson, setHistPerson] = useState(null);
  const [docPanel,  setDocPanel]   = useState(null);
  const [satcoEmps, setSatcoEmps]  = useState([]);
  const clickTimer  = useRef(null);

  useEffect(()=>{ if(tabSearch) setSearch(tabSearch); },[tabSearch]);

  useEffect(()=>{
    db.from('employees')
      .select('employee_id,full_name,nationality,dob,passport_no,passport_expiry,eid_no,eid_expiry,evisa_no,visa_expiry,location,mobile,position')
      .is('deleted_at', null)
      .order('employee_id')
      .then(({data})=>setSatcoEmps(data||[]));
  },[]);

  // Auto-generate next supplier emp number based on supplier name prefix
  const getNextEmpNo = useCallback((supplierName) => {
    if (!supplierName) return '';
    const name = supplierName.trim().toUpperCase();
    // Derive prefix from supplier name (first 3-4 consonant-heavy chars)
    let prefix = '';
    // Check known suppliers first
    const prefixMap = {};
    // Build from existing candidates
    candidates.filter(c=>c.supplier_name&&c.supplier_emp_no).forEach(c=>{
      const p = (c.supplier_emp_no||'').replace(/\d+$/,'');
      if (p && !prefixMap[c.supplier_name]) prefixMap[c.supplier_name] = p;
    });
    prefix = prefixMap[supplierName];
    if (!prefix) {
      // Auto-derive: take up to 4 uppercase letters from the name
      const words = name.split(/\s+/);
      if (words.length > 1) {
        prefix = words.map(w=>w[0]).join('').slice(0,4);
      } else {
        prefix = name.replace(/[^A-Z]/g,'').slice(0,4);
      }
    }
    // Find highest existing number for this supplier
    const existing = candidates
      .filter(c=>c.supplier_name===supplierName && c.supplier_emp_no)
      .map(c=>{ const m=(c.supplier_emp_no||'').match(/(\d+)$/); return m?parseInt(m[1]):0; })
      .filter(n=>!isNaN(n));
    const next = existing.length > 0 ? Math.max(...existing)+1 : 1001;
    return `${prefix}${next}`;
  }, [candidates]);

  const activeCandIds   = useMemo(()=>new Set(mobList.filter(m=>m.status==='mobilised').map(m=>m.candidate_id).filter(Boolean)),[mobList]);
  const activeNames     = useMemo(()=>new Set(mobList.filter(m=>m.status==='mobilised'&&!m.candidate_id).map(m=>(m.full_name||'').toLowerCase().trim())),[mobList]);
  // isOnSite: check mob_register, name fallback, AND HR portal mob_demob for SATCO employees
  const isOnSiteFn = useCallback(c => {
    if (activeCandIds.has(c.id)) return true;
    if (activeNames.has((c.full_name||'').toLowerCase().trim())) return true;
    if (c.source==='satco_own' && c.supplier_emp_no && hrMobActive.has(c.supplier_emp_no)) return true;
    return false;
  }, [activeCandIds, activeNames, hrMobActive]);
  const supplierList  = useMemo(()=>[...new Set(candidates.map(c=>c.supplier_name).filter(Boolean))].sort(),[candidates]);

  const filtered = useMemo(()=> candidates.filter(c=>{
    if (suppF && c.supplier_name !== suppF) return false;
    return matchSearch(c, search);
  }), [candidates, search, suppF]);

  const blank = () => { setDraft({full_name:'',designation:'',source:'supplier',supplier_name:'',supplier_emp_no:'',nationality:'',date_of_birth:'',passport_no:'',passport_expiry:'',emirates_id:'',eid_expiry:'',visa_no:'',visa_type:'',visa_location:'',visa_expiry:'',phone:'',remarks:'',active:true}); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); };

  const personHistory = (cand) => {
    const hist = mobList.filter(m => m.candidate_id === cand.id || m.full_name === cand.full_name);
    setHistPerson({candidate:cand, history:hist});
  };

  // Single click = highlight + open doc panel; double click = open edit form
  const handleRowClick = (cand, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    clickTimer.current = setTimeout(() => {
      setDocPanel({entity: cand, entityType: 'candidate'});
    }, 220);
  };
  const handleRowDblClick = (cand, e) => {
    if (e.target.closest('button')) return;
    clearTimeout(clickTimer.current);
    setDraft({...cand});
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0);
  };

  // Apply AI-scanned data back to a candidate record
  const applyAiData = async (aiData, docType) => {
    if (!docPanel) return;
    const fieldMap = {
      full_name: 'full_name', passport_no: 'passport_no', nationality: 'nationality',
      date_of_birth: 'date_of_birth', expiry_date: docType==='passport'?'passport_expiry':docType==='eid'?'eid_expiry':docType==='visa'?'visa_expiry':null,
      emirates_id: 'emirates_id', visa_no: 'visa_no', visa_type: 'visa_type',
    };
    const updates = {};
    Object.entries(aiData).forEach(([k,v]) => { if (fieldMap[k] && v) updates[fieldMap[k]] = v; });
    if (!Object.keys(updates).length) return;
    const { error } = await db.from('mob_candidates').update({...updates, updated_at: new Date().toISOString()}).eq('id', docPanel.entity.id);
    if (error) { alert(error.message); return; }
    await onSave('candidates', {...docPanel.entity, ...updates}, ()=>{});
    setDocPanel(d => d ? {...d, entity:{...d.entity,...updates}} : d);
    alert('Record updated from AI scan ✓');
  };

  const exportCols = [
    {key:'full_name',label:'Name'},{key:'designation',label:'Designation'},{key:'source',label:'Source'},
    {key:'supplier_name',label:'Supplier'},{key:'supplier_emp_no',label:'Supplier Emp No'},
    {key:'nationality',label:'Nationality'},{key:'date_of_birth',label:'DOB',date:true},
    {key:'passport_no',label:'Passport No'},{key:'passport_expiry',label:'Passport Expiry',date:true},
    {key:'emirates_id',label:'Emirates ID'},{key:'eid_expiry',label:'EID Expiry',date:true},
    {key:'visa_no',label:'Visa No'},{key:'visa_type',label:'Visa Type'},
    {key:'visa_location',label:'Visa Location'},{key:'visa_expiry',label:'Visa Expiry',date:true},
    {key:'phone',label:'Phone'},{key:'remarks',label:'Remarks'},
  ];

  return (
    <div>
      {!draft && savedDraft && (
        <DraftBanner draft={savedDraft}
          onRestore={()=>{ setDraft(savedDraft); setSavedDraft(null); setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),0); }}

      {histPerson && (

      {docPanel && (

      <div ref={measureToStk2} className="sticky-toolbar" style={{padding:'8px 14px',display:'flex',gap:'8px',justifyContent:'space-between',flexWrap:'wrap',alignItems:'center'}}>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}}>
          <input placeholder="Search name, EID, passport, designation, supplier…" value={search} onChange={e=>setSearch(e.target.value)} style={{...S.input,width:'320px'}}/>
          <select value={suppF} onChange={e=>setSuppF(e.target.value)} style={{...S.input,width:'180px'}}>
            <option value="">All suppliers</option>
            {supplierList.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <span style={{fontSize:'12px',color:'#64748b'}}>{filtered.length} people</span>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button style={S.btnGold} onClick={()=>exportCSV(filtered,'SATCO_Candidates',exportCols)}>⬇ Export</button>
          <button style={S.btnPri} onClick={blank}>+ Add Person</button>
        </div>

            <div style={{fontSize:'11px',color:'#64748b',marginBottom:'10px'}}>Upload passport, Emirates ID, visa, medical — all at once. AI reads each and fills the matching fields.</div>
            <label style={{display:'inline-flex',alignItems:'center',gap:'10px',padding:'10px 20px',background:'#b8972a',color:'#fff',borderRadius:'6px',cursor:'pointer',fontWeight:700,fontSize:'13px',whiteSpace:'nowrap'}}>
              {draft._scanning ? '⏳ Reading documents…' : '📂 Upload Documents (select multiple)'}
              <input type="file" accept="image/*,application/pdf" multiple style={{display:'none'}}
                onChange={async e=>{
                  const files=Array.from(e.target.files||[]); if(!files.length)return;
                  setDraft(d=>({...d,_scanning:true,_scanErr:'',_scanResult:null}));
                  const allUpdates={};
                  const allResults=[];
                  const docTypeGuess = f => {
                    const n=f.name.toLowerCase();
                    if(n.includes('passport')||n.includes('pp')) return 'passport';
                    if(n.includes('eid')||n.includes('emirates')||n.includes('id')) return 'eid';
                    if(n.includes('visa')||n.includes('entry')) return 'visa';
                    if(n.includes('medical')||n.includes('fit')||n.includes('health')) return 'medical';
                    if(n.includes('cicpa')||n.includes('gate')) return 'cicpa';
                    if(n.includes('permit')||n.includes('wp')) return 'work_permit';
                    return 'passport'; // default — passport most common
                  };
                  // Unified field map — covers all document types including medical & training
                  const directMap = {
                    full_name:'full_name', passport_no:'passport_no', nationality:'nationality',
                    date_of_birth:'date_of_birth', passport_expiry:'passport_expiry',
                    emirates_id:'emirates_id', eid_expiry:'eid_expiry',
                    visa_no:'visa_no', visa_type:'visa_type', visa_expiry:'visa_expiry',
                    designation:'designation',
                  };
                  try {
                    for (const file of files) {
                      const result = await aiScanDocument(file, 'other');
                      const detectedType = result.doc_type || 'unknown';
                      // Map standard document fields
                      Object.entries(result).forEach(([k,v]) => {
                        if(directMap[k] && v && !allUpdates[directMap[k]]) allUpdates[directMap[k]] = v;
                      });
                      allResults.push({file:file.name, docType:detectedType, result});
                    }
                    setDraft(d=>({...d,...allUpdates,_scanning:false,_scanResult:allResults}));
                  } catch(ex) { setDraft(d=>({...d,_scanning:false,_scanErr:ex.message})); }
                  e.target.value='';
                }}/>
            </label>
            {draft._scanning&&(
              <div style={{marginTop:'10px',color:'#b8972a',fontSize:'13px',fontWeight:600}}>⏳ Reading documents, please wait…</div>
            )}
            {draft._scanErr&&<div style={{color:'#f87171',fontSize:'12px',marginTop:'8px'}}>⚠ {draft._scanErr}</div>}
            {draft._scanResult&&Array.isArray(draft._scanResult)&&(
              <div style={{marginTop:'10px'}}>
                <div style={{color:'#4ade80',fontWeight:700,fontSize:'13px',marginBottom:'6px'}}>✓ {draft._scanResult.length} document(s) scanned — fields filled below</div>
                {draft._scanResult.map((r,i)=>(
                  <div key={i} style={{background:'#1e293b',borderRadius:'5px',padding:'6px 10px',marginBottom:'4px',fontSize:'11px',color:'#94a3b8'}}>
                    <span style={{color:'#b8972a',fontWeight:700}}>{r.file}</span>
                    <span style={{color:'#4ade80',fontWeight:700,marginLeft:'8px'}}>[{r.docType.replace(/_/g,' ')}]</span>:&nbsp;
                    {Object.entries(r.result).filter(([k,v])=>v&&k!=='doc_type').map(([k,v])=>`${k.replace(/_/g,' ')}: ${v}`).join(' · ')}
                  </div>
                ))}
                <div style={{fontSize:'11px',color:'#64748b',marginTop:'4px'}}>Review the fields below — edit anything if needed — then click Save.</div>
              </div>
            )}
            <div style={{marginTop:'8px',fontSize:'11px',color:'#475569'}}>
              💡 Tip: Name files before uploading for better detection — e.g. <em>passport.jpg</em>, <em>eid.jpg</em>, <em>visa.pdf</em>. Or select all files and AI will do its best to identify each.
            </div>
          </div>
          <Grid cols={3}>
            <Field label="Full Name *"><input value={draft.full_name||''} onChange={e=>setDraft(d=>({...d,full_name:e.target.value}))} style={S.input}/></Field>
            <Field label="Designation"><input value={draft.designation||''} onChange={e=>setDraft(d=>({...d,designation:e.target.value}))} placeholder="Pipe Fitter / Fabricator / Engineer…" style={S.input}/></Field>
            <Field label="Source">
              <select value={draft.source||'supplier'} onChange={e=>setDraft(d=>({...d,source:e.target.value}))} style={S.input}>
                <option value="supplier">Labour Supplier</option>
                <option value="satco_own">SATCO Own Employee</option>
              </select>
            </Field>
            {draft.source==='supplier'&&<>
              <Field label="Supplier Company">
                <input value={draft.supplier_name||''} list="supp-list"
                  onChange={e=>{
                    const name=e.target.value;
                    const nextNo=getNextEmpNo(name);
                    setDraft(d=>({...d,supplier_name:name,supplier_emp_no:d.supplier_emp_no||nextNo}));
                  }}
                  style={S.input}/>
                <datalist id="supp-list">{supplierList.map(s=><option key={s} value={s}/>)}</datalist>
                <div style={{fontSize:'10px',color:'#94a3b8',marginTop:'2px'}}>Emp No auto-assigned when you select supplier</div>
              </Field>
              <Field label="Supplier Emp No">
                <input value={draft.supplier_emp_no||''} onChange={e=>setDraft(d=>({...d,supplier_emp_no:e.target.value}))}
                  placeholder="Auto-assigned e.g. REL1001" style={S.input}/>
                <div style={{fontSize:'10px',color:'#94a3b8',marginTop:'2px'}}>Auto-generated · edit if needed</div>
              </Field>
            </>}
            {draft.source==='satco_own'&&(
              <Field label="SATCO Employee">
                <select value={draft.supplier_emp_no||''} onChange={e=>{
                  const emp=satcoEmps.find(x=>x.employee_id===e.target.value);
                  setDraft(d=>({...d,
                    supplier_emp_no: e.target.value,
                    supplier_name: 'SATCO Arabia',
                    full_name: emp?.full_name||d.full_name,
                    designation: emp?.position||d.designation,
                    nationality: emp?.nationality||d.nationality,
                    date_of_birth: emp?.dob||d.date_of_birth,
                    passport_no: emp?.passport_no||d.passport_no,
                    passport_expiry: emp?.passport_expiry||d.passport_expiry,
                    emirates_id: emp?.eid_no||d.emirates_id,
                    eid_expiry: emp?.eid_expiry||d.eid_expiry,
                    visa_no: emp?.evisa_no||d.visa_no,
                    visa_location: emp?.location||d.visa_location,
                    visa_expiry: emp?.visa_expiry||d.visa_expiry,
                    phone: emp?.mobile||d.phone,
                  }));
                }} style={S.input}>
                  <option value="">Select SATCO employee…</option>
                  {satcoEmps.map(e=><option key={e.employee_id} value={e.employee_id}>{e.employee_id} — {e.full_name}</option>)}
                </select>
                <div style={{fontSize:'10px',color:'#94a3b8',marginTop:'2px'}}>Select to auto-fill all details from HR records</div>
              </Field>
            )}
            <Field label="Nationality"><input value={draft.nationality||''} onChange={e=>setDraft(d=>({...d,nationality:e.target.value}))} style={S.input}/></Field>
            <Field label="Date of Birth"><input type="date" value={draft.date_of_birth||''} onChange={e=>setDraft(d=>({...d,date_of_birth:e.target.value}))} style={S.input}/></Field>
            <Field label="Phone"><input value={draft.phone||''} onChange={e=>setDraft(d=>({...d,phone:e.target.value}))} style={S.input}/></Field>
          </Grid>
          <div style={{fontSize:'11px',fontWeight:800,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Documents</div>
          <Grid cols={4}>
            <Field label="Passport No"><input value={draft.passport_no||''} onChange={e=>setDraft(d=>({...d,passport_no:e.target.value}))} style={S.input}/></Field>
            <Field label="Passport Expiry"><input type="date" value={draft.passport_expiry||''} onChange={e=>setDraft(d=>({...d,passport_expiry:e.target.value}))} style={S.input}/></Field>
            <Field label="Emirates ID"><input value={draft.emirates_id||''} onChange={e=>setDraft(d=>({...d,emirates_id:e.target.value}))} style={S.input}/></Field>
            <Field label="EID Expiry"><input type="date" value={draft.eid_expiry||''} onChange={e=>setDraft(d=>({...d,eid_expiry:e.target.value}))} style={S.input}/></Field>
            <Field label="Visa No"><input value={draft.visa_no||''} onChange={e=>setDraft(d=>({...d,visa_no:e.target.value}))} style={S.input}/></Field>
            <Field label="Visa Type"><input value={draft.visa_type||''} onChange={e=>setDraft(d=>({...d,visa_type:e.target.value}))} placeholder="Employment / Visit / Mission" style={S.input}/></Field>
            <Field label="Visa Issued Emirate">
              <select value={draft.visa_location||''} onChange={e=>setDraft(d=>({...d,visa_location:e.target.value}))} style={S.input}>
                <option value="">Select…</option>
                {UAE_EMIRATES.map(e=><option key={e} value={e}>{e}</option>)}
              </select>
            </Field>
            <Field label="Visa Expiry"><input type="date" value={draft.visa_expiry||''} onChange={e=>setDraft(d=>({...d,visa_expiry:e.target.value}))} style={S.input}/></Field>
          </Grid>
          <Field label="Remarks"><input value={draft.remarks||''} onChange={e=>setDraft(d=>({...d,remarks:e.target.value}))} style={{...S.input,marginBottom:'14px'}}/></Field>
          <div style={{display:'flex',gap:'8px'}}>
            <button style={S.btnPri} onClick={()=>onSave('candidates',draft,()=>setDraft(null))}>Save</button>
            <button style={S.btnSec} onClick={()=>setDraft(null)}>Cancel</button>
          </div>
        </div>
      )}

      <div style={{...S.card,overflow:'hidden'}}>

              const isOnSite = isOnSiteFn(c);
              const vExp = c.visa_expiry&&isExpired(c.visa_expiry);

              return <tr key={c.id} className="hr-row"

                  <div style={{display:'flex',alignItems:'center',gap:'6px',overflow:'hidden'}}>
